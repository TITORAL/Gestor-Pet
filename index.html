<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet - Gestão Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        .bg-pet-sidebar { background-color: #312e81; }
        .fita-azul { width: 3px; height: 20px; background-color: #3b82f6; border-radius: 4px; margin-right: 12px; }
        .calendar-grid-container { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: #e2e8f0; border: 1px solid #e2e8f0; overflow: hidden; transition: max-height 0.3s ease; }
        .calendar-collapsed { max-height: 0; border: none; }
        .calendar-cell { background: #fff; min-height: 50px; padding: 6px; cursor: pointer; border: 1px solid #f8fafc; text-align: center; }
        .calendar-cell.selected { background-color: #eef2ff; border: 1px solid #4338ca; }
        .event-dot { width: 4px; height: 4px; background: #4338ca; border-radius: 50%; display: inline-block; margin-right: 1px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

<!-- CONTAINER PRINCIPAL MOBILE -->
<div class="min-h-screen flex flex-col bg-slate-50">

    <!-- TELA HOME (TODA AZUL / HUB DE NAVEGAÇÃO) -->
    <div id="tab-home" class="flex-1 bg-indigo-900 flex flex-col justify-center items-center px-6 py-12">
        <!-- Brand / Header Superior -->
        <div class="flex items-center gap-3 mb-12 animate-fade-in">
            <i data-lucide="dog" class="w-10 h-10 text-indigo-300"></i>
            <h1 class="text-2xl font-black uppercase tracking-wider text-white">Agenda Pet</h1>
        </div>

        <!-- Menu de Botões Centralizados -->
        <div class="w-full max-w-sm space-y-4">
            <button onclick="switchTab('agenda')" class="w-full bg-white/10 hover:bg-white/15 text-white font-semibold py-4 px-6 rounded-2xl flex items-center justify-between border border-white/10 transition active:scale-[0.98]">
                <div class="flex items-center gap-4">
                    <i data-lucide="calendar" class="w-5 h-5 text-indigo-300"></i>
                    <span class="text-sm tracking-wide">Agendamentos</span>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 opacity-50"></i>
            </button>

            <button onclick="switchTab('clientes')" class="w-full bg-white/10 hover:bg-white/15 text-white font-semibold py-4 px-6 rounded-2xl flex items-center justify-between border border-white/10 transition active:scale-[0.98]">
                <div class="flex items-center gap-4">
                    <i data-lucide="users" class="w-5 h-5 text-indigo-300"></i>
                    <span class="text-sm tracking-wide">Clientes</span>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 opacity-50"></i>
            </button>

            <button onclick="switchTab('dashboard')" class="w-full bg-white/10 hover:bg-white/15 text-white font-semibold py-4 px-6 rounded-2xl flex items-center justify-between border border-white/10 transition active:scale-[0.98]">
                <div class="flex items-center gap-4">
                    <i data-lucide="pie-chart" class="w-5 h-5 text-indigo-300"></i>
                    <span class="text-sm tracking-wide">Dashboard & Finança</span>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 opacity-50"></i>
            </button>

            <button onclick="switchTab('gastos')" class="w-full bg-white/10 hover:bg-white/15 text-white font-semibold py-4 px-6 rounded-2xl flex items-center justify-between border border-white/10 transition active:scale-[0.98]">
                <div class="flex items-center gap-4">
                    <i data-lucide="wallet" class="w-5 h-5 text-indigo-300"></i>
                    <span class="text-sm tracking-wide">Gastos</span>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 opacity-50"></i>
            </button>
        </div>

        <!-- Data de rodapé sutil na home -->
        <div id="home-date" class="text-indigo-300/60 text-xs font-medium mt-12 uppercase tracking-widest"></div>
    </div>

    <!-- ÁREA DAS FUNCIONALIDADES INTERNAS (Aparece ao clicar em uma opção) -->
    <div id="app-content" class="hidden flex-1 flex flex-col">
        <!-- Header Dinâmico de Navegação -->
        <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-40">
            <button onclick="switchTab('home')" class="text-slate-500 hover:text-indigo-600 flex items-center gap-1.5 text-xs font-bold tracking-wider uppercase">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar
            </button>
            <div class="flex items-center"><div class="fita-azul"></div><h2 id="page-title" class="text-sm font-bold text-slate-700 uppercase tracking-wider">Subtela</h2></div>
        </header>

        <!-- Container do Miolo das Abas -->
        <main class="p-4 space-y-6 flex-1">
            
            <!-- ABA: AGENDAMENTO -->
            <div id="tab-agenda" class="hidden space-y-6">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <h3 class="text-xs font-black uppercase mb-4 text-slate-400">Novo Agendamento</h3>
                    <form onsubmit="saveAppointment(event)" class="space-y-3">
                        <input type="text" id="app-tutor" placeholder="Tutor" class="w-full p-3 bg-slate-50 rounded-xl text-sm border-none outline-none focus:ring-2 ring-indigo-500" required>
                        <input type="text" id="app-pet" placeholder="Pet" class="w-full p-3 bg-slate-50 rounded-xl text-sm border-none outline-none focus:ring-2 ring-indigo-500" required>
                        <select id="app-servico" class="w-full p-3 bg-slate-50 rounded-xl text-sm border-none outline-none">
                            <option value="Banho">Banho</option>
                            <option value="Tosa">Tosa</option>
                            <option value="Banho e Tosa">Banho e Tosa</option>
                        </select>
                        <div class="flex gap-2">
                            <input type="date" id="app-data" class="w-1/2 p-3 bg-slate-50 rounded-xl text-xs border-none" required>
                            <input type="time" id="app-hora" class="w-1/2 p-3 bg-slate-50 rounded-xl text-xs border-none" required>
                        </div>
                        <input type="number" id="app-valor" placeholder="Valor R$" step="0.01" class="w-full p-3 bg-slate-50 rounded-xl text-sm border-none" required>
                        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-indigo-700 transition uppercase text-xs tracking-widest">Confirmar</button>
                    </form>
                </div>

                <!-- CARD B.I. AGENDAMENTO EM TEMPO REAL -->
                <div class="bg-indigo-900 p-5 rounded-3xl text-white shadow-xl">
                    <h4 class="text-[10px] font-black uppercase opacity-60 mb-3 tracking-widest">Todos agendamentos</h4>
                    <div class="max-h-60 overflow-y-auto pr-1 text-xs">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-indigo-800 text-[9px] opacity-50 tracking-wider">
                                    <th class="pb-2 font-black">TUTOR</th>
                                    <th class="pb-2 font-black">PET</th>
                                    <th class="pb-2 font-black text-right">SERVIÇO</th>
                                </tr>
                            </thead>
                            <tbody id="bi-table-body" class="divide-y divide-indigo-800/40"></tbody>
                        </table>
                    </div>
                </div>

                <!-- CALENDÁRIO E LISTA -->
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                        <button onclick="toggleCalendar()" class="text-xs font-bold text-indigo-600 flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4"></i> VER CALENDÁRIO</button>
                    </div>
                    <div id="calendar-grid" class="calendar-grid-container calendar-collapsed"></div>
                </div>

                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <h4 class="text-xs font-black text-indigo-600 uppercase mb-3">Agenda do Dia</h4>
                    <div id="day-list" class="space-y-2"></div>
                </div>
            </div>

            <!-- ABA: CLIENTES (CADASTRO) -->
            <div id="tab-clientes" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm relative">
                    <form onsubmit="saveClient(event)" class="space-y-4">
                        <div class="flex justify-between items-center border-b pb-3 mb-2">
                            <h3 class="text-xs font-black uppercase text-slate-400">Novo Cliente</h3>
                            <button type="submit" class="bg-indigo-400 text-white font-bold px-4 py-2.5 rounded-xl shadow-sm hover:bg-indigo-500 transition uppercase text-[10px] tracking-widest">
                                Cadastrar Cliente
                            </button>
                        </div>
                        
                        <div class="space-y-3">
                            <input type="text" id="reg-tutor" placeholder="Nome do Tutor" class="w-full p-3.5 bg-slate-50 rounded-xl text-sm border-none outline-none focus:ring-2 ring-indigo-500" required>
                            <input type="text" id="reg-pet" placeholder="Nome do Pet" class="w-full p-3.5 bg-slate-50 rounded-xl text-sm border-none outline-none focus:ring-2 ring-indigo-500" required>
                            <input type="tel" id="reg-zap" placeholder="WhatsApp" class="w-full p-3.5 bg-slate-50 rounded-xl text-sm border-none outline-none focus:ring-2 ring-indigo-500">
                            <input type="text" id="reg-address" placeholder="Endereço" class="w-full p-3.5 bg-slate-50 rounded-xl text-sm border-none outline-none focus:ring-2 ring-indigo-500">
                        </div>
                    </form>
                </div>

                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-sm font-black uppercase tracking-wider text-slate-400">Base de Clientes</h3>
                        <button onclick="toggleClientList()" class="text-xs font-bold text-indigo-600 uppercase flex items-center gap-1.5"><i data-lucide="eye" class="w-4 h-4"></i> <span id="btn-view-text">Ver Clientes</span></button>
                    </div>
                    <div id="client-container" class="hidden grid grid-cols-1 gap-3 pt-3 border-t"></div>
                </div>
            </div>

            <!-- ABA: DASHBOARD (FINANÇAS) -->
            <div id="tab-dashboard" class="hidden space-y-4">
                <div class="p-6 bg-emerald-500 text-white rounded-3xl shadow-md">
                    <p class="text-[9px] font-black uppercase opacity-80 mb-1">Receita Total</p>
                    <h3 class="text-3xl font-black" id="dash-faturamento">R$ 0,00</h3>
                </div>
                <div class="p-6 bg-indigo-600 text-white rounded-3xl shadow-md">
                    <p class="text-[9px] font-black uppercase opacity-80 mb-1">Receita do Dia</p>
                    <h3 class="text-3xl font-black" id="dash-receita-dia">R$ 0,00</h3>
                    <p id="dash-data-completa" class="text-[9px] mt-1 opacity-70 font-bold uppercase"></p>
                </div>
                <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                    <h4 class="text-[10px] font-black uppercase text-slate-400 mb-4 tracking-widest text-center">Desempenho de Serviços</h4>
                    <div class="h-60"><canvas id="chartServicos"></canvas></div>
                </div>
            </div>

            <!-- ABA: GASTOS -->
            <div id="tab-gastos" class="hidden space-y-6">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <h3 class="text-xs font-black uppercase mb-4 text-slate-400">Nova Despesa</h3>
                    <form onsubmit="saveExpense(event)" class="space-y-3">
                        <input type="text" id="exp-description" placeholder="Descrição da Despesa" class="w-full p-3 bg-slate-50 rounded-xl text-sm border-none outline-none focus:ring-2 ring-rose-500" required>
                        <input type="number" id="exp-valor" placeholder="Valor R$" step="0.01" class="w-full p-3 bg-slate-50 rounded-xl text-sm border-none outline-none focus:ring-2 ring-rose-500" required>
                        <select id="exp-category" class="w-full p-3 bg-slate-50 rounded-xl text-sm border-none outline-none focus:ring-2 ring-rose-500">
                            <option value="Fixo">Custo Fixo</option>
                            <option value="Variável">Custo Variável</option>
                        </select>
                        <input type="date" id="exp-date" class="w-full p-3 bg-slate-50 rounded-xl text-xs border-none" required>
                        <button type="submit" class="w-full bg-rose-500 text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-rose-600 transition uppercase text-xs tracking-widest">Registrar Saída</button>
                    </form>
                </div>

                <div class="bg-slate-900 p-5 rounded-3xl text-white shadow-xl space-y-3">
                    <div>
                        <p class="text-[9px] font-black uppercase opacity-50 tracking-widest">Total Despendido</p>
                        <h3 id="total-expenses-card" class="text-2xl font-black text-rose-400">R$ 0,00</h3>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800 text-xs">
                        <div>
                            <p class="text-[8px] font-bold uppercase opacity-40">Fixos</p>
                            <p id="fixo-expenses-card" class="font-black text-slate-200">R$ 0,00</p>
                        </div>
                        <div>
                            <p class="text-[8px] font-bold uppercase opacity-40">Variáveis</p>
                            <p id="variavel-expenses-card" class="font-black text-slate-200">R$ 0,00</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <h4 class="text-xs font-black text-rose-500 uppercase mb-3 tracking-widest">Fluxo de Saídas</h4>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <tbody id="expenses-table-body" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script>
    let appointments = JSON.parse(localStorage.getItem('pet_apps')) || [];
    let registeredClients = JSON.parse(localStorage.getItem('pet_clients_reg')) || [];
    let expenses = JSON.parse(localStorage.getItem('pet_expenses')) || [];
    let selectedDate = new Date().toISOString().split('T')[0];
    let serviceChart;

    // UX Hub Router Móvel
    function switchTab(tab) {
        const homeView = document.getElementById('tab-home');
        const contentArea = document.getElementById('app-content');
        
        // Esconde sub-abas internas preliminarmente
        document.getElementById('tab-agenda').classList.add('hidden');
        document.getElementById('tab-clientes').classList.add('hidden');
        document.getElementById('tab-dashboard').classList.add('hidden');
        document.getElementById('tab-gastos').classList.add('hidden');

        if (tab === 'home') {
            contentArea.classList.add('hidden');
            homeView.classList.remove('hidden');
            localStorage.setItem('active_pet_tab', 'home');
        } else {
            homeView.classList.add('hidden');
            contentArea.classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            
            const title = document.getElementById('page-title');
            if(tab === 'agenda') title.innerText = 'Agendamentos';
            if(tab === 'clientes') title.innerText = 'Clientes & Cadastro';
            if(tab === 'dashboard') title.innerText = 'Dashboard & Finança';
            if(tab === 'gastos') title.innerText = 'Gestão de Gastos';
            
            localStorage.setItem('active_pet_tab', tab);

            if(tab === 'dashboard') renderDashboard();
            if(tab === 'gastos') renderExpenses();
        }
    }

    // --- AGENDAMENTO ---
    function saveAppointment(e) {
        e.preventDefault();
        const app = {
            tutor: document.getElementById('app-tutor').value,
            pet: document.getElementById('app-pet').value,
            servico: document.getElementById('app-servico').value,
            data: document.getElementById('app-data').value,
            hora: document.getElementById('app-hora').value,
            valor: parseFloat(document.getElementById('app-valor').value)
        };
        appointments.push(app);
        localStorage.setItem('pet_apps', JSON.stringify(appointments));
        e.target.reset();
        renderBiPanel();
        renderDayList(app.data);
    }

    function renderBiPanel() {
        const tableBody = document.getElementById('bi-table-body');
        if (!tableBody) return;
        tableBody.innerHTML = appointments.length === 0 
            ? `<tr><td colspan="3" class="text-center py-4 opacity-40 italic">Nenhum agendamento ativo.</td></tr>`
            : appointments.map(app => `
                <tr class="hover:bg-indigo-800/30">
                    <td class="py-2 font-bold">${app.tutor}</td>
                    <td class="py-2 opacity-80">${app.pet}</td>
                    <td class="py-2 text-right font-semibold text-indigo-300">${app.servico}</td>
                </tr>
            `).join('');
    }

    function toggleCalendar() {
        document.getElementById('calendar-grid').classList.toggle('calendar-collapsed');
        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        if (!grid) return; grid.innerHTML = '';
        const date = new Date();
        const days = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
        for (let i = 1; i <= days; i++) {
            const dStr = `2026-06-${String(i).padStart(2, '0')}`;
            const count = appointments.filter(a => a.data === dStr).length;
            grid.innerHTML += `<div onclick="renderDayList('${dStr}')" class="calendar-cell ${selectedDate === dStr ? 'selected' : ''}"><span class="text-xs font-bold">${i}</span><div class="mt-0.5 flex justify-center">${'<span class="event-dot"></span>'.repeat(count)}</div></div>`;
        }
    }

    function renderDayList(date) {
        selectedDate = date;
        const list = document.getElementById('day-list');
        if (!list) return;
        const filtered = appointments.filter(a => a.data === date);
        list.innerHTML = filtered.length ? '' : '<p class="text-xs text-slate-400 italic py-2">Sem serviços hoje.</p>';
        filtered.forEach(a => {
            list.innerHTML += `<div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs"><span class="font-bold">${a.hora} - ${a.pet} <span class="opacity-50">(${a.tutor})</span></span><span class="text-indigo-600 font-black">R$ ${a.valor.toFixed(2)}</span></div>`;
        });
        renderCalendar();
    }

    // --- CADASTRO DE CLIENTES ---
    function saveClient(e) {
        e.preventDefault();
        const client = {
            tutor: document.getElementById('reg-tutor').value,
            pet: document.getElementById('reg-pet').value,
            zap: document.getElementById('reg-zap').value,
            address: document.getElementById('reg-address').value
        };
        registeredClients.push(client);
        localStorage.setItem('pet_clients_reg', JSON.stringify(registeredClients));
        e.target.reset();
        alert("Cliente cadastrado!");
        if(!document.getElementById('client-container').classList.contains('hidden')) toggleClientList();
    }

    function toggleClientList() {
        const container = document.getElementById('client-container');
        const btnText = document.getElementById('btn-view-text');
        container.classList.toggle('hidden');
        if(!container.classList.contains('hidden')) {
            btnText.innerText = "Fechar Lista";
            container.innerHTML = registeredClients.length ? '' : '<p class="text-center py-6 text-slate-400 italic text-xs">Nenhum cliente.</p>';
            registeredClients.forEach(c => {
                container.innerHTML += `
                    <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 flex items-center gap-3">
                        <div class="w-8 h-8 bg-white rounded-full flex shrink-0 items-center justify-center shadow-sm text-indigo-600"><i data-lucide="user" class="w-4 h-4"></i></div>
                        <div class="text-left overflow-hidden">
                            <p class="font-black text-indigo-900 text-xs truncate">${c.tutor}</p>
                            <p class="text-[9px] text-indigo-400 font-bold uppercase">Pet: ${c.pet}</p>
                            ${c.address ? `<p class="text-[8px] text-slate-400 truncate mt-0.5">${c.address}</p>` : ''}
                        </div>
                    </div>`;
            });
            lucide.createIcons();
        } else { btnText.innerText = "Ver Clientes"; }
    }

    // --- FINANÇAS ---
    function renderDashboard() {
        const now = new Date();
        const hojeStr = now.toISOString().split('T')[0];
        
        const receitaDia = appointments.filter(a => a.data === hojeStr).reduce((s, a) => s + a.valor, 0);
        document.getElementById('dash-receita-dia').innerText = `R$ ${receitaDia.toFixed(2)}`;
        document.getElementById('dash-data-completa').innerText = now.toLocaleDateString('pt-BR', {day:'2-digit', month:'long', year:'numeric'});

        const receitaMes = appointments.reduce((s, a) => s + a.valor, 0);
        document.getElementById('dash-faturamento').innerText = `R$ ${receitaMes.toFixed(2)}`;

        const contagem = { 'Banho': 0, 'Tosa': 0, 'Banho e Tosa': 0 };
        appointments.forEach(a => { if(contagem[a.servico] !== undefined) contagem[a.servico]++ });

        const canvas = document.getElementById('chartServicos'); if(!canvas) return;
        const ctx = canvas.getContext('2d');
        if(serviceChart) serviceChart.destroy();
        serviceChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: Object.keys(contagem),
                datasets: [{ data: Object.values(contagem), backgroundColor: '#6366f1', borderRadius: 8 }]
            },
            options: { 
                maintainAspectRatio: false, plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false } } }
            }
        });
    }

    // --- GASTOS ---
    function saveExpense(e) {
        e.preventDefault();
        const expense = {
            id: Date.now(),
            description: document.getElementById('exp-description').value,
            valor: parseFloat(document.getElementById('exp-valor').value),
            category: document.getElementById('exp-category').value,
            date: document.getElementById('exp-date').value
        };
        expenses.push(expense);
        localStorage.setItem('pet_expenses', JSON.stringify(expenses));
        e.target.reset();
        renderExpenses();
    }

    function deleteExpense(id) {
        expenses = expenses.filter(exp => exp.id !== id);
        localStorage.setItem('pet_expenses', JSON.stringify(expenses));
        renderExpenses();
    }

    function renderExpenses() {
        const tableBody = document.getElementById('expenses-table-body'); if(!tableBody) return;
        const total = expenses.reduce((acc, cur) => acc + cur.valor, 0);
        const fixo = expenses.filter(e => e.category === 'Fixo').reduce((acc, cur) => acc + cur.valor, 0);
        const variavel = expenses.filter(e => e.category === 'Variável').reduce((acc, cur) => acc + cur.valor, 0);

        document.getElementById('total-expenses-card').innerText = `R$ ${total.toFixed(2)}`;
        document.getElementById('fixo-expenses-card').innerText = `R$ ${fixo.toFixed(2)}`;
        document.getElementById('variavel-expenses-card').innerText = `R$ ${variavel.toFixed(2)}`;

        if (expenses.length === 0) {
            tableBody.innerHTML = `<tr><td class="text-center py-6 text-slate-400 italic">Nenhum gasto.</td></tr>`;
            return;
        }
        expenses.sort((a,b) => new Date(b.date) - new Date(a.date));

        tableBody.innerHTML = expenses.map(exp => {
            const dateFormatted = exp.date.split('-').reverse().slice(0,2).join('/');
            return `
                <tr class="hover:bg-slate-50">
                    <td class="py-2.5 text-slate-400 text-[11px]">${dateFormatted}</td>
                    <td class="py-2.5 font-semibold text-slate-700">${exp.description} <span class="text-[9px] opacity-50 block">${exp.category}</span></td>
                    <td class="py-2.5 text-right font-bold text-rose-600">R$ ${exp.valor.toFixed(2)}</td>
                    <td class="py-2.5 text-center">
                        <button onclick="deleteExpense(${exp.id})" class="text-slate-300 hover:text-rose-600 p-1"><i data-lucide="trash-2" class="w-3.5 h-3.5 mx-auto"></i></button>
                    </td>
                </tr>`;
        }).join('');
        lucide.createIcons();
    }

    // --- INIT ---
    window.onload = () => {
        const d = new Date();
        const dateString = d.toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long'});
        document.getElementById('home-date').innerText = dateString;
        
        renderDayList(selectedDate);
        renderBiPanel();
        renderExpenses();

        // Roteador de estado: preserva a aba atual ou inicia no Hub Principal ('home')
        const savedTab = localStorage.getItem('active_pet_tab') || 'home';
        switchTab(savedTab);
        lucide.createIcons();
    };
</script>
</body>
</html>

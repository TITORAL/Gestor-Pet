<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet - Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .hidden { display: none !important; }
        .bg-pet-sidebar { background-color: #312e81; } 
        .bg-pet-active { background-color: #4338ca; }
        .fita-azul { width: 3px; height: 20px; background-color: #3b82f6; border-radius: 4px; margin-right: 12px; }
        
        .header-date-badge {
            background-color: #e0f2fe; color: #0369a1;
            padding: 8px 16px; border-radius: 12px; font-weight: 600;
        }

        .client-card {
            background: #fff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f1f5f9;
        }
        .client-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-color: #e2e8f0;
        }
        
        .calendar-grid-container {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 1px; background-color: #e2e8f0; border: 1px solid #e2e8f0;
        }
        .calendar-cell {
            background: white; min-height: 80px; padding: 8px;
            transition: all 0.2s; cursor: pointer;
        }
        .calendar-cell:hover { background-color: #f1f5f9; }
        .calendar-cell.selected { background-color: #eef2ff; border: 1px solid #4338ca; }
        .cell-day-number { font-size: 13px; font-weight: 800; color: #1e293b; margin-bottom: 4px; }
        .event-dot { width: 6px; height: 6px; background: #4338ca; border-radius: 50%; display: inline-block; margin-right: 2px; }

        .status-indicator { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 6px; }
        .status-done { background-color: #10b981; box-shadow: 0 0 8px #10b98166; }
        .status-canceled { background-color: #ef4444; box-shadow: 0 0 8px #ef444466; }

        .btn-status { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .btn-check { background-color: #ecfdf5; color: #10b981; border: 1px solid #10b981; }
        .btn-check.active { background-color: #10b981; color: white; }
        .btn-x { background-color: #fef2f2; color: #ef4444; border: 1px solid #ef4444; }
        .btn-x.active { background-color: #ef4444; color: white; }

        @media (max-width: 768px) { .sidebar-desktop { display: none; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="main-app" class="flex flex-col md:flex-row h-screen overflow-hidden">
        
        <aside class="sidebar-desktop w-64 bg-pet-sidebar text-white flex flex-col p-6">
            <div class="flex items-center gap-3 mb-10">
                <i data-lucide="dog" class="w-8 h-8 text-indigo-300"></i>
                <h1 class="text-lg font-black tracking-tight uppercase">Agenda Pet</h1>
            </div>
            <nav class="space-y-1">
                <button onclick="switchTab('agenda')" id="btn-agenda-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold">
                    <i data-lucide="calendar" class="w-4 h-4"></i> Agendamentos
                </button>
                <button onclick="switchTab('clientes')" id="btn-clientes-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70">
                    <i data-lucide="users" class="w-4 h-4"></i> Clientes
                </button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70">
                    <i data-lucide="pie-chart" class="w-4 h-4"></i> Financeiro
                </button>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white border-b px-8 py-5 flex justify-between items-center sticky top-0 z-40">
                <div class="flex items-center">
                    <div class="fita-azul"></div>
                    <h2 id="page-title" class="text-lg font-light text-slate-500 uppercase tracking-[0.2em]">Agendamento</h2>
                </div>
                <div class="text-right">
                    <span id="current-date" class="header-date-badge text-sm"></span>
                </div>
            </header>

            <main class="p-4 md:p-8 max-w-[1600px] w-full mx-auto space-y-6">

                <div id="tab-agenda" class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <div class="lg:col-span-3">
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <h3 id="form-title" class="font-bold text-slate-800 text-xs uppercase mb-4 tracking-widest">Agendar</h3>
                            <form id="appointment-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
                                <input type="hidden" id="edit-id">
                                <input type="text" id="clientNameSearch" placeholder="Tutor" oninput="autoFillPet(this.value)" required class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <input type="text" id="petName" placeholder="Pet" required class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="date" id="serviceDate" required class="w-full px-3 py-3 bg-slate-50 border-none rounded-2xl text-xs outline-none">
                                    <input type="time" id="serviceTime" required class="w-full px-3 py-3 bg-slate-50 border-none rounded-2xl text-xs outline-none">
                                </div>
                                <select id="serviceType" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-sm outline-none">
                                    <option value="Banho">Banho</option>
                                    <option value="Tosa">Tosa</option>
                                    <option value="Completo">Banho e Tosa</option>
                                </select>
                                <input type="number" id="serviceValue" placeholder="Valor R$" step="0.01" required class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-sm outline-none">
                                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all text-xs uppercase tracking-widest">Confirmar</button>
                            </form>
                        </div>
                    </div>

                    <div class="lg:col-span-9 space-y-6">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                            <div class="p-6 border-b border-slate-50 flex justify-between items-center">
                                <span id="cal-month" class="text-sm font-black uppercase tracking-widest text-slate-800"></span>
                                <div class="flex gap-4">
                                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-xl transition"><i data-lucide="chevron-left" class="w-5 h-5 text-slate-400"></i></button>
                                    <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-xl transition"><i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i></button>
                                </div>
                            </div>
                            <div id="calendar-grid" class="calendar-grid-container"></div>
                        </div>

                        <div id="day-details-card" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 hidden">
                            <div class="flex justify-between items-center mb-6">
                                <h3 id="selected-day-title" class="font-bold text-indigo-600 text-xs uppercase tracking-widest">Serviços</h3>
                                <button onclick="closeDayDetails()" class="text-slate-300 hover:text-slate-500"><i data-lucide="x" class="w-5 h-5"></i></button>
                            </div>
                            <div id="day-appointments-list" class="space-y-3"></div>
                        </div>
                    </div>
                </div>

                <div id="tab-clientes" class="hidden bg-white p-6 md:p-12 rounded-[2.5rem] shadow-sm border border-slate-100 min-h-[70vh]">
                    <div class="max-w-4xl mx-auto">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8">
                            <div>
                                <h3 class="text-2xl font-black text-slate-800 tracking-tight">Base de Clientes</h3>
                                <p class="text-slate-400 text-sm">Gerencie tutores e pets registrados.</p>
                            </div>
                            <button onclick="toggleClientForm()" class="bg-indigo-600 text-white px-6 py-3 rounded-2xl text-xs font-bold uppercase tracking-widest shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all flex items-center gap-2">
                                <i data-lucide="plus" class="w-4 h-4"></i> Novo Cadastro
                            </button>
                        </div>

                        <div class="relative mb-10">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                            </div>
                            <input type="text" id="clientSearchInput" oninput="renderClientList(this.value)" placeholder="Digite o nome para buscar..." class="w-full pl-11 pr-4 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none text-sm focus:bg-white focus:border-indigo-200 transition-all">
                        </div>

                        <div id="client-form-container" class="hidden mb-12 bg-slate-50 p-8 rounded-3xl border border-dashed border-slate-200">
                            <form id="reg-client-form" onsubmit="saveClient(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input type="hidden" id="edit-client-index">
                                <div class="space-y-1">
                                    <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Nome do Tutor</label>
                                    <input type="text" id="regClientName" required class="w-full px-5 py-4 bg-white border border-slate-200 rounded-2xl outline-none text-sm">
                                </div>
                                <div class="space-y-1">
                                    <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Nome do Pet</label>
                                    <input type="text" id="regPet" required class="w-full px-5 py-4 bg-white border border-slate-200 rounded-2xl outline-none text-sm">
                                </div>
                                <div class="space-y-1">
                                    <label class="text-[10px] font-black uppercase text-slate-400 ml-2">WhatsApp</label>
                                    <input type="tel" id="regPhone" required class="w-full px-5 py-4 bg-white border border-slate-200 rounded-2xl outline-none text-sm">
                                </div>
                                <div class="space-y-1">
                                    <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Endereço Completo</label>
                                    <input type="text" id="regAddress" placeholder="Rua, Número, Bairro" class="w-full px-5 py-4 bg-white border border-slate-200 rounded-2xl outline-none text-sm">
                                </div>
                                <div class="md:col-span-2 flex justify-end gap-3 mt-2">
                                    <button type="button" onclick="toggleClientForm()" class="px-6 py-3 text-xs font-bold text-slate-400 uppercase">Cancelar</button>
                                    <button class="bg-indigo-900 text-white px-8 py-3 rounded-xl text-xs font-bold uppercase tracking-widest">Salvar Registro</button>
                                </div>
                            </form>
                        </div>

                        <div id="client-list-bi" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    </div>
                </div>

                <div id="tab-dashboard" class="hidden bg-white p-10 rounded-[2.5rem] shadow-sm border border-slate-100 min-h-[600px]">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="p-8 bg-emerald-50 rounded-3xl border border-emerald-100">
                            <p class="text-[10px] font-black text-emerald-600 uppercase mb-2">Receita Total</p>
                            <h3 class="text-3xl font-black text-emerald-700" id="kpi-ganhos">R$ 0,00</h3>
                        </div>
                        <div class="p-8 bg-rose-50 rounded-3xl border border-rose-100">
                            <p class="text-[10px] font-black text-rose-600 uppercase mb-2">Cancelados</p>
                            <h3 class="text-3xl font-black text-rose-700" id="kpi-perdas">R$ 0,00</h3>
                        </div>
                        <div class="p-8 bg-indigo-50 rounded-3xl border border-indigo-100">
                            <p class="text-[10px] font-black text-indigo-600 uppercase mb-2">Saldo Previsto</p>
                            <h3 class="text-3xl font-black text-indigo-700" id="kpi-saldo">R$ 0,00</h3>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
        let appointments = JSON.parse(localStorage.getItem('pet_appointments')) || [];
        let clients = JSON.parse(localStorage.getItem('pet_clients')) || [];
        let currentCalDate = new Date();
        let selectedDateStr = "";

        function switchTab(tab) {
            localStorage.setItem('pet_last_tab', tab);
            ['agenda', 'clientes', 'dashboard'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}-dt`).classList.remove('bg-pet-active');
                document.getElementById(`btn-${t}-dt`).style.opacity = "0.7";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}-dt`).classList.add('bg-pet-active');
            document.getElementById(`btn-${tab}-dt`).style.opacity = "1";
            document.getElementById('page-title').innerText = { 'agenda': 'Agendamentos', 'clientes': 'Clientes', 'dashboard': 'Financeiro' }[tab];
            if(tab === 'clientes') { document.getElementById('clientSearchInput').value = ""; renderClientList(); }
            if(tab === 'dashboard') updateDashboard();
            if(tab === 'agenda') renderCalendar();
            lucide.createIcons();
        }

        function renderClientList(filterText = "") {
            const list = document.getElementById('client-list-bi');
            list.innerHTML = '';
            const filtered = clients.filter(c => c.name.toLowerCase().includes(filterText.toLowerCase()));
            
            if(filtered.length === 0) {
                list.innerHTML = `<div class="col-span-full py-10 text-center opacity-30"><p class="text-xs font-bold uppercase tracking-widest">Nenhum cliente encontrado</p></div>`;
                return;
            }

            filtered.sort((a,b) => a.name.localeCompare(b.name)).forEach((c) => {
                const realIndex = clients.indexOf(c);
                list.innerHTML += `
                    <div class="client-card p-6 rounded-[2rem] flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center font-black text-lg">${c.name.charAt(0)}</div>
                            <div class="max-w-[180px]">
                                <h4 class="font-bold text-slate-800 leading-tight">${c.name}</h4>
                                <div class="flex flex-col gap-0.5 mt-1">
                                    <span class="text-[11px] font-black text-indigo-500 uppercase tracking-tighter">${c.pet}</span>
                                    <span class="text-[12px] font-semibold text-slate-500 flex items-center gap-1"><i data-lucide="phone" class="w-3 h-3"></i> ${c.phone}</span>
                                    ${c.address ? `<span class="text-[10px] font-medium text-slate-400 flex items-start gap-1 mt-1 leading-tight"><i data-lucide="map-pin" class="w-2.5 h-2.5 mt-0.5"></i> ${c.address}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="editClient(${realIndex})" class="p-2 text-slate-300 hover:text-indigo-600 transition-colors"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                            <button onclick="deleteClient(${realIndex})" class="p-2 text-slate-300 hover:text-rose-500 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>`;
            });
            lucide.createIcons();
        }

        function toggleClientForm() { document.getElementById('client-form-container').classList.toggle('hidden'); }

        function editClient(index) {
            const c = clients[index];
            document.getElementById('edit-client-index').value = index;
            document.getElementById('regClientName').value = c.name;
            document.getElementById('regPet').value = c.pet;
            document.getElementById('regPhone').value = c.phone;
            document.getElementById('regAddress').value = c.address || "";
            if(document.getElementById('client-form-container').classList.contains('hidden')) toggleClientForm();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteClient(index) { if(confirm("Excluir cliente?")) { clients.splice(index, 1); localStorage.setItem('pet_clients', JSON.stringify(clients)); renderClientList(document.getElementById('clientSearchInput').value); } }

        function saveClient(e) {
            e.preventDefault();
            const index = document.getElementById('edit-client-index').value;
            const data = { 
                name: document.getElementById('regClientName').value, 
                pet: document.getElementById('regPet').value, 
                phone: document.getElementById('regPhone').value,
                address: document.getElementById('regAddress').value 
            };
            if(index !== "") clients[index] = data; else clients.push(data);
            localStorage.setItem('pet_clients', JSON.stringify(clients));
            e.target.reset(); document.getElementById('edit-client-index').value = "";
            toggleClientForm(); renderClientList(document.getElementById('clientSearchInput').value);
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            const year = currentCalDate.getFullYear(), month = currentCalDate.getMonth();
            document.getElementById('cal-month').innerText = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(currentCalDate).toUpperCase();
            const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div class="calendar-cell bg-slate-50/50"></div>';
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dailyApps = appointments.filter(a => a.serviceDate === dateStr);
                let dots = dailyApps.map(() => '<span class="event-dot"></span>').join('');
                grid.innerHTML += `<div onclick="showDayDetails('${dateStr}')" class="calendar-cell ${selectedDateStr === dateStr ? 'selected' : ''}"><div class="cell-day-number">${day}</div><div class="flex flex-wrap gap-0.5">${dots}</div></div>`;
            }
        }

        function showDayDetails(dateStr) {
            selectedDateStr = dateStr; document.getElementById('day-details-card').classList.remove('hidden'); renderCalendar();
            const list = document.getElementById('day-appointments-list');
            const dailyApps = appointments.filter(a => a.serviceDate === dateStr);
            list.innerHTML = dailyApps.length ? '' : '<p class="text-slate-400 text-sm italic">Vazio.</p>';
            dailyApps.sort((a,b) => a.serviceTime.localeCompare(b.serviceTime)).forEach(app => {
                const isConcluido = app.status === 'concluido', isCancelado = app.status === 'cancelado';
                let statusBadge = isConcluido ? '<span class="status-indicator status-done"></span>' : (isCancelado ? '<span class="status-indicator status-canceled"></span>' : "");
                list.innerHTML += `<div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <div class="flex items-center gap-4">
                        <span class="text-xs font-black text-indigo-600 bg-white px-2 py-1 rounded-lg border">${app.serviceTime}</span>
                        <div><p class="text-sm font-black text-slate-800">${app.petName}<span class="text-[10px] text-slate-400 font-normal ml-1">(${app.clientName})${statusBadge}</span></p>
                        <p class="text-[12px] font-bold text-indigo-500 uppercase">${app.serviceType}</p></div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="updateStatus(${app.id}, 'concluido')" class="btn-status btn-check ${isConcluido ? 'active' : ''}"><i data-lucide="check" class="w-4 h-4"></i></button>
                        <button onclick="updateStatus(${app.id}, 'cancelado')" class="btn-status btn-x ${isCancelado ? 'active' : ''}"><i data-lucide="x" class="w-4 h-4"></i></button>
                        <button onclick="editApp(${app.id})" class="btn-status bg-blue-50 text-blue-600 border border-blue-100"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                    </div>
                </div>`;
            });
            lucide.createIcons();
        }

        function handleFormSubmit(e) {
            e.preventDefault(); 
            const editId = document.getElementById('edit-id').value;
            const date = document.getElementById('serviceDate').value;
            const time = document.getElementById('serviceTime').value;

            // BLOQUEIO DE HORÁRIO REPETIDO
            const isConflict = appointments.some(a => 
                a.serviceDate === date && 
                a.serviceTime === time && 
                a.id != editId &&
                a.status !== 'cancelado'
            );

            if(isConflict) {
                alert("Atenção: Já existe um agendamento para este dia e horário!");
                return;
            }

            const data = { id: editId ? parseInt(editId) : Date.now(), clientName: document.getElementById('clientNameSearch').value, petName: document.getElementById('petName').value, serviceType: document.getElementById('serviceType').value, serviceValue: parseFloat(document.getElementById('serviceValue').value), serviceDate: date, serviceTime: time, status: editId ? (appointments.find(a => a.id == editId).status) : 'pendente' };
            if (editId) appointments = appointments.map(a => a.id == editId ? data : a); else appointments.push(data);
            localStorage.setItem('pet_appointments', JSON.stringify(appointments)); e.target.reset(); document.getElementById('edit-id').value = ''; renderCalendar(); if(selectedDateStr) showDayDetails(selectedDateStr);
        }

        function updateStatus(id, status) { appointments = appointments.map(a => a.id === id ? {...a, status: a.status === status ? 'pendente' : status} : a); localStorage.setItem('pet_appointments', JSON.stringify(appointments)); showDayDetails(selectedDateStr); }
        function editApp(id) { const app = appointments.find(a => a.id === id); document.getElementById('edit-id').value = app.id; document.getElementById('clientNameSearch').value = app.clientName; document.getElementById('petName').value = app.petName; document.getElementById('serviceType').value = app.serviceType; document.getElementById('serviceValue').value = app.serviceValue; document.getElementById('serviceDate').value = app.serviceDate; document.getElementById('serviceTime').value = app.serviceTime; window.scrollTo({ top: 0, behavior: 'smooth' }); }
        function closeDayDetails() { selectedDateStr = ""; document.getElementById('day-details-card').classList.add('hidden'); renderCalendar(); }
        function changeMonth(dir) { currentCalDate.setMonth(currentCalDate.getMonth() + dir); closeDayDetails(); }
        function updateDashboard() { let g = 0, p = 0; appointments.forEach(a => { if(a.status === 'concluido') g += a.serviceValue; else if(a.status === 'cancelado') p += a.serviceValue; }); document.getElementById('kpi-ganhos').innerText = `R$ ${g.toFixed(2)}`; document.getElementById('kpi-perdas').innerText = `R$ ${p.toFixed(2)}`; document.getElementById('kpi-saldo').innerText = `R$ ${(g-p).toFixed(2)}`; }
        function autoFillPet(name) { const found = clients.find(c => c.name.toLowerCase().includes(name.toLowerCase())); if (found && name.length > 2) document.getElementById('petName').value = found.pet; }

        window.onload = () => {
            const d = new Date();
            const formatada = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('current-date').innerText = formatada.split(' ').map(w => w.length > 2 ? w.charAt(0).toUpperCase() + w.slice(1) : w).join(' ');
            const lastTab = localStorage.getItem('pet_last_tab') || 'agenda';
            switchTab(lastTab);
        };
    </script>
</body>
</html>

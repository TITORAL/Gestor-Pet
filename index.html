<!DOCTYPE html>
<html lang="pt-BR" style="overflow-x: hidden;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Pet - Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        html, body { 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden !important; 
            width: 100% !important;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .bg-pet-sidebar { background-color: #312e81; } 
        .bg-pet-active { background-color: #4338ca; }
        .fita-azul { width: 3px; height: 20px; background-color: #3b82f6; border-radius: 4px; margin-right: 12px; }
        
        .header-date-badge {
            background-color: #e0f2fe; color: #0369a1;
            padding: 8px 16px; border-radius: 12px; font-weight: 600;
        }

        .client-card {
            background: #fff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f1f5f9;
        }
        
        .calendar-grid-container {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 1px; background-color: #e2e8f0; border: 1px solid #e2e8f0;
            transition: max-height 0.3s ease-out;
            overflow: hidden;
        }

        .calendar-collapsed { max-height: 0; border: none; }

        .calendar-cell {
            background: white; min-height: 80px; padding: 8px;
            transition: all 0.2s; cursor: pointer;
        }
        .calendar-cell.selected { background-color: #eef2ff; border: 1px solid #4338ca; }
        .cell-day-number { font-size: 13px; font-weight: 800; color: #1e293b; margin-bottom: 4px; }
        .event-dot { width: 6px; height: 6px; background: #4338ca; border-radius: 50%; display: inline-block; margin-right: 2px; }

        .status-indicator { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 6px; }
        .status-done { background-color: #10b981; }
        .status-canceled { background-color: #ef4444; }

        .btn-status { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .btn-check { background-color: #ecfdf5; color: #10b981; border: 1px solid #10b981; }
        .btn-check.active { background-color: #10b981; color: white; }
        .btn-x { background-color: #fef2f2; color: #ef4444; border: 1px solid #ef4444; }
        .btn-x.active { background-color: #ef4444; color: white; }

        @media (max-width: 768px) { 
            .sidebar-desktop { display: none; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800" style="overflow-x: hidden;">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar Desktop -->
        <aside class="sidebar-desktop w-64 bg-pet-sidebar text-white flex flex-col p-6">
            <div class="flex items-center gap-3 mb-10">
                <i data-lucide="dog" class="w-8 h-8 text-indigo-300"></i>
                <h1 class="text-lg font-black tracking-tight uppercase">Agenda Pet</h1>
            </div>
            <nav class="space-y-1">
                <button onclick="switchTab('agenda')" id="btn-agenda-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70">
                    <i data-lucide="calendar" class="w-4 h-4"></i> Agendamentos
                </button>
                <button onclick="switchTab('clientes')" id="btn-clientes-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70">
                    <i data-lucide="users" class="w-4 h-4"></i> Clientes
                </button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70">
                    <i data-lucide="pie-chart" class="w-4 h-4"></i> Dashboard & Finança
                </button>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col overflow-y-auto">
            <!-- Header Principal (Escondido no Mobile via md:flex) -->
            <header id="header-main" class="hidden md:flex bg-white border-b px-8 py-5 justify-between items-center sticky top-0 z-40">
                <div class="flex items-center">
                    <div class="fita-azul"></div>
                    <h2 id="page-title" class="text-lg font-light text-slate-500 uppercase tracking-[0.2em]">Agendamento</h2>
                </div>
                <div class="text-right">
                    <span id="current-date" class="header-date-badge text-sm"></span>
                </div>
            </header>

            <main class="max-w-7xl w-full mx-auto p-4 md:p-8 overflow-x-hidden">

                <!-- Tela Home Mobile -->
                <div id="tab-home" class="space-y-6 md:hidden">
                    <div class="flex items-center gap-3 mb-6">
                        <i data-lucide="dog" class="w-8 h-8 text-indigo-600"></i>
                        <h1 class="text-xl font-black tracking-tight uppercase">Agenda Pet</h1>
                    </div>
                    <div class="grid grid-cols-1 gap-4">
                        <button onclick="switchTab('agenda')" class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex items-center gap-4 text-left">
                            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center">
                                <i data-lucide="calendar" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-800 uppercase text-xs tracking-widest">Agenda</h3>
                                <p class="text-[11px] text-slate-400">Ver e criar agendamentos</p>
                            </div>
                        </button>
                        <button onclick="switchTab('clientes')" class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex items-center gap-4 text-left">
                            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center">
                                <i data-lucide="users" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-800 uppercase text-xs tracking-widest">Clientes</h3>
                                <p class="text-[11px] text-slate-400">Base de tutores e pets</p>
                            </div>
                        </button>
                        <button onclick="switchTab('dashboard')" class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex items-center gap-4 text-left">
                            <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center">
                                <i data-lucide="pie-chart" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-800 uppercase text-xs tracking-widest">Dashboard & Finança</h3>
                                <p class="text-[11px] text-slate-400">Relatórios e valores</p>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- Aba Agenda -->
                <div id="tab-agenda" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div class="col-span-12 md:hidden mb-2">
                        <button onclick="switchTab('home')" class="flex items-center gap-2 text-slate-500 font-bold text-xs uppercase bg-white px-4 py-2 rounded-xl border border-slate-100"><i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar</button>
                    </div>
                    <div class="lg:col-span-3">
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <h3 class="font-bold text-slate-800 text-xs uppercase mb-4 tracking-widest">Agendar</h3>
                            <form id="appointment-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
                                <input type="hidden" id="edit-id">
                                <input type="text" id="clientNameSearch" placeholder="Tutor" oninput="autoFillPet(this.value)" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <input type="text" id="petName" placeholder="Pet" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="date" id="serviceDate" class="w-full px-3 py-3 bg-slate-50 border-none rounded-2xl text-xs outline-none">
                                    <input type="time" id="serviceTime" class="w-full px-3 py-3 bg-slate-50 border-none rounded-2xl text-xs outline-none">
                                </div>
                                <select id="serviceType" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-sm">
                                    <option value="Banho">Banho</option>
                                    <option value="Tosa">Tosa</option>
                                    <option value="Completo">Banho e Tosa</option>
                                </select>
                                <input type="number" id="serviceValue" placeholder="Valor R$" step="0.01" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-sm">
                                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl text-xs uppercase tracking-widest">Confirmar</button>
                            </form>
                        </div>
                    </div>
                    <div class="lg:col-span-9 space-y-6">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                            <div class="p-6 border-b border-slate-50 flex justify-between items-center">
                                <span id="cal-month" class="text-sm font-black uppercase text-slate-800"></span>
                                <div class="flex gap-4">
                                    <button onclick="changeMonth(-1)" class="p-2"><i data-lucide="chevron-left" class="w-5 h-5 text-slate-400"></i></button>
                                    <button onclick="changeMonth(1)" class="p-2"><i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i></button>
                                </div>
                            </div>
                            <div id="calendar-grid" class="calendar-grid-container p-1"></div>
                        </div>
                        <div id="day-details-card" class="bg-white p-6 rounded-3xl border border-slate-100">
                            <div id="selected-date-display" class="text-[10px] font-bold text-slate-400 uppercase mb-4">Selecione uma data</div>
                            <div id="day-appointments-list" class="space-y-3"></div>
                        </div>
                    </div>
                </div>

                <!-- Aba Clientes -->
                <div id="tab-clientes" class="hidden space-y-6">
                    <div class="md:hidden"><button onclick="switchTab('home')" class="text-slate-500 font-bold text-xs uppercase bg-white px-4 py-2 rounded-xl border border-slate-100">Voltar</button></div>
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-100">
                        <div id="client-list-bi" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    </div>
                </div>

                <!-- Aba Dashboard -->
                <div id="tab-dashboard" class="hidden space-y-6">
                    <div class="md:hidden"><button onclick="switchTab('home')" class="text-slate-500 font-bold text-xs uppercase bg-white px-4 py-2 rounded-xl border border-slate-100">Voltar</button></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="p-8 bg-emerald-50 rounded-[2rem] border border-emerald-100">
                            <p class="text-[10px] font-black text-emerald-600 uppercase mb-2">Mensal</p>
                            <h3 class="text-4xl font-black text-emerald-700" id="kpi-ganhos">R$ 0,00</h3>
                        </div>
                        <div class="p-8 bg-indigo-50 rounded-[2rem] border border-indigo-100">
                            <p class="text-[10px] font-black text-indigo-600 uppercase mb-2">Dia</p>
                            <h3 class="text-4xl font-black text-indigo-700" id="kpi-receita-dia">R$ 0,00</h3>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
        let appointments = JSON.parse(localStorage.getItem('pet_appointments')) || [];
        let clients = JSON.parse(localStorage.getItem('pet_clients')) || [];
        let currentCalDate = new Date();
        let selectedDateStr = new Date().toISOString().split('T')[0];

        function switchTab(tab) {
            document.querySelectorAll('main > div').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            
            // Menu active state desktop
            document.querySelectorAll('.sidebar-desktop button').forEach(b => b.classList.remove('bg-pet-active', 'opacity-100'));
            const activeBtn = document.getElementById(`btn-${tab}-dt`);
            if(activeBtn) activeBtn.classList.add('bg-pet-active', 'opacity-100');

            if (tab === 'agenda') { renderCalendar(); showDayDetails(selectedDateStr); }
            if (tab === 'clientes') renderClientList();
            if (tab === 'dashboard') updateDashboard();
            lucide.createIcons();
            window.scrollTo(0,0);
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid'); grid.innerHTML = '';
            const year = currentCalDate.getFullYear(), month = currentCalDate.getMonth();
            document.getElementById('cal-month').innerText = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(currentCalDate).toUpperCase();
            const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div class="calendar-cell bg-slate-50/50"></div>';
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dailyApps = appointments.filter(a => a.serviceDate === dateStr);
                let dots = dailyApps.map(() => '<span class="event-dot"></span>').join('');
                grid.innerHTML += `<div onclick="showDayDetails('${dateStr}')" class="calendar-cell ${selectedDateStr === dateStr ? 'selected' : ''}"><div class="cell-day-number">${day}</div><div class="flex flex-wrap gap-0.5">${dots}</div></div>`;
            }
        }

        function showDayDetails(dateStr) {
            selectedDateStr = dateStr; renderCalendar();
            const list = document.getElementById('day-appointments-list');
            const dailyApps = appointments.filter(a => a.serviceDate === dateStr);
            list.innerHTML = dailyApps.length ? '' : '<p class="text-slate-400 text-sm italic text-center py-8">Nenhum registro.</p>';
            dailyApps.forEach(app => {
                list.innerHTML += `<div class="p-4 bg-slate-50 rounded-2xl flex justify-between items-center border border-slate-100">
                    <div><p class="text-sm font-black text-slate-800">${app.petName} <span class="text-[10px] text-slate-400">(${app.clientName})</span></p>
                    <p class="text-[10px] font-bold text-indigo-500 uppercase">${app.serviceType} | ${app.serviceTime}</p></div>
                </div>`;
            });
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const data = { id: Date.now(), clientName: document.getElementById('clientNameSearch').value, petName: document.getElementById('petName').value, serviceType: document.getElementById('serviceType').value, serviceValue: parseFloat(document.getElementById('serviceValue').value), serviceDate: document.getElementById('serviceDate').value, serviceTime: document.getElementById('serviceTime').value, status: 'pendente' };
            appointments.push(data); localStorage.setItem('pet_appointments', JSON.stringify(appointments));
            e.target.reset(); renderCalendar(); showDayDetails(selectedDateStr);
        }

        function renderClientList() {
            const list = document.getElementById('client-list-bi'); list.innerHTML = '';
            clients.forEach(c => {
                list.innerHTML += `<div class="client-card p-5 rounded-2xl flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center font-black">${c.name.charAt(0)}</div>
                    <div><h4 class="font-bold text-slate-800 text-sm">${c.name}</h4><p class="text-[10px] font-black text-indigo-500 uppercase">${c.pet}</p></div>
                </div>`;
            });
        }

        function updateDashboard() {
            let rMes = 0, rDia = 0;
            const hoje = new Date().toISOString().split('T')[0];
            appointments.forEach(a => { rMes += a.serviceValue; if(a.serviceDate === hoje) rDia += a.serviceValue; });
            document.getElementById('kpi-ganhos').innerText = `R$ ${rMes.toFixed(2)}`;
            document.getElementById('kpi-receita-dia').innerText = `R$ ${rDia.toFixed(2)}`;
        }

        function changeMonth(step) { currentCalDate.setMonth(currentCalDate.getMonth() + step); renderCalendar(); }
        function autoFillPet(name) { const found = clients.find(c => c.name.toLowerCase().includes(name.toLowerCase())); if (found && name.length > 2) document.getElementById('petName').value = found.pet; }

        window.onload = () => {
            const d = new Date();
            document.getElementById('current-date').innerText = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
            switchTab(window.innerWidth < 768 ? 'home' : 'agenda');
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel ADM - Cadastro de Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- HEADER ADMINISTRATIVO -->
        <header class="bg-indigo-900 text-white p-6 rounded-3xl shadow-lg flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-indigo-800 rounded-2xl">
                    <i data-lucide="shield-check" class="w-6 h-6 text-indigo-300"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black uppercase tracking-wider">Painel ADM</h1>
                    <p class="text-xs text-indigo-300 font-medium">Módulo de Gestão e Cadastro de Clientes</p>
                </div>
            </div>
            <div id="total-badge" class="bg-indigo-800 px-4 py-2 rounded-2xl text-xs font-bold text-indigo-200 border border-indigo-700/50">
                Total: 0 clientes
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
            
            <!-- FORMULÁRIO DE CADASTRO -->
            <div class="md:col-span-5 bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80">
                <h2 class="text-xs font-black uppercase text-slate-400 tracking-wider mb-4 flex items-center gap-2">
                    <i data-lucide="user-plus" class="w-4 h-4 text-indigo-600"></i> Cadastrar Novo Cliente
                </h2>

                <form onsubmit="saveClient(event)" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Nome do Tutor *</label>
                        <input type="text" id="adm-tutor" placeholder="Ex: João Silva" class="w-full p-3 bg-slate-50 rounded-xl text-sm border border-slate-200 outline-none focus:ring-2 ring-indigo-500 transition" required>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Nome do Pet *</label>
                        <input type="text" id="adm-pet" placeholder="Ex: Thor" class="w-full p-3 bg-slate-50 rounded-xl text-sm border border-slate-200 outline-none focus:ring-2 ring-indigo-500 transition" required>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">WhatsApp</label>
                        <input type="tel" id="adm-zap" placeholder="(00) 00000-0000" class="w-full p-3 bg-slate-50 rounded-xl text-sm border border-slate-200 outline-none focus:ring-2 ring-indigo-500 transition">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Endereço</label>
                        <input type="text" id="adm-address" placeholder="Rua, número, bairro" class="w-full p-3 bg-slate-50 rounded-xl text-sm border border-slate-200 outline-none focus:ring-2 ring-indigo-500 transition">
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition uppercase text-xs tracking-widest flex items-center justify-center gap-2 mt-2">
                        <i data-lucide="save" class="w-4 h-4"></i> Salvar Cliente
                    </button>
                </form>
            </div>

            <!-- TABELA E LISTAGEM DOS CLIENTES CADASTRADOS -->
            <div class="md:col-span-7 bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80 flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xs font-black uppercase text-slate-400 tracking-wider flex items-center gap-2">
                            <i data-lucide="users" class="w-4 h-4 text-indigo-600"></i> Clientes Cadastrados
                        </h2>
                        <input type="text" id="search-input" oninput="renderClients()" placeholder="Buscar..." class="p-2 px-3 bg-slate-50 rounded-xl text-xs border border-slate-200 outline-none focus:ring-2 ring-indigo-500 w-36">
                    </div>

                    <div class="max-h-[380px] overflow-y-auto pr-1">
                        <div id="clients-list" class="space-y-3">
                            <!-- Inserido dinamicamente via JS -->
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let registeredClients = JSON.parse(localStorage.getItem('pet_clients_reg')) || [];

        function saveClient(e) {
            e.preventDefault();
            const client = {
                id: Date.now(),
                tutor: document.getElementById('adm-tutor').value,
                pet: document.getElementById('adm-pet').value,
                zap: document.getElementById('adm-zap').value,
                address: document.getElementById('adm-address').value
            };

            registeredClients.push(client);
            localStorage.setItem('pet_clients_reg', JSON.stringify(registeredClients));
            
            e.target.reset();
            renderClients();
        }

        function deleteClient(id) {
            if (confirm("Deseja realmente remover este cliente?")) {
                registeredClients = registeredClients.filter(c => c.id !== id && (c.id || c.tutor !== id));
                localStorage.setItem('pet_clients_reg', JSON.stringify(registeredClients));
                renderClients();
            }
        }

        function renderClients() {
            const container = document.getElementById('clients-list');
            const totalBadge = document.getElementById('total-badge');
            const searchTerm = document.getElementById('search-input').value.toLowerCase();

            totalBadge.innerText = `Total: ${registeredClients.length} clientes`;

            const filtered = registeredClients.filter(c => 
                c.tutor.toLowerCase().includes(searchTerm) || 
                c.pet.toLowerCase().includes(searchTerm)
            );

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 italic text-xs">Nenhum cliente encontrado.</div>`;
                return;
            }

            container.innerHTML = filtered.map(c => {
                const clientId = c.id || c.tutor;
                return `
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex justify-between items-center hover:border-indigo-200 transition">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-10 h-10 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center font-bold text-sm shrink-0">
                                ${c.tutor.charAt(0).toUpperCase()}
                            </div>
                            <div class="overflow-hidden">
                                <p class="font-black text-slate-800 text-xs truncate">${c.tutor}</p>
                                <p class="text-[10px] text-indigo-600 font-bold uppercase mt-0.5">Pet: ${c.pet}</p>
                                ${c.zap ? `<p class="text-[9px] text-slate-400 mt-0.5"><i data-lucide="phone" class="w-3 h-3 inline mr-1"></i>${c.zap}</p>` : ''}
                                ${c.address ? `<p class="text-[9px] text-slate-400 truncate"><i data-lucide="map-pin" class="w-3 h-3 inline mr-1"></i>${c.address}</p>` : ''}
                            </div>
                        </div>
                        <button onclick="deleteClient('${clientId}')" class="text-slate-300 hover:text-rose-600 p-2 transition shrink-0" title="Excluir">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        window.onload = () => {
            renderClients();
        };
    </script>
</body>
</html>

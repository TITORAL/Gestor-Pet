<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet - Gestão de Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 20px; }
        
        .hidden { display: none !important; }
        
        /* Sidebar com fundo azul conforme solicitado */
        .bg-pet-sidebar { background-color: #2d2d8a; }
        .bg-pet-active { background-color: #3f3f9f !important; border-radius: 12px; }
        
        /* Ajuste para telas menores */
        @media (max-width: 768px) {
            .sidebar-desktop { display: none; }
            .mobile-nav { display: flex; }
            .main-content { padding-bottom: 80px; }
        }
    </style>
</head>
<body class="bg-[#fafafa] text-slate-700 font-sans" id="body-context">

    <div id="main-app" class="flex h-screen overflow-hidden">
        
        <aside class="sidebar-desktop w-72 bg-pet-sidebar flex flex-col p-6 shadow-xl">
            <div class="flex items-center gap-3 mb-12">
                <i data-lucide="dog" class="w-10 h-10 text-white"></i>
                <h1 class="text-2xl font-bold tracking-tight text-white">Agenda Pet</h1>
            </div>
            
            <nav class="space-y-4 text-white">
                <button onclick="switchTab('clientes')" id="btn-clientes" class="flex items-center gap-4 w-full px-5 py-4 text-left hover:bg-[#3f3f9f] transition-all rounded-xl">
                    <i data-lucide="user-plus" class="w-6 h-6"></i> 
                    <span class="font-medium">Gestão de Cliente</span>
                </button>
                <button onclick="switchTab('agenda')" id="btn-agenda" class="flex items-center gap-4 w-full px-5 py-4 text-left hover:bg-[#3f3f9f] transition-all rounded-xl">
                    <i data-lucide="calendar" class="w-6 h-6"></i> 
                    <span class="font-medium">Agenda de Serviço</span>
                </button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="flex items-center gap-4 w-full px-5 py-4 text-left hover:bg-[#3f3f9f] transition-all rounded-xl">
                    <i data-lucide="layout-dashboard" class="w-6 h-6"></i> 
                    <span class="font-medium">Dashboard Finanças</span>
                </button>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col overflow-y-auto main-content">
            <header class="px-8 py-6 flex justify-between items-center bg-white border-b border-slate-100 sticky top-0 z-40">
                <h2 id="page-title" class="text-2xl font-bold text-slate-800">Gestão de Cliente</h2>
                <div id="header-date" class="text-sm font-medium text-slate-400"></div>
            </header>

            <main class="p-8 max-w-6xl w-full space-y-8">

                <div id="tab-clientes" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm h-fit">
                        <h3 class="font-bold mb-6 text-slate-800 text-lg">Cadastro</h3>
                        <form onsubmit="saveClient(event)" class="space-y-4">
                            <input type="text" id="regClientName" placeholder="Nome do Dono" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-400">
                            <input type="tel" id="regClientPhone" placeholder="WhatsApp" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-400">
                            <input type="text" id="regPetName" placeholder="Nome do Pet" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-400">
                            <button class="w-full bg-[#2d2d8a] hover:bg-[#3f3f9f] text-white font-bold py-3 rounded-xl transition shadow-md">Salvar Cliente</button>
                        </form>
                    </div>
                    <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4" id="clients-list-container"></div>
                </div>

                </main>
        </div>
    </div>

    <script>
        // Lógica de navegação e funções JS permanecem as mesmas para garantir funcionalidade
        function switchTab(tab) {
            const tabs = ['agenda', 'clientes', 'dashboard'];
            const titles = { 'clientes': 'Gestão de Cliente', 'agenda': 'Agenda de Serviço', 'dashboard': 'Dashboard Finanças' };
            
            tabs.forEach(t => {
                const content = document.getElementById(`tab-${t}`);
                if (content) content.classList.add('hidden');
                document.getElementById(`btn-${t}`).classList.remove('bg-pet-active');
            });

            const activeContent = document.getElementById(`tab-${tab}`);
            if (activeContent) activeContent.classList.remove('hidden');
            
            document.getElementById(`btn-${tab}`).classList.add('bg-pet-active');
            document.getElementById('page-title').innerText = titles[tab];
            lucide.createIcons();
        }

        window.onload = () => {
            lucide.createIcons();
            document.getElementById('header-date').innerText = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' });
            switchTab('clientes');
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet - Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .hidden { display: none !important; }
        .bg-pet-sidebar { background-color: #312e81; } 
        .bg-pet-active { background-color: #4338ca; }
        .status-concluido { background-color: #10b981 !important; color: white !important; }
        .status-cancelado { background-color: #ef4444 !important; color: white !important; }
        
        @media (max-width: 768px) {
            .sidebar { width: 64px; padding: 10px; }
            .sidebar span { display: none; }
            .sidebar h1 { display: none; }
            .main-content { padding: 10px; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div id="activation-screen" class="fixed inset-0 bg-indigo-950 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full text-center space-y-6">
            <h2 class="text-2xl font-bold text-gray-900">Ativação Agenda Pet</h2>
            <input type="text" id="license-key-input" placeholder="DIGITE 1234" class="w-full px-4 py-3 border rounded-xl text-center font-mono text-lg uppercase">
            <button onclick="validateLicenseKey()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg">Ativar Agora</button>
        </div>
    </div>

    <div id="main-app" class="flex h-screen overflow-hidden hidden">
        <div class="w-20 md:w-72 bg-pet-sidebar text-white flex flex-col sidebar transition-all">
            <div class="p-4 md:p-6">
                <div class="flex items-center gap-3 mb-10">
                    <i data-lucide="dog" class="w-8 h-8"></i>
                    <h1 class="text-xl font-bold tracking-tight">Agenda Pet</h1>
                </div>

                <nav class="space-y-3">
                    <button onclick="switchTab('agenda')" id="btn-agenda" class="flex items-center gap-4 w-full px-5 py-4 rounded-xl bg-pet-active text-white font-medium">
                        <i data-lucide="calendar" class="w-6 h-6"></i> <span>Agendamento</span>
                    </button>
                    <button onclick="switchTab('clientes')" id="btn-clientes" class="flex items-center gap-4 w-full px-5 py-4 rounded-xl text-indigo-100 hover:bg-indigo-800 transition font-medium">
                        <i data-lucide="users" class="w-6 h-6"></i> <span>Cadastro de Cliente</span>
                    </button>
                    <button onclick="switchTab('dashboard')" id="btn-dashboard" class="flex items-center gap-4 w-full px-5 py-4 rounded-xl text-indigo-100 hover:bg-indigo-800 transition font-medium">
                        <i data-lucide="layout-grid" class="w-6 h-6"></i> <span>Financeiro</span>
                    </button>
                </nav>
            </div>
        </div>

        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white border-b px-4 md:px-8 py-5 flex justify-between items-center sticky top-0 z-10">
                <h2 id="page-title" class="text-xl font-black text-gray-800 uppercase">Agendamento</h2>
                <span class="text-xs font-bold bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full" id="current-date"></span>
            </header>

            <main class="p-4 md:p-8 max-w-7xl w-full mx-auto space-y-6">

                <div id="tab-agenda" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                        <h3 class="text-lg font-bold mb-5 flex items-center gap-2">Novo Agendamento</h3>
                        <form id="appointment-form" onsubmit="saveAppointment(event)" class="space-y-4">
                            <input type="text" id="clientNameSearch" placeholder="Nome do Cliente" oninput="autoFillPet(this.value)" required class="w-full px-4 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                            <input type="text" id="petName" placeholder="Nome do Pet (Automático)" required class="w-full px-4 py-2.5 border rounded-xl bg-gray-50 outline-none">
                            <select id="serviceType" class="w-full px-4 py-2.5 border rounded-xl outline-none">
                                <option value="Banho">Banho</option>
                                <option value="Tosa">Tosa</option>
                                <option value="Banho e Tosa">Banho e Tosa</option>
                            </select>
                            <input type="number" id="serviceValue" placeholder="Valor R$" step="0.01" required class="w-full px-4 py-2.5 border rounded-xl outline-none">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="date" id="serviceDate" required class="w-full px-2 py-2.5 border rounded-xl outline-none">
                                <input type="time" id="serviceTime" required class="w-full px-2 py-2.5 border rounded-xl outline-none">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md">Agendar</button>
                        </form>
                    </div>

                    <div class="lg:col-span-2">
                        <h3 class="text-xl font-bold mb-4">Serviços do Dia</h3>
                        <div id="appointments-container" class="space-y-3"></div>
                    </div>
                </div>

                <div id="tab-clientes" class="hidden space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 max-w-lg">
                        <h3 class="text-lg font-bold mb-4">Cadastro de Cliente</h3>
                        <form onsubmit="saveClient(event)" class="space-y-4">
                            <input type="text" id="regClientName" placeholder="Nome do Cliente" required class="w-full px-4 py-2.5 border rounded-xl outline-none">
                            <input type="text" id="regAddress" placeholder="Endereço" required class="w-full px-4 py-2.5 border rounded-xl outline-none">
                            <input type="tel" id="regPhone" placeholder="Telefone" required class="w-full px-4 py-2.5 border rounded-xl outline-none">
                            <input type="text" id="regPet" placeholder="Nome do Pet" required class="w-full px-4 py-2.5 border rounded-xl outline-none">
                            <button class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Cadastrar Cliente</button>
                        </form>
                    </div>
                </div>

                <div id="tab-dashboard" class="hidden">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="kpi-container">
                        </div>
                </div>

            </main>
        </div>
    </div>

    <script>
        let appointments = JSON.parse(localStorage.getItem('pet_appointments')) || [];
        let clients = JSON.parse(localStorage.getItem('pet_clients')) || [];

        function validateLicenseKey() {
            if (document.getElementById('license-key-input').value === "1234") {
                localStorage.setItem('pet_app_activated', 'true');
                location.reload();
            }
        }

        if (localStorage.getItem('pet_app_activated') === 'true') {
            document.getElementById('activation-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
        }

        function switchTab(tab) {
            ['agenda', 'clientes', 'dashboard'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).classList.remove('bg-pet-active');
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).classList.add('bg-pet-active');
            document.getElementById('page-title').innerText = tab === 'agenda' ? 'Agendamento' : (tab === 'clientes' ? 'Cadastro' : 'Financeiro');
        }

        function saveClient(e) {
            e.preventDefault();
            const client = {
                name: document.getElementById('regClientName').value,
                pet: document.getElementById('regPet').value
            };
            clients.push(client);
            localStorage.setItem('pet_clients', JSON.stringify(clients));
            alert('Cliente cadastrado com sucesso!');
            e.target.reset();
        }

        function autoFillPet(name) {
            const client = clients.find(c => c.name.toLowerCase().includes(name.toLowerCase()));
            if (client && name.length > 2) {
                document.getElementById('petName').value = client.pet;
            }
        }

        function saveAppointment(e) {
            e.preventDefault();
            const newApp = {
                id: Date.now(),
                clientName: document.getElementById('clientNameSearch').value,
                petName: document.getElementById('petName').value,
                serviceType: document.getElementById('serviceType').value,
                serviceValue: parseFloat(document.getElementById('serviceValue').value),
                serviceDate: document.getElementById('serviceDate').value,
                serviceTime: document.getElementById('serviceTime').value,
                status: 'pendente'
            };
            appointments.push(newApp);
            localStorage.setItem('pet_appointments', JSON.stringify(appointments));
            renderAppointments();
            e.target.reset();
        }

        function renderAppointments() {
            const container = document.getElementById('appointments-container');
            container.innerHTML = '';
            appointments.sort((a,b) => a.serviceTime.localeCompare(b.serviceTime)).forEach(app => {
                const isConcluido = app.status === 'concluido';
                const isCancelado = app.status === 'cancelado';
                
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-xl border border-gray-100 flex justify-between items-center shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="text-indigo-700 font-bold text-sm bg-indigo-50 p-2 rounded-lg text-center">
                                ${app.serviceTime}
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-900">${app.petName} <span class="font-normal text-gray-500 text-xs">(${app.clientName})</span></h4>
                                <p class="text-xs font-bold text-blue-600 uppercase">${app.serviceType} - R$ ${app.serviceValue.toFixed(2)}</p>
                            </div>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="updateStatus(${app.id}, 'concluido')" class="p-2 rounded-lg border border-emerald-100 text-emerald-600 ${isConcluido ? 'status-concluido' : 'hover:bg-emerald-50'}">
                                <i data-lucide="check-circle" class="w-5 h-5"></i>
                            </button>
                            <button onclick="updateStatus(${app.id}, 'cancelado')" class="p-2 rounded-lg border border-rose-100 text-rose-600 ${isCancelado ? 'status-cancelado' : 'hover:bg-rose-50'}">
                                <i data-lucide="x-circle" class="w-5 h-5"></i>
                            </button>
                            <button class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg"><i data-lucide="pencil" class="w-5 h-5"></i></button>
                            <button onclick="deleteApp(${app.id})" class="p-2 text-gray-400 hover:text-rose-600 rounded-lg"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function updateStatus(id, status) {
            appointments = appointments.map(a => a.id === id ? {...a, status: a.status === status ? 'pendente' : status} : a);
            localStorage.setItem('pet_appointments', JSON.stringify(appointments));
            renderAppointments();
        }

        function deleteApp(id) {
            appointments = appointments.filter(a => a.id !== id);
            localStorage.setItem('pet_appointments', JSON.stringify(appointments));
            renderAppointments();
        }

        window.onload = () => {
            renderAppointments();
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('pt-BR', {day:'numeric', month:'long'});
            lucide.createIcons();
        };
    </script>
</body>
</html>

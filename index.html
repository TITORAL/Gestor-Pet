<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet - Gestão Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none !important; }
        .bg-pet-sidebar { background-color: #312e81; }
        .fita-azul { width: 3px; height: 20px; background-color: #3b82f6; border-radius: 4px; margin-right: 12px; }
        .calendar-grid-container { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: #e2e8f0; border: 1px solid #e2e8f0; overflow: hidden; transition: max-height 0.3s ease; }
        .calendar-collapsed { max-height: 0; border: none; }
        .calendar-cell { background: #fff; min-height: 60px; padding: 8px; cursor: pointer; border: 1px solid #f8fafc; }
        .calendar-cell:hover { background-color: #f1f5f9; }
        .calendar-cell.selected { background-color: #eef2ff; border: 1px solid #4338ca; }
        .event-dot { width: 4px; height: 4px; background: #4338ca; border-radius: 50%; display: inline-block; margin-right: 1px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

<div class="flex flex-col md:flex-row h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-pet-sidebar text-white flex flex-col p-6 shrink-0">
        <div class="flex items-center gap-3 mb-10"><i data-lucide="dog" class="w-8 h-8 text-indigo-300"></i><h1 class="text-lg font-black uppercase">Agenda Pet</h1></div>
        <nav class="space-y-1">
            <button onclick="switchTab('agenda')" id="btn-agenda-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm font-semibold hover:bg-indigo-800 transition"><i data-lucide="calendar" class="w-4 h-4"></i> Agendamentos</button>
            <button onclick="switchTab('clientes')" id="btn-clientes-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm font-semibold opacity-70 hover:opacity-100 transition"><i data-lucide="users" class="w-4 h-4"></i> Clientes</button>
            <button onclick="switchTab('dashboard')" id="btn-dashboard-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm font-semibold opacity-70 hover:opacity-100 transition"><i data-lucide="pie-chart" class="w-4 h-4"></i> Dashboard & Finança</button>
            <button onclick="switchTab('gastos')" id="btn-gastos-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm font-semibold opacity-70 hover:opacity-100 transition"><i data-lucide="wallet" class="w-4 h-4"></i> Gastos</button>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-y-auto">
        <!-- Header -->
        <header class="bg-white border-b px-8 py-5 flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center"><div class="fita-azul"></div><h2 id="page-title" class="text-lg font-light text-slate-500 uppercase tracking-widest">Agendamento</h2></div>
            <div id="header-date" class="text-sm font-bold text-indigo-600 bg-indigo-50 px-4 py-2 rounded-xl"></div>
        </header>

        <main class="p-6 space-y-6">
            
            <!-- ABA: AGENDAMENTO -->
            <div id="tab-agenda" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div class="lg:col-span-4 space-y-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                        <h3 class="text-xs font-black uppercase mb-4 text-slate-400">Novo Agendamento</h3>
                        <form onsubmit="saveAppointment(event)" class="space-y-3">
                            <input type="text" id="app-tutor" placeholder="Tutor" class="w-full p-3 bg-slate-50 rounded-xl text-sm border-none outline-none focus:ring-2 ring-indigo-500" required>
                            <input type="text" id="app-pet" placeholder="Pet" class="w-full p-3 bg-slate-50 rounded-xl text-sm border-none outline-none focus:ring-2 ring-indigo-500" required>
                            <select id="app-servico" class="w-full p-3 bg-slate-50 rounded-xl text-sm border-none outline-none">
                                <option value="Banho">Banho</option>
                                <option value="Tosa">Tosa</option>
                                <option value="Banho e Tosa">Banho e Tosa</option>
                            </select>
                            <div class="flex gap-2">
                                <input type="date" id="app-data" class="w-1/2 p-3 bg-slate-50 rounded-xl text-xs border-none" required>
                                <input type="time" id="app-hora" class="w-1/2 p-3 bg-slate-50 rounded-xl text-xs border-none" required>
                            </div>
                            <input type="number" id="app-valor" placeholder="Valor R$" step="0.01" class="w-full p-3 bg-slate-50 rounded-xl text-sm border-none" required>
                            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-indigo-700 transition uppercase text-xs tracking-widest">Confirmar</button>
                        </form>
                    </div>

                    <!-- CARD B.I. AGENDAMENTO EM TEMPO REAL (TODOS OS REGISTROS) -->
                    <div class="bg-indigo-900 p-6 rounded-[2rem] text-white shadow-xl">
                        <h4 class="text-[10px] font-black uppercase opacity-60 mb-3 tracking-widest">Painel B.I. - Todos os Agendamentos</h4>
                        <div class="max-h-60 overflow-y-auto pr-1 text-xs">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-indigo-800 text-[9px] opacity-50 tracking-wider">
                                        <th class="pb-2 font-black">TUTOR</th>
                                        <th class="pb-2 font-black">PET</th>
                                        <th class="pb-2 font-black text-right">SERVIÇO</th>
                                    </tr>
                                </thead>
                                <tbody id="bi-table-body" class="divide-y divide-indigo-800/40">
                                    <!-- Conteúdo dinâmico em tempo real -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-8 space-y-6">
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                        <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                            <button onclick="toggleCalendar()" class="text-xs font-bold text-indigo-600 flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4"></i> VER CALENDÁRIO</button>
                            <span id="cal-month-name" class="text-xs font-black uppercase">Junho 2026</span>
                        </div>
                        <div id="calendar-grid" class="calendar-grid-container calendar-collapsed"></div>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                        <h4 class="text-xs font-black text-indigo-600 uppercase mb-4">Agenda do Dia</h4>
                        <div id="day-list" class="space-y-2"></div>
                    </div>
                </div>
            </div>

            <!-- ABA: CLIENTES (CADASTRO) -->
            <div id="tab-clientes" class="hidden max-w-4xl mx-auto space-y-6">
                <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm relative">
                    <form onsubmit="saveClient(event)" class="space-y-4">
                        <!-- Cabeçalho do Card com Botão no Canto Superior Direito -->
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="text-xs font-black uppercase text-slate-400">Novo Cadastro de Cliente</h3>
                            <button type="submit" class="bg-indigo-400 text-white font-bold px-6 py-3 rounded-xl shadow-md hover:bg-indigo-500 transition uppercase text-[10px] tracking-widest">
                                Cadastrar Cliente
                            </button>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-4">
                                <input type="text" id="reg-tutor" placeholder="Nome do Tutor" class="w-full p-4 bg-slate-50 rounded-2xl text-sm border-none outline-none focus:ring-2 ring-indigo-500" required>
                                <input type="text" id="reg-pet" placeholder="Nome do Pet" class="w-full p-4 bg-slate-50 rounded-2xl text-sm border-none outline-none focus:ring-2 ring-indigo-500" required>
                            </div>
                            <div class="space-y-4">
                                <input type="tel" id="reg-zap" placeholder="WhatsApp" class="w-full p-4 bg-slate-50 rounded-2xl text-sm border-none outline-none focus:ring-2 ring-indigo-500">
                                <input type="text" id="reg-address" placeholder="Endereço" class="w-full p-4 bg-slate-50 rounded-2xl text-sm border-none outline-none focus:ring-2 ring-indigo-500">
                            </div>
                        </div>
                    </form>
                </div>

                <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-black">Base de Clientes</h3>
                        <button onclick="toggleClientList()" class="text-xs font-bold text-indigo-600 uppercase flex items-center gap-2"><i data-lucide="eye" class="w-4 h-4"></i> <span id="btn-view-text">Ver Clientes</span></button>
                    </div>
                    <div id="client-container" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 pt-4 border-t"></div>
                </div>
            </div>

            <!-- ABA: DASHBOARD (FINANÇAS) -->
            <div id="tab-dashboard" class="hidden space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="p-8 bg-emerald-500 text-white rounded-[2.5rem] shadow-lg relative">
                        <p class="text-[10px] font-black uppercase opacity-80 mb-2">Receita Total: <span id="dash-mes-label">Junho</span></p>
                        <h3 class="text-4xl font-black" id="dash-faturamento">R$ 0,00</h3>
                    </div>
                    <div class="p-8 bg-indigo-600 text-white rounded-[2.5rem] shadow-lg">
                        <p class="text-[10px] font-black uppercase opacity-80 mb-2">Receita do Dia</p>
                        <h3 class="text-4xl font-black" id="dash-receita-dia">R$ 0,00</h3>
                        <p id="dash-data-completa" class="text-[10px] mt-2 opacity-70 font-bold uppercase"></p>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script>
    let appointments = JSON.parse(localStorage.getItem('pet_apps')) || [];
    let registeredClients = JSON.parse(localStorage.getItem('pet_clients_reg')) || [];
    let selectedDate = new Date().toISOString().split('T')[0];

    // Mapeamento e Persistência de Abas
    function switchTab(tab) {
        document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
        document.querySelectorAll('nav button').forEach(b => b.classList.add('opacity-70'));
        
        document.getElementById(`tab-${tab}`).classList.remove('hidden');
        document.getElementById(`btn-${tab}-dt`).classList.remove('opacity-70');

        const title = document.getElementById('page-title');
        if(tab === 'agenda') title.innerText = 'Agendamento';
        if(tab === 'clientes') title.innerText = 'Cadastro';
        if(tab === 'dashboard') title.innerText = 'Finanças';
        
        // Salva o estado da aba no LocalStorage para não perder no refresh
        localStorage.setItem('active_pet_tab', tab);

        if(tab === 'dashboard') renderDashboard();
    }

    // --- AGENDAMENTO ---
    function saveAppointment(e) {
        e.preventDefault();
        const app = {
            tutor: document.getElementById('app-tutor').value,
            pet: document.getElementById('app-pet').value,
            servico: document.getElementById('app-servico').value,
            data: document.getElementById('app-data').value,
            hora: document.getElementById('app-hora').value,
            valor: parseFloat(document.getElementById('app-valor').value)
        };
        appointments.push(app);
        localStorage.setItem('pet_apps', JSON.stringify(appointments));
        
        e.target.reset();
        renderBiPanel();
        renderDayList(app.data);
    }

    // Renderiza a lista de B.I em tempo real com todos os cadastros
    function renderBiPanel() {
        const tableBody = document.getElementById('bi-table-body');
        if (!tableBody) return;
        
        if (appointments.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="3" class="text-center py-4 opacity-40 italic text-[11px]">Nenhum agendamento ativo.</td></tr>`;
            return;
        }

        tableBody.innerHTML = appointments.map(app => `
            <tr class="hover:bg-indigo-800/30 transition-colors">
                <td class="py-2.5 font-bold tracking-wide">${app.tutor}</td>
                <td class="py-2.5 opacity-80">${app.pet}</td>
                <td class="py-2.5 text-right font-semibold text-indigo-300">${app.servico}</td>
            </tr>
        `).join('');
    }

    function toggleCalendar() {
        const grid = document.getElementById('calendar-grid');
        grid.classList.toggle('calendar-collapsed');
        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        const date = new Date();
        const days = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
        for (let i = 1; i <= days; i++) {
            const dStr = `2026-06-${String(i).padStart(2, '0')}`;
            const count = appointments.filter(a => a.data === dStr).length;
            grid.innerHTML += `<div onclick="renderDayList('${dStr}')" class="calendar-cell ${selectedDate === dStr ? 'selected' : ''}"><span class="text-[10px] font-bold">${i}</span><div class="mt-1">${'<span class="event-dot"></span>'.repeat(count)}</div></div>`;
        }
    }

    function renderDayList(date) {
        selectedDate = date;
        const list = document.getElementById('day-list');
        const filtered = appointments.filter(a => a.data === date);
        list.innerHTML = filtered.length ? '' : '<p class="text-xs text-slate-400 italic py-4">Sem serviços para este dia.</p>';
        filtered.forEach(a => {
            list.innerHTML += `<div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100"><span class="text-sm font-bold">${a.hora} - ${a.pet} <span class="text-xs opacity-50">(${a.tutor})</span></span><span class="text-indigo-600 font-black">R$ ${a.valor.toFixed(2)}</span></div>`;
        });
        renderCalendar();
    }

    // --- CADASTRO DE CLIENTES ---
    function saveClient(e) {
        e.preventDefault();
        const client = {
            tutor: document.getElementById('reg-tutor').value,
            pet: document.getElementById('reg-pet').value,
            zap: document.getElementById('reg-zap').value,
            address: document.getElementById('reg-address').value
        };
        registeredClients.push(client);
        localStorage.setItem('pet_clients_reg', JSON.stringify(registeredClients));
        e.target.reset();
        alert("Cliente cadastrado com sucesso!");
        if(!document.getElementById('client-container').classList.contains('hidden')) toggleClientList();
    }

    function toggleClientList() {
        const container = document.getElementById('client-container');
        const btnText = document.getElementById('btn-view-text');
        container.classList.toggle('hidden');
        if(!container.classList.contains('hidden')) {
            btnText.innerText = "Fechar Lista";
            container.innerHTML = registeredClients.length ? '' : '<p class="col-span-full text-center py-10 text-slate-400 italic">Nenhum cliente cadastrado.</p>';
            registeredClients.forEach(c => {
                container.innerHTML += `
                    <div class="bg-indigo-50 p-6 rounded-3xl border border-indigo-100 text-center">
                        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm text-indigo-600"><i data-lucide="user" class="w-5 h-5"></i></div>
                        <p class="font-black text-indigo-900 text-sm">${c.tutor}</p>
                        <p class="text-[10px] text-indigo-400 font-bold uppercase">Pet: ${c.pet}</p>
                        ${c.address ? `<p class="text-[9px] text-slate-400 mt-2">${c.address}</p>` : ''}
                    </div>`;
            });
            lucide.createIcons();
        } else { btnText.innerText = "Ver Clientes"; }
    }

    // --- CARREGAMENTO INICIAL ---
    window.onload = () => {
        const d = new Date();
        document.getElementById('header-date').innerText = d.toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long'});
        lucide.createIcons();
        
        // Renderiza listas primordiais
        renderDayList(selectedDate);
        renderBiPanel();

        // Recupera a aba em que o usuário parou ou define 'agenda' por padrão
        const savedTab = localStorage.getItem('active_pet_tab') || 'agenda';
        switchTab(savedTab);
    };
</script>
</body>
</html>

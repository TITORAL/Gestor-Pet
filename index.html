<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet - Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .hidden { display: none !important; }
        
        .bg-pet-sidebar { background-color: #312e81; } 
        .bg-pet-active { background-color: #4338ca; }
        
        /* Fita azul no cabeçalho */
        .fita-azul {
            width: 4px;
            height: 24px;
            background-color: #3b82f6;
            border-radius: 2px;
            margin-right: 12px;
        }

        .status-concluido { background-color: #10b981 !important; color: white !important; border-color: #10b981 !important; }
        .status-cancelado { background-color: #ef4444 !important; color: white !important; border-color: #ef4444 !important; }

        @media (max-width: 768px) {
            .sidebar-desktop { display: none; }
            .mobile-nav { display: flex; }
            .main-content { padding-bottom: 90px; }
            .card-servico { flex-direction: column; align-items: flex-start; gap: 10px; }
            .actions-container { width: 100%; justify-content: space-between; border-top: 1px solid #f1f5f9; padding-top: 8px; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <div id="main-app" class="flex flex-col md:flex-row h-screen overflow-hidden">
        
        <aside class="sidebar-desktop w-64 bg-pet-sidebar text-white flex flex-col p-6">
            <div class="flex items-center gap-3 mb-10">
                <i data-lucide="dog" class="w-8 h-8 text-indigo-300"></i>
                <h1 class="text-lg font-black tracking-tight uppercase">Agenda Pet</h1>
            </div>
            <nav class="space-y-2">
                <button onclick="switchTab('agenda')" id="btn-agenda-dt" class="nav-item flex items-center gap-3 w-full px-4 py-3 rounded-xl bg-pet-active transition">
                    <i data-lucide="calendar" class="w-5 h-5"></i> <span class="font-bold text-sm">Agendamento</span>
                </button>
                <button onclick="switchTab('clientes')" id="btn-clientes-dt" class="nav-item flex items-center gap-3 w-full px-4 py-3 rounded-xl hover:bg-indigo-800 transition">
                    <i data-lucide="users" class="w-5 h-5"></i> <span class="font-bold text-sm">Clientes</span>
                </button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard-dt" class="nav-item flex items-center gap-3 w-full px-4 py-3 rounded-xl hover:bg-indigo-800 transition">
                    <i data-lucide="pie-chart" class="w-5 h-5"></i> <span class="font-bold text-sm">Financeiro</span>
                </button>
            </nav>
        </aside>

        <nav class="mobile-nav hidden fixed bottom-0 left-0 right-0 bg-white border-t z-50 flex justify-around p-3 shadow-lg">
            <button onclick="switchTab('agenda')" id="btn-agenda-mb" class="flex flex-col items-center text-indigo-900">
                <i data-lucide="calendar" class="w-6 h-6"></i><span class="text-[9px] font-bold">AGENDA</span>
            </button>
            <button onclick="switchTab('clientes')" id="btn-clientes-mb" class="flex flex-col items-center text-slate-400">
                <i data-lucide="users" class="w-6 h-6"></i><span class="text-[9px] font-bold">CLIENTES</span>
            </button>
            <button onclick="switchTab('dashboard')" id="btn-dashboard-mb" class="flex flex-col items-center text-slate-400">
                <i data-lucide="pie-chart" class="w-6 h-6"></i><span class="text-[9px] font-bold">FINANÇAS</span>
            </button>
        </nav>

        <div class="flex-1 flex flex-col overflow-y-auto main-content">
            <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-40">
                <div class="flex items-center">
                    <div class="fita-azul"></div>
                    <div>
                        <h2 id="page-title" class="text-base font-black text-slate-800 uppercase tracking-tighter">Agendamento</h2>
                        <p id="current-date" class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest"></p>
                    </div>
                </div>
                <i data-lucide="dog" class="w-5 h-5 text-indigo-600 md:hidden"></i>
            </header>

            <main class="p-4 md:p-8 max-w-5xl w-full mx-auto space-y-6">

                <div id="tab-agenda" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 h-fit">
                        <div class="flex justify-between items-center mb-4">
                            <h3 id="form-title" class="font-black text-slate-800 uppercase text-xs">Agendar Serviço</h3>
                            <button id="cancel-edit" onclick="resetForm()" class="hidden text-[10px] font-bold text-rose-500 underline uppercase">Cancelar</button>
                        </div>
                        <form id="appointment-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
                            <input type="hidden" id="edit-id">
                            <input type="text" id="clientNameSearch" placeholder="Nome do Cliente" oninput="autoFillPet(this.value)" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl outline-none text-sm">
                            <input type="text" id="petName" placeholder="Nome do Pet" required class="w-full px-4 py-3 border border-slate-200 rounded-2xl outline-none text-sm">
                            
                            <div class="p-4 bg-indigo-50/50 rounded-2xl border border-indigo-100">
                                <label class="block text-[9px] font-black text-indigo-900 uppercase mb-2">Serviço</label>
                                <select id="serviceType" class="w-full px-3 py-2 border rounded-xl mb-2 text-sm outline-none">
                                    <option value="Banho">Banho</option>
                                    <option value="Tosa">Tosa</option>
                                    <option value="Banho e Tosa">Banho e Tosa</option>
                                </select>
                                <input type="number" id="serviceValue" placeholder="Valor R$" step="0.01" required class="w-full px-3 py-2 border rounded-xl text-sm outline-none">
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <input type="date" id="serviceDate" required class="w-full px-3 py-3 border rounded-2xl text-xs outline-none bg-white">
                                <input type="time" id="serviceTime" required class="w-full px-3 py-3 border rounded-2xl text-xs outline-none bg-white">
                            </div>
                            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white font-black py-3.5 rounded-2xl shadow-md active:scale-95 transition-transform text-sm">CONFIRMAR</button>
                        </form>
                    </div>

                    <div class="lg:col-span-2 space-y-3">
                        <div id="appointments-container" class="space-y-3"></div>
                    </div>
                </div>

                <div id="tab-clientes" class="hidden flex justify-center">
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm w-full max-w-md">
                        <h3 class="font-black text-slate-800 uppercase mb-5 text-center text-sm tracking-widest">Cadastro de Cliente</h3>
                        <form onsubmit="saveClient(event)" class="space-y-3">
                            <input type="text" id="regClientName" placeholder="Nome do Tutor" required class="w-full px-4 py-3 border border-slate-200 rounded-2xl outline-none text-sm">
                            <input type="tel" id="regPhone" placeholder="WhatsApp" required class="w-full px-4 py-3 border border-slate-200 rounded-2xl outline-none text-sm">
                            <input type="text" id="regPet" placeholder="Nome do Pet" required class="w-full px-4 py-3 border border-slate-200 rounded-2xl outline-none text-sm">
                            <button class="w-full bg-indigo-600 text-white font-black py-3.5 rounded-2xl mt-2 shadow-md text-sm">SALVAR CLIENTE</button>
                        </form>
                    </div>
                </div>

                <div id="tab-dashboard" class="hidden space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-white p-5 rounded-3xl shadow-sm border-l-4 border-emerald-500">
                            <p class="text-[9px] font-black text-slate-400 uppercase">Receita</p>
                            <h3 class="text-xl font-black text-emerald-600" id="kpi-ganhos">R$ 0,00</h3>
                        </div>
                        <div class="bg-white p-5 rounded-3xl shadow-sm border-l-4 border-rose-500">
                            <p class="text-[9px] font-black text-slate-400 uppercase">Cancelados</p>
                            <h3 class="text-xl font-black text-rose-600" id="kpi-perdas">R$ 0,00</h3>
                        </div>
                        <div class="bg-white p-5 rounded-3xl shadow-sm border-l-4 border-indigo-500">
                            <p class="text-[9px] font-black text-slate-400 uppercase">Líquido</p>
                            <h3 class="text-xl font-black text-indigo-600" id="kpi-saldo">R$ 0,00</h3>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
        let appointments = JSON.parse(localStorage.getItem('pet_appointments')) || [];
        let clients = JSON.parse(localStorage.getItem('pet_clients')) || [];

        function switchTab(tab) {
            ['agenda', 'clientes', 'dashboard'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}-dt`).classList.remove('bg-pet-active');
                document.getElementById(`btn-${t}-mb`).classList.replace('text-indigo-900', 'text-slate-400');
            });

            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}-dt`).classList.add('bg-pet-active');
            document.getElementById(`btn-${tab}-mb`).classList.replace('text-slate-400', 'text-indigo-900');
            
            const titles = { 'agenda': 'Agendamento', 'clientes': 'Clientes', 'dashboard': 'Financeiro' };
            document.getElementById('page-title').innerText = titles[tab];
            
            if(tab === 'dashboard') updateDashboard();
            lucide.createIcons();
        }

        function saveClient(e) {
            e.preventDefault();
            clients.push({
                name: document.getElementById('regClientName').value,
                pet: document.getElementById('regPet').value
            });
            localStorage.setItem('pet_clients', JSON.stringify(clients));
            alert('Cliente Salvo com Sucesso!');
            e.target.reset();
        }

        function autoFillPet(name) {
            const found = clients.find(c => c.name.toLowerCase().includes(name.toLowerCase()));
            if (found && name.length > 2) document.getElementById('petName').value = found.pet;
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const data = {
                id: editId ? parseInt(editId) : Date.now(),
                clientName: document.getElementById('clientNameSearch').value,
                petName: document.getElementById('petName').value,
                serviceType: document.getElementById('serviceType').value,
                serviceValue: parseFloat(document.getElementById('serviceValue').value),
                serviceDate: document.getElementById('serviceDate').value,
                serviceTime: document.getElementById('serviceTime').value,
                status: editId ? (appointments.find(a => a.id == editId).status) : 'pendente'
            };

            if (editId) appointments = appointments.map(a => a.id == editId ? data : a);
            else appointments.push(data);

            localStorage.setItem('pet_appointments', JSON.stringify(appointments));
            resetForm();
            renderAppointments();
        }

        function editApp(id) {
            const app = appointments.find(a => a.id === id);
            document.getElementById('edit-id').value = app.id;
            document.getElementById('clientNameSearch').value = app.clientName;
            document.getElementById('petName').value = app.petName;
            document.getElementById('serviceType').value = app.serviceType;
            document.getElementById('serviceValue').value = app.serviceValue;
            document.getElementById('serviceDate').value = app.serviceDate;
            document.getElementById('serviceTime').value = app.serviceTime;
            document.getElementById('form-title').innerText = "Editar Serviço";
            document.getElementById('cancel-edit').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('appointment-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').innerText = "Agendar Serviço";
            document.getElementById('cancel-edit').classList.add('hidden');
        }

        function renderAppointments() {
            const container = document.getElementById('appointments-container');
            container.innerHTML = '';
            [...appointments].sort((a,b) => a.serviceTime.localeCompare(b.serviceTime)).forEach(app => {
                const isConcluido = app.status === 'concluido';
                const isCancelado = app.status === 'cancelado';
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 flex card-servico justify-between items-center shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="bg-indigo-50 text-indigo-700 font-black p-2 rounded-xl text-center min-w-[55px]">
                                <span class="text-[8px] block uppercase opacity-50">${app.serviceTime}</span>
                                <span class="text-sm">${app.serviceDate.split('-')[2]}</span>
                            </div>
                            <div>
                                <h4 class="font-black text-slate-800 text-xs">${app.petName} <span class="text-slate-400 font-medium text-[9px]">(${app.clientName})</span></h4>
                                <p class="text-[9px] font-black text-indigo-500 uppercase">${app.serviceType} • R$ ${app.serviceValue.toFixed(2)}</p>
                            </div>
                        </div>
                        <div class="flex gap-2 actions-container">
                            <div class="flex gap-1">
                                <button onclick="updateStatus(${app.id}, 'concluido')" class="p-2 rounded-lg border border-emerald-100 text-emerald-600 ${isConcluido ? 'status-concluido' : ''}"><i data-lucide="check" class="w-4 h-4"></i></button>
                                <button onclick="updateStatus(${app.id}, 'cancelado')" class="p-2 rounded-lg border border-rose-100 text-rose-600 ${isCancelado ? 'status-cancelado' : ''}"><i data-lucide="x" class="w-4 h-4"></i></button>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="editApp(${app.id})" class="p-2 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                                <button onclick="deleteApp(${app.id})" class="p-2 text-slate-300"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </div>`;
            });
            lucide.createIcons();
        }

        function updateStatus(id, status) {
            appointments = appointments.map(a => a.id === id ? {...a, status: a.status === status ? 'pendente' : status} : a);
            localStorage.setItem('pet_appointments', JSON.stringify(appointments));
            renderAppointments();
        }

        function updateDashboard() {
            let g = 0, p = 0;
            appointments.forEach(a => {
                if(a.status === 'concluido') g += a.serviceValue;
                if(a.status === 'cancelado') p += a.serviceValue;
            });
            document.getElementById('kpi-ganhos').innerText = `R$ ${g.toFixed(2)}`;
            document.getElementById('kpi-perdas').innerText = `R$ ${p.toFixed(2)}`;
            document.getElementById('kpi-saldo').innerText = `R$ ${(g-p).toFixed(2)}`;
        }

        function deleteApp(id) { if(confirm("Excluir?")) { appointments = appointments.filter(a => a.id !== id); localStorage.setItem('pet_appointments', JSON.stringify(appointments)); renderAppointments(); } }

        window.onload = () => {
            const d = new Date();
            document.getElementById('current-date').innerText = d.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'short'});
            renderAppointments();
            lucide.createIcons();
        };
    </script>
</body>
</html>

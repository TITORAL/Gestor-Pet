<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Pet - Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Ajuste fundamental para eliminar a parte branca lateral */
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden !important; 
            width: 100% !important; 
            position: relative; 
            margin: 0; 
            padding: 0;
        }

        #main-app {
            max-width: 100vw;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        
        .hidden { display: none !important; }
        .bg-pet-sidebar { background-color: #312e81; } 
        .bg-pet-active { background-color: #4338ca; }
        .fita-azul { width: 3px; height: 20px; background-color: #3b82f6; border-radius: 4px; margin-right: 12px; }
        
        .header-date-badge {
            background-color: #e0f2fe; color: #0369a1;
            padding: 8px 16px; border-radius: 12px; font-weight: 600;
        }

        @media (max-width: 768px) { 
            .sidebar-desktop { display: none !important; }
            /* Remove permanentemente a parte superior no mobile */
            #header-main { display: none !important; }
            
            .content-area { 
                padding: 0px !important; 
                width: 100% !important; 
                max-width: 100% !important;
                overflow-x: hidden !important; 
            }
            
            .bg-mobile-full { 
                background-color: #312e81; 
                min-height: 100vh; 
                width: 100% !important; 
                margin: 0 !important;
            }
        }

        .mobile-menu-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="main-app" class="flex flex-col md:flex-row h-screen overflow-hidden">
        
        <aside class="sidebar-desktop w-64 bg-pet-sidebar text-white flex flex-col p-6">
            <div class="flex items-center gap-3 mb-10">
                <i data-lucide="dog" class="w-8 h-8 text-indigo-300"></i>
                <h1 class="text-lg font-black tracking-tight uppercase">Agenda Pet</h1>
            </div>
            <nav class="space-y-1">
                <button onclick="switchTab('agenda')" id="btn-agenda-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70">
                    <i data-lucide="calendar" class="w-4 h-4"></i> Agendamentos
                </button>
                <button onclick="switchTab('clientes')" id="btn-clientes-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70">
                    <i data-lucide="users" class="w-4 h-4"></i> Clientes
                </button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70">
                    <i data-lucide="pie-chart" class="w-4 h-4"></i> Dashboard & Finança
                </button>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col overflow-y-auto overflow-x-hidden">
            <header id="header-main" class="hidden md:flex bg-white border-b px-8 py-5 justify-between items-center sticky top-0 z-40">
                <div class="flex items-center">
                    <div class="fita-azul"></div>
                    <h2 id="page-title" class="text-lg font-light text-slate-500 uppercase tracking-[0.2em]">Agendamento</h2>
                </div>
                <div class="text-right">
                    <span id="current-date" class="header-date-badge text-sm"></span>
                </div>
            </header>

            <main class="content-area p-4 md:p-8 w-full mx-auto">

                <div id="tab-home" class="bg-mobile-full p-6 flex flex-col justify-start w-full md:hidden">
                    <div class="flex items-center gap-4 text-white pt-6 pb-10">
                        <div class="bg-indigo-500/30 p-3 rounded-2xl">
                            <i data-lucide="dog" class="w-10 h-10 text-white"></i>
                        </div>
                        <h1 class="text-2xl font-black tracking-tight uppercase">Agenda Pet</h1>
                    </div>

                    <div class="grid grid-cols-1 gap-4 w-full">
                        <button onclick="switchTab('agenda')" class="mobile-menu-card">
                            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center">
                                <i data-lucide="calendar" class="w-6 h-6"></i>
                            </div>
                            <div class="text-left">
                                <h3 class="font-bold text-slate-800 uppercase text-xs tracking-widest">Agenda</h3>
                                <p class="text-[11px] text-slate-400">Ver e criar agendamentos</p>
                            </div>
                        </button>

                        <button onclick="switchTab('clientes')" class="mobile-menu-card">
                            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center">
                                <i data-lucide="users" class="w-6 h-6"></i>
                            </div>
                            <div class="text-left">
                                <h3 class="font-bold text-slate-800 uppercase text-xs tracking-widest">Clientes</h3>
                                <p class="text-[11px] text-slate-400">Base de tutores e pets</p>
                            </div>
                        </button>

                        <button onclick="switchTab('dashboard')" class="mobile-menu-card">
                            <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center">
                                <i data-lucide="pie-chart" class="w-6 h-6"></i>
                            </div>
                            <div class="text-left">
                                <h3 class="font-bold text-slate-800 uppercase text-xs tracking-widest">Dashboard</h3>
                                <p class="text-[11px] text-slate-400">Relatórios e valores</p>
                            </div>
                        </button>
                    </div>
                </div>

                <div id="tab-agenda" class="hidden">
                    <div class="md:hidden mb-4 p-4">
                        <button onclick="switchTab('home')" class="text-slate-500 font-bold text-xs uppercase bg-white px-4 py-2 rounded-xl border border-slate-100 flex items-center gap-2">
                             <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar
                        </button>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            ['home', 'agenda', 'clientes', 'dashboard'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if(el) el.classList.add('hidden');
            });

            const target = document.getElementById(`tab-${tab}`);
            if(target) target.classList.remove('hidden');

            // Mantém o header sincronizado com o dispositivo
            const header = document.getElementById('header-main');
            if (header) {
                if (window.innerWidth < 768) {
                    header.classList.add('hidden');
                } else {
                    header.classList.remove('hidden');
                }
            }

            lucide.createIcons();
            window.scrollTo(0,0);
        }

        window.onload = () => {
            const isMobile = window.innerWidth < 768;
            switchTab(isMobile ? 'home' : 'agenda');
            
            const d = new Date();
            const dateEl = document.getElementById('current-date');
            if(dateEl) dateEl.innerText = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
        };
    </script>
</body>
</html>

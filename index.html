<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet - Gestão Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none !important; }
        .bg-pet-sidebar { background-color: #312e81; }
        .calendar-grid-container { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: #e2e8f0; border: 1px solid #e2e8f0; }
        .calendar-cell { background: #fff; min-height: 80px; padding: 8px; cursor: pointer; transition: all 0.2s; }
        .calendar-cell:hover { background-color: #f8fafc; }
        .calendar-cell.selected { background-color: #eef2ff; border: 1px solid #4338ca; }
        .event-dot { width: 6px; height: 6px; background: #4338ca; border-radius: 50%; display: inline-block; margin-right: 2px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

<div id="main-app" class="flex flex-col md:flex-row h-screen overflow-hidden">
    <aside class="sidebar-desktop w-64 bg-pet-sidebar text-white flex flex-col p-6">
        <div class="flex items-center gap-3 mb-10"><i data-lucide="dog" class="w-8 h-8 text-indigo-300"></i><h1 class="text-lg font-black tracking-tight uppercase">Agenda Pet</h1></div>
        <nav class="space-y-1">
            <button onclick="switchTab('agenda')" id="btn-agenda-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold"><i data-lucide="calendar" class="w-4 h-4"></i> Agendamentos</button>
            <button onclick="switchTab('clientes')" id="btn-clientes-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70"><i data-lucide="users" class="w-4 h-4"></i> Clientes</button>
            <button onclick="switchTab('dashboard')" id="btn-dashboard-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70"><i data-lucide="pie-chart" class="w-4 h-4"></i> Financeiro</button>
            <button onclick="switchTab('gastos')" id="btn-gastos-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70"><i data-lucide="wallet" class="w-4 h-4"></i> Gastos</button>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b px-8 py-5 flex justify-between items-center sticky top-0 z-40">
            <h2 id="page-title" class="text-lg font-light text-slate-500 uppercase tracking-widest">Painel</h2>
            <span id="current-date" class="text-sm font-bold text-indigo-600 bg-indigo-50 px-4 py-2 rounded-xl"></span>
        </header>

        <main class="p-4 md:p-8 max-w-[1600px] w-full mx-auto space-y-6">
            
            <div id="tab-agenda" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div class="lg:col-span-4 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                    <h3 class="font-black text-xs uppercase tracking-widest mb-4">Novo Agendamento</h3>
                    <form onsubmit="saveAppointment(event)" class="space-y-3">
                        <input type="text" id="app-tutor" placeholder="Nome do Tutor" class="w-full p-3 bg-slate-50 rounded-xl outline-none text-sm border focus:border-indigo-300" required>
                        <input type="text" id="app-pet" placeholder="Nome do Pet" class="w-full p-3 bg-slate-50 rounded-xl outline-none text-sm border focus:border-indigo-300" required>
                        <div class="flex gap-2">
                            <input type="date" id="app-data" class="w-1/2 p-3 bg-slate-50 rounded-xl text-xs border" required>
                            <input type="time" id="app-hora" class="w-1/2 p-3 bg-slate-50 rounded-xl text-xs border" required>
                        </div>
                        <input type="number" id="app-valor" placeholder="Valor R$" step="0.01" class="w-full p-3 bg-slate-50 rounded-xl text-sm border" required>
                        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-widest hover:bg-indigo-700">Agendar</button>
                    </form>
                </div>
                <div class="lg:col-span-8 space-y-4">
                    <div id="calendar-grid" class="calendar-grid-container rounded-2xl overflow-hidden shadow-sm"></div>
                    <div id="day-list" class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm min-h-[200px]">
                        <h4 class="text-xs font-bold text-indigo-600 uppercase mb-4">Serviços do Dia</h4>
                        <div id="appointments-container" class="space-y-2"></div>
                    </div>
                </div>
            </div>

            <div id="tab-clientes" class="hidden">
                <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-black">Meus Clientes</h3>
                    </div>
                    <div id="client-list" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
                </div>
            </div>

            <div id="tab-dashboard" class="hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="p-8 bg-indigo-600 text-white rounded-3xl shadow-lg">
                        <p class="text-xs font-bold uppercase opacity-80 mb-2">Faturamento Estimado (Mês)</p>
                        <h3 class="text-4xl font-black" id="dash-faturamento">R$ 0,00</h3>
                    </div>
                    <div class="p-8 bg-slate-800 text-white rounded-3xl shadow-lg">
                        <p class="text-xs font-bold uppercase opacity-80 mb-2">Total de Serviços</p>
                        <h3 class="text-4xl font-black" id="dash-total-servicos">0</h3>
                    </div>
                </div>
            </div>

            <div id="tab-gastos" class="hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6">
                        <h2 class="text-sm font-black text-slate-800 uppercase tracking-widest mb-6">Despesas Fixas</h2>
                        <div class="flex gap-2 mb-6">
                            <input type="text" id="fixa-nome" placeholder="Produto" class="w-full px-4 py-3 bg-slate-50 rounded-2xl text-sm border focus:border-indigo-300 outline-none">
                            <input type="number" id="fixa-valor" placeholder="R$" class="w-24 px-4 py-3 bg-slate-50 rounded-2xl text-sm border outline-none">
                            <button onclick="addDespesa('fixa')" class="bg-indigo-600 text-white px-4 rounded-2xl font-bold">Add</button>
                        </div>
                        <div class="h-48 mb-4"><canvas id="chartFixa"></canvas></div>
                        <div id="lista-fixa" class="space-y-2 max-h-40 overflow-y-auto"></div>
                    </div>

                    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6">
                        <h2 class="text-sm font-black text-slate-800 uppercase tracking-widest mb-6">Despesas Variáveis</h2>
                        <div class="flex gap-2 mb-6">
                            <input type="text" id="var-nome" placeholder="Produto" class="w-full px-4 py-3 bg-slate-50 rounded-2xl text-sm border focus:border-emerald-300 outline-none">
                            <input type="number" id="var-valor" placeholder="R$" class="w-24 px-4 py-3 bg-slate-50 rounded-2xl text-sm border outline-none">
                            <button onclick="addDespesa('var')" class="bg-emerald-600 text-white px-4 rounded-2xl font-bold">Add</button>
                        </div>
                        <div class="h-48 mb-4"><canvas id="chartVariavel"></canvas></div>
                        <div id="lista-var" class="space-y-2 max-h-40 overflow-y-auto"></div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script>
    // Banco de Dados Local
    let appointments = JSON.parse(localStorage.getItem('pet_appointments')) || [];
    let despesas = JSON.parse(localStorage.getItem('pet_despesas')) || { fixa: [], var: [] };
    let selectedDate = new Date().toISOString().split('T')[0];
    let charts = {};

    // --- FUNÇÕES DE AGENDAMENTO ---
    function saveAppointment(e) {
        e.preventDefault();
        const newApp = {
            id: Date.now(),
            tutor: document.getElementById('app-tutor').value,
            pet: document.getElementById('app-pet').value,
            data: document.getElementById('app-data').value,
            hora: document.getElementById('app-hora').value,
            valor: parseFloat(document.getElementById('app-valor').value)
        };
        appointments.push(newApp);
        localStorage.setItem('pet_appointments', JSON.stringify(appointments));
        e.target.reset();
        renderAgenda();
    }

    function renderAgenda() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 1; i <= daysInMonth; i++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            const count = appointments.filter(a => a.data === dateStr).length;
            const dots = '<span class="event-dot"></span>'.repeat(count);
            
            grid.innerHTML += `
                <div onclick="showDay('${dateStr}')" class="calendar-cell ${selectedDate === dateStr ? 'selected' : ''}">
                    <span class="text-xs font-bold">${i}</span>
                    <div class="flex flex-wrap mt-1">${dots}</div>
                </div>`;
        }
        showDay(selectedDate);
    }

    function showDay(date) {
        selectedDate = date;
        const container = document.getElementById('appointments-container');
        const filtered = appointments.filter(a => a.data === date);
        
        container.innerHTML = filtered.length ? '' : '<p class="text-slate-400 text-xs italic">Nenhum serviço agendado.</p>';
        filtered.forEach(a => {
            container.innerHTML += `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <div><b class="text-sm">${a.hora} - ${a.pet}</b> <span class="text-xs text-slate-500">(${a.tutor})</span></div>
                    <div class="text-sm font-bold text-indigo-600">R$ ${a.valor.toFixed(2)}</div>
                </div>`;
        });
    }

    // --- FUNÇÕES DE GASTOS ---
    function initChart(id, label, color) {
        const canvas = document.getElementById(id);
        if(!canvas) return null;
        if(charts[id]) charts[id].destroy();
        return new Chart(canvas.getContext('2d'), {
            type: 'bar',
            data: { labels: [], datasets: [{ label: label, data: [], backgroundColor: color, borderRadius: 8 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    }

    function addDespesa(tipo) {
        const nome = document.getElementById(`${tipo}-nome`).value;
        const valor = parseFloat(document.getElementById(`${tipo}-valor`).value);
        if (nome && !isNaN(valor)) {
            despesas[tipo].push({ nome, valor });
            document.getElementById(`${tipo}-nome`).value = '';
            document.getElementById(`${tipo}-valor`).value = '';
            renderGastos();
        }
    }

    function renderGastos() {
        ['fixa', 'var'].forEach(tipo => {
            const lista = document.getElementById(`lista-${tipo}`);
            lista.innerHTML = '';
            const labels = despesas[tipo].map(d => d.nome);
            const valores = despesas[tipo].map(d => d.valor);

            despesas[tipo].forEach(item => {
                lista.innerHTML += `
                    <div class="flex justify-between p-2 bg-slate-50 rounded-lg text-xs border border-slate-100">
                        <span>${item.nome}</span>
                        <b>R$ ${item.valor.toFixed(2)}</b>
                    </div>`;
            });

            const chart = charts[tipo === 'fixa' ? 'chartFixa' : 'chartVariavel'];
            if(chart) {
                chart.data.labels = labels;
                chart.data.datasets[0].data = valores;
                chart.update();
            }
        });
        localStorage.setItem('pet_despesas', JSON.stringify(despesas));
    }

    // --- NAVEGAÇÃO ---
    function switchTab(tab) {
        ['agenda', 'clientes', 'dashboard', 'gastos'].forEach(t => {
            document.getElementById(`tab-${t}`).classList.add('hidden');
            document.getElementById(`btn-${t}-dt`).classList.add('opacity-70');
        });
        document.getElementById(`tab-${tab}`).classList.remove('hidden');
        document.getElementById(`btn-${tab}-dt`).classList.remove('opacity-70');
        
        if(tab === 'agenda') renderAgenda();
        if(tab === 'gastos') renderGastos();
        if(tab === 'dashboard') {
            const total = appointments.reduce((sum, a) => sum + a.valor, 0);
            document.getElementById('dash-faturamento').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('dash-total-servicos').innerText = appointments.length;
        }
        if(tab === 'clientes') {
            const list = document.getElementById('client-list');
            const uniqueClients = [...new Set(appointments.map(a => a.tutor))];
            list.innerHTML = uniqueClients.length ? '' : '<p class="col-span-full text-center py-10 opacity-50">Sem clientes ainda.</p>';
            uniqueClients.forEach(c => {
                list.innerHTML += `<div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 font-bold text-center">${c}</div>`;
            });
        }
    }

    window.onload = () => {
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long'});
        charts.chartFixa = initChart('chartFixa', 'Fixas', '#4f46e5');
        charts.chartVariavel = initChart('chartVariavel', 'Variáveis', '#10b981');
        switchTab('agenda');
        lucide.createIcons();
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet - Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .hidden { display: none !important; }
        .bg-pet-sidebar { background-color: #312e81; }
        .bg-pet-active { background-color: #4338ca; }
        .fita-azul { width: 3px; height: 20px; background-color: #3b82f6; border-radius: 4px; margin-right: 12px; }
        .header-date-badge { background-color: #e0f2fe; color: #0369a1; padding: 8px 16px; border-radius: 12px; font-weight: 600; }
        .error-field { border: 2px solid #ef4444 !important; animation: shake .2s ease-in-out 0s 2; background-color: #fef2f2 !important; }
        @keyframes shake { 0%, 100% { margin-left: 0; } 25% { margin-left: .5rem; } 75% { margin-left: -.5rem; } }
        .calendar-grid-container { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: #e2e8f0; border: 1px solid #e2e8f0; overflow: hidden; }
        .calendar-collapsed { max-height: 0; border: none; }
        .calendar-cell { background: #fff; min-height: 80px; padding: 8px; cursor: pointer; }
        .calendar-cell.selected { background-color: #eef2ff; border: 1px solid #4338ca; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

<div id="main-app" class="flex flex-col md:flex-row h-screen overflow-hidden">
    <aside class="sidebar-desktop w-64 bg-pet-sidebar text-white flex flex-col p-6">
        <div class="flex items-center gap-3 mb-10"><i data-lucide="dog" class="w-8 h-8 text-indigo-300"></i><h1 class="text-lg font-black tracking-tight uppercase">Agenda Pet</h1></div>
        <nav class="space-y-1">
            <button onclick="switchTab('agenda')" id="btn-agenda-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold"><i data-lucide="calendar" class="w-4 h-4"></i> Agendamentos</button>
            <button onclick="switchTab('clientes')" id="btn-clientes-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70"><i data-lucide="users" class="w-4 h-4"></i> Clientes</button>
            <button onclick="switchTab('dashboard')" id="btn-dashboard-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70"><i data-lucide="pie-chart" class="w-4 h-4"></i> Dashboard & Finança</button>
            <button onclick="switchTab('gastos')" id="btn-gastos-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70"><i data-lucide="wallet" class="w-4 h-4"></i> Gastos</button>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b px-8 py-5 flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center"><div class="fita-azul"></div><h2 id="page-title" class="text-lg font-light text-slate-500 uppercase tracking-[0.2em]">Painel</h2></div>
            <div class="text-right"><span id="current-date" class="header-date-badge text-sm"></span></div>
        </header>

        <main class="p-4 md:p-8 max-w-[1600px] w-full mx-auto space-y-6">
            <div id="tab-agenda" class="hidden">Agendamentos Conteúdo</div>
            <div id="tab-clientes" class="hidden">Clientes Conteúdo</div>
            <div id="tab-dashboard" class="hidden">Dashboard Conteúdo</div>

            <div id="tab-gastos" class="hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 flex flex-col">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-sm font-black text-slate-800 uppercase tracking-widest">Despesas Fixas</h2>
                            <span class="text-[10px] font-bold text-indigo-500 bg-indigo-50 px-3 py-1 rounded-full" id="data-fixa"></span>
                        </div>
                        <div class="grid grid-cols-1 gap-3 mb-6">
                            <input type="text" id="fixa-nome" placeholder="Nome da despesa (ex: Aluguel)" class="w-full px-4 py-3 bg-slate-50 rounded-2xl text-sm outline-none border border-transparent focus:border-indigo-300">
                            <div class="flex gap-2">
                                <input type="number" id="fixa-valor" placeholder="Valor R$" step="0.01" class="w-full px-4 py-3 bg-slate-50 rounded-2xl text-sm outline-none border border-transparent focus:border-indigo-300">
                                <button onclick="addDespesa('fixa')" class="bg-indigo-600 text-white px-6 rounded-2xl font-bold text-xs uppercase transition hover:bg-indigo-700">Add</button>
                            </div>
                        </div>
                        <div class="h-64 w-full mb-4">
                            <canvas id="chartFixa"></canvas>
                        </div>
                        <div id="lista-fixa" class="space-y-2 mt-4 max-h-48 overflow-y-auto pr-2"></div>
                    </div>

                    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 flex flex-col">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-sm font-black text-slate-800 uppercase tracking-widest">Despesas Variáveis</h2>
                            <span class="text-[10px] font-bold text-emerald-500 bg-emerald-50 px-3 py-1 rounded-full" id="data-variavel"></span>
                        </div>
                        <div class="grid grid-cols-1 gap-3 mb-6">
                            <input type="text" id="var-nome" placeholder="Nome da despesa (ex: Ração)" class="w-full px-4 py-3 bg-slate-50 rounded-2xl text-sm outline-none border border-transparent focus:border-emerald-300">
                            <div class="flex gap-2">
                                <input type="number" id="var-valor" placeholder="Valor R$" step="0.01" class="w-full px-4 py-3 bg-slate-50 rounded-2xl text-sm outline-none border border-transparent focus:border-emerald-300">
                                <button onclick="addDespesa('var')" class="bg-emerald-600 text-white px-6 rounded-2xl font-bold text-xs uppercase transition hover:bg-emerald-700">Add</button>
                            </div>
                        </div>
                        <div class="h-64 w-full mb-4">
                            <canvas id="chartVariavel"></canvas>
                        </div>
                        <div id="lista-var" class="space-y-2 mt-4 max-h-48 overflow-y-auto pr-2"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    // Inicialização de dados
    let despesas = JSON.parse(localStorage.getItem('pet_despesas')) || { fixa: [], var: [] };
    let charts = {};

    function updateDates() {
        const agora = new Date();
        const format = { day: '2-digit', month: '2-digit', year: 'numeric' };
        const dataStr = agora.toLocaleDateString('pt-BR', format);
        if(document.getElementById('data-fixa')) document.getElementById('data-fixa').innerText = dataStr;
        if(document.getElementById('data-variavel')) document.getElementById('data-variavel').innerText = dataStr;
        if(document.getElementById('current-date')) document.getElementById('current-date').innerText = agora.toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long'});
    }

    function initChart(id, label, color) {
        const canvas = document.getElementById(id);
        if(!canvas) return null;
        
        // Destruir gráfico existente se houver para evitar bugs de hover
        if(charts[id]) charts[id].destroy();

        return new Chart(canvas.getContext('2d'), {
            type: 'bar',
            data: { 
                labels: [], 
                datasets: [{ 
                    label: label, 
                    data: [], 
                    backgroundColor: color,
                    borderRadius: 12,
                    borderSkipped: false,
                    barThickness: 30
                }] 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                plugins: { 
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (context) => ` R$ ${context.raw.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`
                        }
                    }
                },
                scales: { 
                    y: { 
                        beginAtZero: true, 
                        grid: { color: '#f1f5f9', drawBorder: false },
                        ticks: { font: { size: 10 }, callback: (v) => 'R$ ' + v } 
                    },
                    x: { grid: { display: false }, ticks: { font: { size: 10, weight: 'bold' } } }
                } 
            }
        });
    }

    function renderGastos() {
        ['fixa', 'var'].forEach(tipo => {
            const lista = document.getElementById(`lista-${tipo}`);
            if(!lista) return;
            
            lista.innerHTML = '';
            const labels = [];
            const valores = [];

            despesas[tipo].forEach((item, index) => {
                labels.push(item.nome);
                valores.push(item.valor);
                
                lista.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100 group transition hover:bg-white hover:shadow-md">
                        <div class="flex flex-col">
                            <span class="text-xs font-black text-slate-700 uppercase tracking-tight">${item.nome}</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="text-sm font-bold ${tipo === 'fixa' ? 'text-indigo-600' : 'text-emerald-600'}">
                                R$ ${item.valor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}
                            </span>
                            <button onclick="removeDespesa('${tipo}', ${index})" class="text-slate-300 hover:text-rose-500 transition">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>`;
            });

            const chart = charts[tipo === 'fixa' ? 'chartFixa' : 'chartVariavel'];
            if(chart) {
                chart.data.labels = labels;
                chart.data.datasets[0].data = valores;
                chart.update();
            }
        });
        
        localStorage.setItem('pet_despesas', JSON.stringify(despesas));
        if(typeof lucide !== 'undefined') lucide.createIcons();
    }

    function addDespesa(tipo) {
        const inputNome = document.getElementById(`${tipo}-nome`);
        const inputValor = document.getElementById(`${tipo}-valor`);
        
        const nome = inputNome.value.trim();
        const valor = parseFloat(inputValor.value);

        if (nome && !isNaN(valor) && valor > 0) {
            despesas[tipo].push({ nome, valor });
            inputNome.value = '';
            inputValor.value = '';
            renderGastos();
        } else {
            alert("Por favor, informe o nome e um valor válido.");
        }
    }

    function removeDespesa(tipo, index) {
        despesas[tipo].splice(index, 1);
        renderGastos();
    }

    function switchTab(tab) {
        const tabs = ['agenda', 'clientes', 'dashboard', 'gastos'];
        tabs.forEach(t => {
            const el = document.getElementById(`tab-${t}`);
            const btn = document.getElementById(`btn-${t}-dt`);
            if(el) el.classList.add('hidden');
            if(btn) btn.classList.add('opacity-70');
        });

        const activeTab = document.getElementById(`tab-${tab}`);
        const activeBtn = document.getElementById(`btn-${tab}-dt`);
        if(activeTab) activeTab.classList.remove('hidden');
        if(activeBtn) activeBtn.classList.remove('opacity-70');
        
        document.getElementById('page-title').innerText = tab.toUpperCase();
        localStorage.setItem('pet_last_tab', tab);
        
        if(tab === 'gastos') {
            updateDates();
            renderGastos();
        }
    }

    window.onload = () => {
        // Inicializar gráficos com cores elegantes
        charts.chartFixa = initChart('chartFixa', 'Fixas', '#4f46e5'); // Indigo 600
        charts.chartVariavel = initChart('chartVariavel', 'Variáveis', '#10b981'); // Emerald 500
        
        updateDates();
        renderGastos();
        
        const lastTab = localStorage.getItem('pet_last_tab') || 'agenda';
        switchTab(lastTab);
        lucide.createIcons();
    };
</script>
</body>
</html>

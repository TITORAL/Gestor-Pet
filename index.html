<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet - Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .hidden { display: none !important; }
        .bg-pet-sidebar { background-color: #312e81; } 
        .bg-pet-active { background-color: #4338ca; }
        .fita-azul { width: 3px; height: 20px; background-color: #3b82f6; border-radius: 4px; margin-right: 12px; }
        
        .header-date-badge {
            background-color: #e0f2fe; color: #0369a1;
            padding: 8px 16px; border-radius: 12px; font-weight: 600;
        }

        .error-field {
            border: 2px solid #ef4444 !important;
            animation: shake 0.2s ease-in-out 0s 2;
            background-color: #fef2f2 !important;
        }

        @keyframes shake {
            0% { margin-left: 0rem; }
            25% { margin-left: 0.5rem; }
            75% { margin-left: -0.5rem; }
            100% { margin-left: 0rem; }
        }

        .client-card {
            background: #fff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f1f5f9;
        }
        .client-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-color: #e2e8f0;
        }
        
        .calendar-grid-container {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 1px; background-color: #e2e2f0; border: 1px solid #e2e8f0;
            transition: max-height 0.3s ease-out;
            overflow: hidden;
        }

        .calendar-collapsed {
            max-height: 0;
            border: none;
        }

        .calendar-cell {
            background: white; min-height: 80px; padding: 8px;
            transition: all 0.2s; cursor: pointer;
        }
        .calendar-cell:hover { background-color: #f1f5f9; }
        .calendar-cell.selected { background-color: #eef2ff; border: 1px solid #4338ca; }
        .cell-day-number { font-size: 13px; font-weight: 800; color: #1e293b; margin-bottom: 4px; }
        .event-dot { width: 6px; height: 6px; background: #4338ca; border-radius: 50%; display: inline-block; margin-right: 2px; }

        .status-indicator { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 6px; }
        .status-done { background-color: #10b981; box-shadow: 0 0 8px #10b98166; }
        .status-canceled { background-color: #ef4444; box-shadow: 0 0 8px #ef444466; }

        .btn-status { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .btn-check { background-color: #ecfdf5; color: #10b981; border: 1px solid #10b981; }
        .btn-check.active { background-color: #10b981; color: white; }
        .btn-x { background-color: #fef2f2; color: #ef4444; border: 1px solid #ef4444; }
        .btn-x.active { background-color: #ef4444; color: white; }

        .expandable-clients {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 0;
            overflow: hidden;
            opacity: 0;
        }
        .expandable-clients.open {
            max-height: 2000px;
            opacity: 1;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="main-app" class="flex h-screen overflow-hidden">
        
        <aside class="sidebar-desktop w-64 bg-pet-sidebar text-white flex flex-col p-6">
            <div class="flex items-center gap-3 mb-10">
                <i data-lucide="paw-print" class="w-8 h-8 text-indigo-300"></i>
                <h1 class="text-lg font-black tracking-tight uppercase">Agenda Pet</h1>
            </div>
            <nav class="space-y-1">
                <button onclick="switchTab('agenda')" id="btn-agenda-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70">
                    <i data-lucide="calendar-days" class="w-4 h-4"></i> Agendamentos
                </button>
                <button onclick="switchTab('clientes')" id="btn-clientes-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70">
                    <i data-lucide="contact-round" class="w-4 h-4"></i> Clientes
                </button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70">
                    <i data-lucide="wallet-cards" class="w-4 h-4"></i> Dashboard & Finança
                </button>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col overflow-y-auto">
            <header id="header-main" class="bg-white border-b px-8 py-5 flex justify-between items-center sticky top-0 z-40">
                <div class="flex items-center">
                    <div class="fita-azul"></div>
                    <h2 id="page-title" class="text-lg font-light text-slate-500 uppercase tracking-[0.2em]">Agendamentos</h2>
                </div>
                <div class="text-right">
                    <span id="current-date" class="header-date-badge text-sm"></span>
                </div>
            </header>

            <main class="content-area p-8 max-w-[1600px] w-full mx-auto space-y-6">

                <div id="tab-agenda" class="hidden grid grid-cols-12 gap-6 items-start">
                    <div class="col-span-3">
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <h3 id="form-title" class="font-bold text-slate-800 text-xs uppercase mb-4 tracking-widest">Agendar</h3>
                            <form id="appointment-form" onsubmit="handleFormSubmit(event)" class="space-y-3" novalidate>
                                <input type="hidden" id="edit-id">
                                <input type="text" id="clientNameSearch" placeholder="Tutor" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <input type="text" id="petName" placeholder="Pet" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="date" id="serviceDate" class="w-full px-3 py-3 bg-slate-50 border-none rounded-2xl text-xs outline-none">
                                    <input type="time" id="serviceTime" class="w-full px-3 py-3 bg-slate-50 border-none rounded-2xl text-xs outline-none">
                                </div>
                                <select id="serviceType" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-sm outline-none">
                                    <option value="Banho">Banho</option>
                                    <option value="Tosa">Tosa</option>
                                    <option value="Completo">Banho e Tosa</option>
                                </select>
                                <input type="number" id="serviceValue" placeholder="Valor R$" step="0.01" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-sm outline-none">
                                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all text-xs uppercase tracking-widest">Confirmar</button>
                            </form>
                        </div>
                    </div>

                    <div class="col-span-9 space-y-6">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                            <div class="p-6 border-b border-slate-50 flex justify-between items-center">
                                <div class="flex items-center gap-4">
                                    <span id="cal-month" class="text-sm font-black uppercase tracking-widest text-slate-800"></span>
                                    <button onclick="toggleCalendar()" class="text-[10px] bg-slate-100 text-slate-500 px-3 py-1 rounded-full font-bold uppercase hover:bg-indigo-50 hover:text-indigo-600 transition-all flex items-center gap-1">
                                        <i data-lucide="calendar-days" class="w-3 h-3"></i> <span id="toggle-text">Ver Calendário</span>
                                    </button>
                                </div>
                                <div class="flex gap-4">
                                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-xl transition"><i data-lucide="chevron-left" class="w-5 h-5 text-slate-400"></i></button>
                                    <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-xl transition"><i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i></button>
                                </div>
                            </div>
                            <div id="calendar-grid" class="calendar-grid-container calendar-collapsed"></div>
                        </div>

                        <div id="day-details-card" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <div class="flex justify-between items-center mb-6">
                                <h3 id="selected-day-title" class="font-bold text-indigo-600 text-xs uppercase tracking-widest">Agenda do Dia</h3>
                                <div id="selected-date-display" class="text-[10px] font-bold text-slate-400 uppercase">Selecione uma data</div>
                            </div>
                            <div id="day-appointments-list" class="space-y-3">
                                <p class="text-slate-400 text-sm italic text-center py-8">Escolha um dia no calendário para ver os serviços.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="tab-clientes" class="hidden space-y-6 max-w-4xl mx-auto">
                    <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                        <div class="flex justify-between items-center gap-4">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 shadow-sm">
                                    <i data-lucide="users" class="w-7 h-7"></i>
                                </div>
                                <div>
                                    <h3 class="text-xl font-black text-slate-800 tracking-tight">Clientes</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="tab-dashboard" class="hidden space-y-6 max-w-[1600px] mx-auto">
                    <h3 class="text-xl font-black text-slate-800 tracking-tight">Dashboard & Finança</h3>
                </div>

            </main>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            ['agenda', 'clientes', 'dashboard'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                const btn = document.getElementById(`btn-${t}-dt`);
                if(el) el.classList.add('hidden');
                if(btn) { btn.classList.remove('bg-pet-active'); btn.style.opacity = "0.7"; }
            });

            const activeTab = document.getElementById(`tab-${tab}`);
            const activeBtn = document.getElementById(`btn-${tab}-dt`);
            if(activeTab) activeTab.classList.remove('hidden');
            if(activeBtn) { activeBtn.classList.add('bg-pet-active'); activeBtn.style.opacity = "1"; }
            
            document.getElementById('page-title').innerText = tab.charAt(0).toUpperCase() + tab.slice(1);
            
            // ESSENCIAL: Reinicializa os ícones após a troca de aba
            lucide.createIcons();
        }

        window.onload = () => {
            const date = new Date();
            document.getElementById('current-date').innerText = date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
            switchTab('agenda');
            // ESSENCIAL: Inicializa os ícones no carregamento
            lucide.createIcons();
        };

        function toggleCalendar() {
            const grid = document.getElementById('calendar-grid');
            const isCollapsed = grid.classList.toggle('calendar-collapsed');
            document.getElementById('toggle-text').innerText = isCollapsed ? 'Ver Calendário' : 'Recolher';
        }
    </script>
</body>
</html>

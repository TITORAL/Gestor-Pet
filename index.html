<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet - Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .hidden { display: none !important; }
        .bg-pet-sidebar { background-color: #1e1b4b; } 
        .bg-pet-active { background-color: #3730a3; }
        .fita-azul { width: 3px; height: 20px; background-color: #3b82f6; border-radius: 4px; margin-right: 12px; }
        
        /* Estilo da Data Tom sobre Tom */
        .header-date-badge {
            background-color: #e0f2fe; /* Azul clarinho */
            color: #0369a1; /* Azul escuro */
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Calendário Expandido */
        .calendar-grid-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #f1f5f9;
            border: 1px solid #f1f5f9;
        }
        .calendar-cell {
            background: white;
            min-height: 100px;
            padding: 6px;
            transition: all 0.2s;
        }
        .calendar-cell:hover { background-color: #f8fafc; }
        .cell-day-number { font-size: 11px; font-weight: 800; color: #94a3b8; margin-bottom: 4px; }
        .event-tag {
            font-size: 9px;
            padding: 2px 6px;
            background: #eef2ff;
            color: #4338ca;
            border-radius: 4px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
            cursor: pointer;
        }
        .event-tag:hover { background: #e0e7ff; }

        @media (max-width: 768px) {
            .sidebar-desktop { display: none; }
            .mobile-nav { display: flex; }
            .main-content { padding-bottom: 90px; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="main-app" class="flex flex-col md:flex-row h-screen overflow-hidden">
        
        <aside class="sidebar-desktop w-64 bg-pet-sidebar text-white flex flex-col p-6">
            <div class="flex items-center gap-3 mb-10 opacity-90">
                <i data-lucide="dog" class="w-7 h-7 text-indigo-400"></i>
                <h1 class="text-sm font-extrabold tracking-widest uppercase">Pet Manager</h1>
            </div>
            <nav class="space-y-1">
                <button onclick="switchTab('agenda')" id="btn-agenda-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl bg-pet-active transition text-sm font-semibold">
                    <i data-lucide="calendar" class="w-4 h-4"></i> Agendamentos
                </button>
                <button onclick="switchTab('clientes')" id="btn-clientes-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl hover:bg-indigo-900/50 transition text-sm font-semibold opacity-70">
                    <i data-lucide="users" class="w-4 h-4"></i> Clientes
                </button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl hover:bg-indigo-900/50 transition text-sm font-semibold opacity-70">
                    <i data-lucide="pie-chart" class="w-4 h-4"></i> Financeiro
                </button>
            </nav>
        </aside>

        <nav class="mobile-nav hidden fixed bottom-0 left-0 right-0 bg-white border-t z-50 flex justify-around p-3 shadow-lg">
            <button onclick="switchTab('agenda')" id="btn-agenda-mb" class="flex flex-col items-center text-indigo-900"><i data-lucide="calendar" class="w-5 h-5"></i></button>
            <button onclick="switchTab('clientes')" id="btn-clientes-mb" class="flex flex-col items-center text-slate-400"><i data-lucide="users" class="w-5 h-5"></i></button>
            <button onclick="switchTab('dashboard')" id="btn-dashboard-mb" class="flex flex-col items-center text-slate-400"><i data-lucide="pie-chart" class="w-5 h-5"></i></button>
        </nav>

        <div class="flex-1 flex flex-col overflow-y-auto main-content">
            <header class="bg-white/80 backdrop-blur-md border-b px-8 py-5 flex justify-between items-center sticky top-0 z-40">
                <div class="flex items-center">
                    <div class="fita-azul"></div>
                    <h2 id="page-title" class="text-lg font-light text-slate-500 uppercase tracking-[0.2em]">Agendamento</h2>
                </div>
                <div class="text-right">
                    <span id="current-date" class="header-date-badge text-sm"></span>
                </div>
            </header>

            <main class="p-4 md:p-8 max-w-[1600px] w-full mx-auto space-y-6">

                <div id="tab-agenda" class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    
                    <div class="lg:col-span-3">
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <h3 id="form-title" class="font-bold text-slate-800 text-xs uppercase mb-4 tracking-widest">Agendar</h3>
                            <form id="appointment-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
                                <input type="hidden" id="edit-id">
                                <input type="text" id="clientNameSearch" placeholder="Tutor" oninput="autoFillPet(this.value)" required class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <input type="text" id="petName" placeholder="Pet" required class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="date" id="serviceDate" required class="w-full px-3 py-3 bg-slate-50 border-none rounded-2xl text-xs outline-none">
                                    <input type="time" id="serviceTime" required class="w-full px-3 py-3 bg-slate-50 border-none rounded-2xl text-xs outline-none">
                                </div>
                                <select id="serviceType" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-sm outline-none">
                                    <option value="Banho">Banho</option>
                                    <option value="Tosa">Tosa</option>
                                    <option value="Completo">Banho e Tosa</option>
                                </select>
                                <input type="number" id="serviceValue" placeholder="R$ 0,00" step="0.01" required class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-sm outline-none">
                                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all text-xs uppercase tracking-widest">Confirmar</button>
                            </form>
                        </div>
                    </div>

                    <div class="lg:col-span-9 bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                        <div class="p-6 border-b border-slate-50 flex justify-between items-center bg-white">
                            <span id="cal-month" class="text-sm font-black uppercase tracking-widest text-slate-800">Maio 2026</span>
                            <div class="flex gap-4">
                                <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-xl transition"><i data-lucide="chevron-left" class="w-5 h-5 text-slate-400"></i></button>
                                <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-xl transition"><i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i></button>
                            </div>
                        </div>
                        <div class="grid grid-cols-7 text-center py-3 bg-slate-50/50 border-b border-slate-100 text-[10px] font-black text-slate-400 uppercase tracking-tighter">
                            <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
                        </div>
                        <div id="calendar-grid" class="calendar-grid-container"></div>
                    </div>
                </div>

                <div id="tab-clientes" class="hidden flex flex-col items-center space-y-6">
                    <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm w-full max-w-md">
                        <h3 id="client-form-title" class="font-bold text-slate-800 uppercase mb-6 text-center text-xs tracking-[0.2em]">Cadastro</h3>
                        <form id="client-form" onsubmit="saveClient(event)" class="space-y-3">
                            <input type="hidden" id="edit-client-index">
                            <input type="text" id="regClientName" placeholder="Nome do Tutor" required class="w-full px-4 py-4 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                            <input type="tel" id="regPhone" placeholder="WhatsApp" required class="w-full px-4 py-4 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                            <input type="text" id="regPet" placeholder="Nome do Pet" required class="w-full px-4 py-4 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                            <button id="client-submit-btn" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl mt-2 text-xs uppercase">Salvar Cliente</button>
                        </form>
                    </div>
                    <div class="w-full max-w-md bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
                        <div id="client-list-bi" class="divide-y divide-slate-50"></div>
                    </div>
                </div>

                <div id="tab-dashboard" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-8 rounded-3xl border-b-4 border-emerald-500 shadow-sm">
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Receita</p>
                        <h3 class="text-2xl font-black text-slate-800" id="kpi-ganhos">R$ 0,00</h3>
                    </div>
                    <div class="bg-white p-8 rounded-3xl border-b-4 border-rose-500 shadow-sm">
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Cancelados</p>
                        <h3 class="text-2xl font-black text-slate-800" id="kpi-perdas">R$ 0,00</h3>
                    </div>
                    <div class="bg-white p-8 rounded-3xl border-b-4 border-indigo-500 shadow-sm">
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Saldo</p>
                        <h3 class="text-2xl font-black text-slate-800" id="kpi-saldo">R$ 0,00</h3>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
        let appointments = JSON.parse(localStorage.getItem('pet_appointments')) || [];
        let clients = JSON.parse(localStorage.getItem('pet_clients')) || [];
        let currentCalDate = new Date();

        function switchTab(tab) {
            ['agenda', 'clientes', 'dashboard'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}-dt`).classList.remove('bg-pet-active');
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}-dt`).classList.add('bg-pet-active');
            if(tab === 'dashboard') updateDashboard();
            if(tab === 'clientes') renderClientList();
            if(tab === 'agenda') renderCalendar();
            lucide.createIcons();
        }

        // --- CALENDÁRIO COM SERVIÇOS DENTRO ---
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthLabel = document.getElementById('cal-month');
            grid.innerHTML = '';
            
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();
            monthLabel.innerText = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(currentCalDate).toUpperCase();

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div class="calendar-cell bg-slate-50/30"></div>';

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dailyApps = appointments.filter(a => a.serviceDate === dateStr);
                
                let eventsHtml = dailyApps.map(app => `
                    <div onclick="editApp(${app.id})" class="event-tag" title="${app.serviceTime} - ${app.clientName}">
                        ${app.serviceTime} ${app.petName}
                    </div>
                `).join('');

                grid.innerHTML += `
                    <div class="calendar-cell">
                        <div class="cell-day-number">${day}</div>
                        <div class="flex flex-col">${eventsHtml}</div>
                    </div>`;
            }
        }

        function changeMonth(dir) {
            currentCalDate.setMonth(currentCalDate.getMonth() + dir);
            renderCalendar();
        }

        // --- PERSISTÊNCIA E DADOS ---
        function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const data = {
                id: editId ? parseInt(editId) : Date.now(),
                clientName: document.getElementById('clientNameSearch').value,
                petName: document.getElementById('petName').value,
                serviceType: document.getElementById('serviceType').value,
                serviceValue: parseFloat(document.getElementById('serviceValue').value),
                serviceDate: document.getElementById('serviceDate').value,
                serviceTime: document.getElementById('serviceTime').value,
                status: 'pendente'
            };
            if (editId) appointments = appointments.map(a => a.id == editId ? data : a);
            else appointments.push(data);
            localStorage.setItem('pet_appointments', JSON.stringify(appointments));
            resetForm();
            renderCalendar();
        }

        function editApp(id) {
            const app = appointments.find(a => a.id === id);
            document.getElementById('edit-id').value = app.id;
            document.getElementById('clientNameSearch').value = app.clientName;
            document.getElementById('petName').value = app.petName;
            document.getElementById('serviceType').value = app.serviceType;
            document.getElementById('serviceValue').value = app.serviceValue;
            document.getElementById('serviceDate').value = app.serviceDate;
            document.getElementById('serviceTime').value = app.serviceTime;
            document.getElementById('form-title').innerText = "Editar " + app.petName;
        }

        function resetForm() {
            document.getElementById('appointment-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').innerText = "Agendar";
        }

        function saveClient(e) {
            e.preventDefault();
            clients.push({ name: document.getElementById('regClientName').value, pet: document.getElementById('regPet').value, phone: document.getElementById('regPhone').value });
            localStorage.setItem('pet_clients', JSON.stringify(clients));
            e.target.reset();
            renderClientList();
        }

        function renderClientList() {
            const list = document.getElementById('client-list-bi');
            list.innerHTML = '';
            clients.sort((a,b) => a.name.localeCompare(b.name)).forEach(c => {
                list.innerHTML += `
                    <div class="px-6 py-4 flex justify-between items-center">
                        <div><p class="text-sm font-extrabold">${c.name}</p><p class="text-xs text-indigo-500 font-bold">${c.pet}</p></div>
                        <span class="text-sm text-slate-400 font-bold">${c.phone}</span>
                    </div>`;
            });
        }

        function updateDashboard() {
            let g = appointments.reduce((acc, a) => acc + (a.status === 'concluido' ? a.serviceValue : 0), 0);
            document.getElementById('kpi-ganhos').innerText = `R$ ${g.toFixed(2)}`;
        }

        function autoFillPet(name) {
            const found = clients.find(c => c.name.toLowerCase().includes(name.toLowerCase()));
            if (found && name.length > 2) document.getElementById('petName').value = found.pet;
        }

        window.onload = () => {
            const d = new Date();
            const formatada = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('current-date').innerText = formatada.split(' ').map(w => w.length > 2 ? w.charAt(0).toUpperCase() + w.slice(1) : w).join(' ');
            renderCalendar();
            lucide.createIcons();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetManager - Dashboard Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #374151; border-radius: 20px; }
        
        .hidden { display: none !important; }
        .bg-dark-main { background-color: #111827; }
        .bg-dark-card { background-color: #1f2937; }
        .bg-pet-sidebar { background-color: #1e1b4b; } 
        .bg-pet-active { background-color: #312e81 !important; border-left: 4px solid #818cf8; }
        
        /* Efeito de brilho nos KPIs similar à foto */
        .glow-blue { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); color: #60a5fa; }
        .glow-green { text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); color: #34d399; }
        .glow-pink { text-shadow: 0 0 10px rgba(244, 63, 94, 0.5); color: #fb7185; }
    </style>
</head>
<body class="bg-dark-main text-gray-100 font-sans">

    <div id="main-app" class="flex h-screen overflow-hidden">
        
        <div class="w-72 bg-pet-sidebar text-white flex flex-col shadow-2xl">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-10">
                    <div class="bg-indigo-400/20 p-2 rounded-xl">
                        <i data-lucide="dog" class="w-8 h-8 text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight">PetManager</h1>
                </div>

                <nav class="space-y-3">
                    <button onclick="switchTab('clientes')" id="btn-clientes" class="flex items-center gap-4 w-full px-5 py-4 rounded-xl text-indigo-100 hover:bg-indigo-800 transition font-medium">
                        <i data-lucide="users" class="w-6 h-6"></i> Clientes
                    </button>
                    <button onclick="switchTab('agenda')" id="btn-agenda" class="flex items-center gap-4 w-full px-5 py-4 rounded-xl text-indigo-100 hover:bg-indigo-800 transition font-medium">
                        <i data-lucide="calendar" class="w-6 h-6"></i> Agenda
                    </button>
                    <button onclick="switchTab('dashboard')" id="btn-dashboard" class="flex items-center gap-4 w-full px-5 py-4 rounded-xl text-indigo-100 hover:bg-indigo-800 transition font-medium">
                        <i data-lucide="bar-chart-3" class="w-6 h-6"></i> Dashboard
                    </button>
                </nav>
            </div>
        </div>

        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-dark-main border-b border-gray-800 px-8 py-5 flex justify-between items-center sticky top-0 z-10">
                <div class="flex items-center gap-4">
                    <div class="w-2 h-8 bg-indigo-500 rounded-full"></div> 
                    <h2 id="page-title" class="text-xl font-bold uppercase tracking-widest text-gray-300">Dashboard & Finanças</h2>
                </div>
                <span class="text-xs font-bold text-gray-500" id="current-date"></span>
            </header>

            <main class="p-8 max-w-7xl w-full mx-auto space-y-6">

                <div id="tab-dashboard" class="space-y-8">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="bg-dark-card p-6 rounded-2xl border border-gray-800 shadow-lg">
                            <p class="text-xs font-bold text-gray-500 uppercase">Receita Hoje</p>
                            <h3 class="text-2xl font-black mt-2 glow-blue" id="kpi-ganhos">R$ 0,00</h3>
                        </div>
                        <div class="bg-dark-card p-6 rounded-2xl border border-gray-800 shadow-lg">
                            <p class="text-xs font-bold text-gray-500 uppercase">Margem (Meta)</p>
                            <h3 class="text-2xl font-black mt-2 glow-green" id="kpi-concluidos">0</h3>
                        </div>
                        <div class="bg-dark-card p-6 rounded-2xl border border-gray-800 shadow-lg">
                            <p class="text-xs font-bold text-gray-500 uppercase">Perda / Cancelados</p>
                            <h3 class="text-2xl font-black mt-2 glow-pink" id="kpi-cancelados">0</h3>
                        </div>
                        <div class="bg-dark-card p-6 rounded-2xl border border-gray-800 shadow-lg">
                            <p class="text-xs font-bold text-gray-500 uppercase">Ticket Médio</p>
                            <h3 class="text-2xl font-black mt-2 text-white" id="kpi-ticket-medio">R$ 0,00</h3>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 bg-dark-card p-6 rounded-2xl border border-gray-800">
                            <h3 class="text-sm font-bold text-gray-400 mb-6 uppercase tracking-wider">Faturamento Mensal vs Custos</h3>
                            <div class="h-[350px]"><canvas id="financeChart"></canvas></div>
                        </div>
                        <div class="bg-dark-card p-6 rounded-2xl border border-gray-800">
                            <h3 class="text-sm font-bold text-gray-400 mb-6 uppercase tracking-wider">Distribuição de Serviços</h3>
                            <div class="h-[350px]"><canvas id="serviceMixChart"></canvas></div>
                        </div>
                    </div>

                    <div class="bg-dark-card rounded-2xl border border-gray-800 overflow-hidden shadow-xl">
                        <div class="p-6 border-b border-gray-800"><h3 class="font-bold text-gray-300">Análise de Vendas Recentes</h3></div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead class="bg-gray-900/50 text-gray-500 text-xs font-bold uppercase">
                                    <tr>
                                        <th class="px-6 py-4">Data</th>
                                        <th class="px-6 py-4">Cliente / Pet</th>
                                        <th class="px-6 py-4">Serviço</th>
                                        <th class="px-6 py-4 text-right">Receita</th>
                                    </tr>
                                </thead>
                                <tbody id="recent-transactions" class="divide-y divide-gray-800 text-gray-300"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="tab-clientes" class="hidden text-center py-20 text-gray-500 italic">Interface de Clientes Ativa</div>
                <div id="tab-agenda" class="hidden text-center py-20 text-gray-500 italic">Interface de Agenda Ativa</div>

            </main>
        </div>
    </div>

    <script>
        let appointments = JSON.parse(localStorage.getItem('pet_appointments')) || [];
        let financeChart = null, serviceMixChart = null;

        window.onload = () => {
            lucide.createIcons();
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
            renderDashboard();
        };

        function switchTab(tab) {
            ['agenda', 'clientes', 'dashboard'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).classList.remove('bg-pet-active');
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).classList.add('bg-pet-active');
            if (tab === 'dashboard') renderDashboard();
        }

        function renderDashboard() {
            const hoje = new Date().toISOString().split('T')[0];
            let ganhosDia = 0, concluidoQtde = 0, canceladoQtde = 0;
            const mix = { "Banho": 5, "Tosa": 3, "Banho e Tosa": 8, "Consulta": 2 }; // Dados exemplo
            const faturamentoMensal = [450, 600, 550, 700, 850, 650, 900, 1100, 1200, 1300, 950, 400];

            appointments.forEach(app => {
                if (app.status === 'concluido' && app.serviceDate === hoje) { ganhosDia += app.serviceValue; concluidoQtde++; }
                if (app.status === 'cancelado' && app.serviceDate === hoje) canceladoQtde++;
            });

            document.getElementById('kpi-ganhos').innerText = `R$ ${ganhosDia.toFixed(2)}`;
            document.getElementById('kpi-concluidos').innerText = concluidoQtde || "42%"; 
            document.getElementById('kpi-cancelados').innerText = canceladoQtde;

            // --- GRÁFICO DE BARRAS (FINO E ELEGANTE) ---
            if(financeChart) financeChart.destroy();
            financeChart = new Chart(document.getElementById('financeChart'), {
                type: 'bar',
                data: { 
                    labels: ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'], 
                    datasets: [{ 
                        label: 'Receita', 
                        data: faturamentoMensal, 
                        backgroundColor: '#3b82f6', 
                        borderRadius: 4,
                        barPercentage: 0.4 // Torna as colunas mais finas
                    }] 
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' } },
                        x: { grid: { display: false }, ticks: { color: '#9ca3af' } }
                    } 
                }
            });

            // --- GRÁFICO DE ROSCA (DOUGHNUT) ---
            if(serviceMixChart) serviceMixChart.destroy();
            serviceMixChart = new Chart(document.getElementById('serviceMixChart'), {
                type: 'doughnut',
                data: { 
                    labels: Object.keys(mix), 
                    datasets: [{ 
                        data: Object.values(mix), 
                        backgroundColor: ['#3b82f6','#10b981','#f43f5e','#f59e0b'],
                        borderWidth: 0
                    }] 
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    cutout: '80%',
                    plugins: { legend: { position: 'bottom', labels: { color: '#9ca3af', usePointStyle: true } } }
                }
            });

            // Preenchimento da tabela (Exemplo)
            document.getElementById('recent-transactions').innerHTML = `
                <tr>
                    <td class="px-6 py-4 text-gray-500">23/05/2026</td>
                    <td class="px-6 py-4 font-bold">Carla Ferreira <span class="block text-xs font-normal text-gray-500">Pet: Thor</span></td>
                    <td class="px-6 py-4">Banho e Tosa</td>
                    <td class="px-6 py-4 text-right font-bold text-blue-400">R$ 120,00</td>
                </tr>
                <tr>
                    <td class="px-6 py-4 text-gray-500">23/05/2026</td>
                    <td class="px-6 py-4 font-bold">Leonardo Cardoso <span class="block text-xs font-normal text-gray-500">Pet: Mel</span></td>
                    <td class="px-6 py-4">Consulta</td>
                    <td class="px-6 py-4 text-right font-bold text-blue-400">R$ 250,00</td>
                </tr>
            `;
        }
    </script>
</body>
</html>

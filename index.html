<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet - Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=ADLaM+Display&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        .font-agenda-pet { font-family: 'ADLaM Display', system-ui; }
        
        /* Layout Original - Fixando a Sidebar */
        .sidebar-original {
            width: 280px;
            background-color: #312e81;
            height: 100vh;
            flex-shrink: 0;
        }

        .main-content {
            flex-grow: 1;
            height: 100vh;
            overflow-y: auto;
            background-color: #f8fafc;
        }

        /* Cores de Destaque */
        .bg-pet-active { background-color: #4338ca !important; opacity: 1 !important; }
        .fita-azul { width: 4px; height: 24px; background-color: #3b82f6; border-radius: 4px; margin-right: 12px; }

        /* Calendar Grid Estrito */
        .calendar-grid-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background-color: #e2e8f0;
            gap: 1px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .calendar-collapsed { max-height: 0; border: none; opacity: 0; }

        .calendar-cell {
            background: white;
            min-height: 90px;
            padding: 10px;
            cursor: pointer;
        }

        /* Estilo dos Cards do Dashboard */
        .dash-card {
            border-radius: 2rem;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 180px;
            position: relative;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="flex h-screen w-full">
        
        <aside class="sidebar-original hidden md:flex flex-col p-8 text-white">
            <div class="flex items-center gap-3 mb-12">
                <i data-lucide="dog" class="w-10 h-10 text-indigo-300"></i>
                <h1 class="text-xl font-agenda-pet tracking-tight uppercase">Agenda Pet</h1>
            </div>
            
            <nav class="space-y-2">
                <button onclick="switchTab('agenda')" id="btn-agenda-dt" class="flex items-center gap-4 w-full px-5 py-4 rounded-2xl transition-all text-sm font-bold opacity-70 hover:opacity-100">
                    <i data-lucide="calendar" class="w-5 h-5"></i> Agendamentos
                </button>
                <button onclick="switchTab('clientes')" id="btn-clientes-dt" class="flex items-center gap-4 w-full px-5 py-4 rounded-2xl transition-all text-sm font-bold opacity-70 hover:opacity-100">
                    <i data-lucide="users" class="w-5 h-5"></i> Clientes
                </button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard-dt" class="flex items-center gap-4 w-full px-5 py-4 rounded-2xl transition-all text-sm font-bold opacity-70 hover:opacity-100">
                    <i data-lucide="pie-chart" class="w-5 h-5"></i> Dashboard
                </button>
            </nav>
        </aside>

        <div class="main-content">
            
            <header class="bg-white/80 backdrop-blur-md border-b px-10 py-6 flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center">
                    <div class="fita-azul"></div>
                    <h2 id="page-title" class="text-lg font-light text-slate-400 uppercase tracking-[0.3em]">Agendamentos</h2>
                </div>
                <div class="header-date-badge bg-blue-50 text-blue-700 px-5 py-2 rounded-2xl font-bold text-sm shadow-sm border border-blue-100">
                    <span id="current-date"></span>
                </div>
            </header>

            <main class="p-10 max-w-[1400px] mx-auto">

                <div id="tab-agenda" class="grid grid-cols-12 gap-10">
                    <div class="col-span-12 lg:col-span-4 xl:col-span-3">
                        <div class="bg-white p-8 rounded-[2rem] shadow-xl shadow-slate-200/50 border border-slate-100">
                            <h3 class="font-black text-slate-800 text-xs uppercase mb-6 tracking-[0.2em]">Novo Registro</h3>
                            <form id="appointment-form" class="space-y-4">
                                <input type="text" placeholder="Tutor" class="w-full px-5 py-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 ring-indigo-500/20 transition-all border-none text-sm">
                                <input type="text" placeholder="Pet" class="w-full px-5 py-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 ring-indigo-500/20 transition-all border-none text-sm">
                                <div class="grid grid-cols-2 gap-3">
                                    <input type="date" class="px-4 py-4 bg-slate-50 rounded-2xl text-xs border-none outline-none">
                                    <input type="time" class="px-4 py-4 bg-slate-50 rounded-2xl text-xs border-none outline-none">
                                </div>
                                <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-5 rounded-2xl shadow-lg shadow-indigo-200 active:scale-95 transition-all text-xs uppercase tracking-widest mt-4">Salvar Agenda</button>
                            </form>
                        </div>
                    </div>

                    <div class="col-span-12 lg:col-span-8 xl:col-span-9 space-y-8">
                        <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                            <div class="p-8 border-b border-slate-50 flex justify-between items-center">
                                <h3 id="cal-month" class="text-sm font-black uppercase tracking-widest text-slate-800">Maio 2026</h3>
                                <div class="flex gap-2">
                                    <button onclick="toggleCalendar()" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:bg-indigo-600 hover:text-white transition-all">Alternar Calendário</button>
                                </div>
                            </div>
                            <div id="calendar-grid" class="calendar-grid-container">
                                </div>
                        </div>

                        <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 min-h-[300px]">
                            <h3 class="font-bold text-indigo-600 text-xs uppercase tracking-widest mb-6">Serviços do Dia</h3>
                            <div id="day-list" class="text-center py-20 text-slate-300 italic text-sm">Selecione uma data para exibir os agendamentos.</div>
                        </div>
                    </div>
                </div>

                <div id="tab-clientes" class="hidden">
                    </div>

            </main>
        </div>
    </div>

    <script>
        // Lógica de Troca de Abas para manter o layout original
        function switchTab(tab) {
            // Esconde todas
            ['agenda', 'clientes', 'dashboard'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                const btn = document.getElementById(`btn-${t}-dt`);
                if(el) el.classList.add('hidden');
                if(btn) btn.classList.remove('bg-pet-active');
            });

            // Mostra a selecionada
            const activeTab = document.getElementById(`tab-${tab}`);
            const activeBtn = document.getElementById(`btn-${tab}-dt`);
            if(activeTab) activeTab.classList.remove('hidden');
            if(activeBtn) activeBtn.classList.add('bg-pet-active');

            // Título dinâmico
            const titles = { 'agenda': 'Agendamentos', 'clientes': 'Clientes', 'dashboard': 'Dashboard' };
            document.getElementById('page-title').innerText = titles[tab];
            
            lucide.createIcons();
        }

        function toggleCalendar() {
            document.getElementById('calendar-grid').classList.toggle('calendar-collapsed');
        }

        // Init
        window.onload = () => {
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
            switchTab('agenda');
            lucide.createIcons();
        }
    </script>
</body>
</html>

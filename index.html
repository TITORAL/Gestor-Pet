<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet - Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .hidden { display: none !important; }
        .bg-pet-sidebar { background-color: #312e81; } 
        .bg-pet-active { background-color: #4338ca; }
        .fita-azul { width: 3px; height: 20px; background-color: #3b82f6; border-radius: 4px; margin-right: 12px; }
        
        .header-date-badge {
            background-color: #e0f2fe; color: #0369a1;
            padding: 8px 16px; border-radius: 12px; font-weight: 600;
        }

        .calendar-grid-container {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 1px; background-color: #e2e2f0; border: 1px solid #e2e8f0;
            transition: max-height 0.3s ease-out;
            overflow: hidden;
        }

        .calendar-collapsed { max-height: 0; border: none; }

        .calendar-cell {
            background: white; min-height: 80px; padding: 8px;
            transition: all 0.2s; cursor: pointer;
        }
        .calendar-cell:hover { background-color: #f1f5f9; }
        
        .expandable-clients {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 0; overflow: hidden; opacity: 0;
        }
        .expandable-clients.open { max-height: 2000px; opacity: 1; margin-top: 1.5rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="main-app" class="flex h-screen overflow-hidden">
        
        <aside class="sidebar-desktop w-64 bg-pet-sidebar text-white flex flex-col p-6">
            <div class="flex items-center gap-3 mb-10">
                <i data-lucide="dog" class="w-8 h-8 text-indigo-300"></i>
                <h1 class="text-lg font-black tracking-tight uppercase">Agenda Pet</h1>
            </div>
            <nav class="space-y-1">
                <button onclick="switchTab('agenda')" id="btn-agenda-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70">
                    <i data-lucide="calendar-days" class="w-4 h-4"></i> Agendamentos
                </button>
                <button onclick="switchTab('clientes')" id="btn-clientes-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70">
                    <i data-lucide="contact-round" class="w-4 h-4"></i> Clientes
                </button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Dashboard & Finança
                </button>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col overflow-y-auto">
            <header id="header-main" class="bg-white border-b px-8 py-5 flex justify-between items-center sticky top-0 z-40">
                <div class="flex items-center">
                    <div class="fita-azul"></div>
                    <h2 id="page-title" class="text-lg font-light text-slate-500 uppercase tracking-[0.2em]">Agendamentos</h2>
                </div>
                <div class="text-right">
                    <span id="current-date" class="header-date-badge text-sm"></span>
                </div>
            </header>

            <main class="content-area p-8 max-w-[1600px] w-full mx-auto space-y-6">

                <div id="tab-agenda" class="hidden grid grid-cols-12 gap-6 items-start">
                    <div class="col-span-3">
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <h3 class="font-bold text-slate-800 text-xs uppercase mb-4 tracking-widest">Agendar</h3>
                            <form id="appointment-form" class="space-y-3">
                                <input type="text" id="clientName" placeholder="Tutor" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <input type="text" id="petName" placeholder="Pet" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="date" id="serviceDate" class="w-full px-3 py-3 bg-slate-50 border-none rounded-2xl text-xs outline-none">
                                    <input type="time" id="serviceTime" class="w-full px-3 py-3 bg-slate-50 border-none rounded-2xl text-xs outline-none">
                                </div>
                                <button type="button" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all text-xs uppercase tracking-widest">Confirmar</button>
                            </form>
                        </div>
                    </div>
                    <div class="col-span-9 space-y-6">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                            <div class="p-6 border-b border-slate-50 flex justify-between items-center">
                                <span class="text-sm font-black uppercase tracking-widest text-slate-800">Maio 2026</span>
                                <button onclick="toggleCalendar()" class="text-[10px] bg-slate-100 text-slate-500 px-3 py-1 rounded-full font-bold uppercase hover:bg-indigo-50 hover:text-indigo-600 transition-all flex items-center gap-1">
                                    <i data-lucide="calendar-days" class="w-3 h-3"></i> <span id="toggle-text">Ver Calendário</span>
                                </button>
                            </div>
                            <div id="calendar-grid" class="calendar-grid-container calendar-collapsed p-4 bg-white"></div>
                        </div>
                        <div id="day-details-card" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                             <p class="text-slate-400 text-sm italic text-center py-8">Agenda do Dia vazia.</p>
                        </div>
                    </div>
                </div>

                <div id="tab-clientes" class="hidden space-y-6 max-w-4xl mx-auto">
                    <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 shadow-sm"><i data-lucide="users" class="w-7 h-7"></i></div>
                                <h3 class="text-xl font-black text-slate-800 tracking-tight">Base de Clientes</h3>
                            </div>
                            <button class="bg-indigo-600 text-white px-6 py-3 rounded-xl text-xs font-bold uppercase tracking-widest">+ Novo Cliente</button>
                        </div>
                        <div id="client-list" class="mt-8 grid grid-cols-2 gap-4">
                            <p class="col-span-2 text-center text-slate-400 py-10">Nenhum cliente cadastrado.</p>
                        </div>
                    </div>
                </div>

                <div id="tab-dashboard" class="hidden space-y-6 max-w-[1600px] mx-auto">
                    <div class="grid grid-cols-2 gap-6">
                        <div class="p-8 bg-emerald-50 rounded-[2rem] border border-emerald-100 flex flex-col justify-between h-48">
                            <div>
                                <p class="text-[10px] font-black text-emerald-600 uppercase mb-2 tracking-widest">Receita Total do Mês</p>
                                <h3 class="text-4xl font-black text-emerald-700">R$ 0,00</h3>
                            </div>
                        </div>
                        <div class="p-8 bg-indigo-50 rounded-[2rem] border border-indigo-100 flex flex-col justify-between h-48">
                            <div>
                                <p class="text-[10px] font-black text-indigo-600 uppercase mb-2 tracking-widest">Receita do Dia</p>
                                <h3 class="text-4xl font-black text-indigo-700">R$ 0,00</h3>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            ['agenda', 'clientes', 'dashboard'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                const btn = document.getElementById(`btn-${t}-dt`);
                if(el) el.classList.add('hidden');
                if(btn) { btn.classList.remove('bg-pet-active'); btn.style.opacity = "0.7"; }
            });

            const activeTab = document.getElementById(`tab-${tab}`);
            const activeBtn = document.getElementById(`btn-${tab}-dt`);
            if(activeTab) activeTab.classList.remove('hidden');
            if(activeBtn) { activeBtn.classList.add('bg-pet-active'); activeBtn.style.opacity = "1"; }
            
            document.getElementById('page-title').innerText = tab === 'dashboard' ? 'Dashboard & Finança' : tab.charAt(0).toUpperCase() + tab.slice(1);
            lucide.createIcons();
        }

        function toggleCalendar() {
            const grid = document.getElementById('calendar-grid');
            const isCollapsed = grid.classList.toggle('calendar-collapsed');
            document.getElementById('toggle-text').innerText = isCollapsed ? 'Ver Calendário' : 'Recolher';
        }

        window.onload = () => {
            const date = new Date();
            document.getElementById('current-date').innerText = date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
            switchTab('agenda');
        };
    </script>
</body>
</html>

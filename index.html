<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet - Gestão Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .hidden { display: none !important; }
        .bg-pet-sidebar { background-color: #1e1b4b; } 
        .bg-pet-active { background-color: #4338ca !important; border-left: 4px solid #818cf8; }
        .client-card-0 { border-left: 4px solid #ef4444; }
        .client-card-1 { border-left: 4px solid #3b82f6; }
        .client-card-2 { border-left: 4px solid #10b981; }
        .client-card-3 { border-left: 4px solid #f59e0b; }
        .client-card-4 { border-left: 4px solid #8b5cf6; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div id="activation-screen" class="fixed inset-0 bg-indigo-950 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full text-center space-y-6">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto">
                <i data-lucide="shield-check" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Ativação Agenda Pet</h2>
            <input type="text" id="license-key-input" placeholder="DIGITE 1234" class="w-full px-4 py-3 border rounded-xl text-center font-mono text-lg uppercase">
            <p id="activation-error" class="text-sm text-rose-600 font-medium hidden">Chave inválida!</p>
            <button onclick="validateLicenseKey()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg">
                Ativar Sistema
            </button>
        </div>
    </div>

    <div id="main-app" class="flex h-screen overflow-hidden hidden">
        
        <div class="w-72 bg-pet-sidebar text-white flex flex-col">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-10">
                    <div class="bg-indigo-400/20 p-2 rounded-xl">
                        <i data-lucide="dog" class="w-8 h-8 text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight">Agenda Pet</h1>
                </div>

                <nav class="space-y-3">
                    <button onclick="switchTab('clientes')" id="btn-clientes" class="flex items-center gap-4 w-full px-5 py-4 rounded-xl text-indigo-100 hover:bg-indigo-800 transition font-medium">
                        <i data-lucide="users" class="w-6 h-6"></i> Cadastro de Cliente
                    </button>
                    
                    <button onclick="switchTab('agenda')" id="btn-agenda" class="flex items-center gap-4 w-full px-5 py-4 rounded-xl text-indigo-100 hover:bg-indigo-800 transition font-medium">
                        <i data-lucide="calendar" class="w-6 h-6"></i> Agenda de Serviço
                    </button>

                    <button onclick="switchTab('dashboard')" id="btn-dashboard" class="flex items-center gap-4 w-full px-5 py-4 rounded-xl text-indigo-100 hover:bg-indigo-800 transition font-medium">
                        <i data-lucide="pie-chart" class="w-6 h-6"></i> Dashboard & Finanças
                    </button>
                </nav>
            </div>
        </div>

        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center sticky top-0 z-10">
                <div class="flex items-center gap-4">
                    <div class="w-2 h-8 bg-indigo-600 rounded-full"></div> 
                    <h2 id="page-title" class="text-2xl font-black text-gray-800 uppercase tracking-tight">Cadastro de Cliente</h2>
                </div>
                <span class="text-sm font-bold bg-indigo-50 text-indigo-700 px-4 py-2 rounded-full" id="current-date"></span>
            </header>

            <main class="p-8 max-w-7xl w-full mx-auto space-y-6">

                <div id="tab-clientes" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                        <h3 class="text-lg font-bold mb-5 flex items-center gap-2 text-indigo-950">
                            <i data-lucide="user-plus" class="w-5 h-5 text-indigo-600"></i> Novo Cliente
                        </h3>
                        <form id="client-form" onsubmit="saveClient(event)" class="space-y-4">
                            <input type="text" id="regClientName" placeholder="Nome do Cliente" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                            <input type="tel" id="regClientPhone" placeholder="Telefone" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                            <input type="text" id="regPetName" placeholder="Nome do Pet" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                                Salvar Cliente
                            </button>
                        </form>
                    </div>
                    <div class="lg:col-span-2 space-y-4">
                        <h3 class="text-xl font-bold text-gray-800">Clientes Cadastrados</h3>
                        <div id="clients-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                    </div>
                </div>

                <div id="tab-agenda" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                        <h3 class="text-lg font-bold mb-5 flex items-center gap-2 text-indigo-950">
                            <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i> Agendar Serviço
                        </h3>
                        <form id="appointment-form" onsubmit="saveAppointment(event)" class="space-y-4">
                            <div class="relative">
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Cliente</label>
                                <input type="text" id="clientName" oninput="autocompleteClient(this.value)" autocomplete="off" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                                <div id="autocomplete-list" class="absolute z-20 w-full bg-white border border-gray-200 rounded-xl mt-1 shadow-xl hidden"></div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Nome do Pet</label>
                                <input type="text" id="petName" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Serviço</label>
                                    <select id="serviceType" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl outline-none">
                                        <option value="Banho">Banho</option>
                                        <option value="Tosa">Tosa</option>
                                        <option value="Banho e Tosa">Banho e Tosa</option>
                                        <option value="Consulta">Consulta</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-gray-400 mb-1">Valor (R$)</label>
                                    <input type="number" id="serviceValue" step="0.01" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl outline-none">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <input type="date" id="serviceDate" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl outline-none">
                                <input type="time" id="serviceTime" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl outline-none">
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                                Confirmar Horário
                            </button>
                        </form>
                    </div>

                    <div class="lg:col-span-2 space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-xl font-bold text-gray-800">Serviços do Dia</h3>
                            <span id="appointment-count" class="text-sm bg-indigo-100 text-indigo-700 font-bold px-4 py-1 rounded-full">0 ativos</span>
                        </div>
                        <div id="appointments-container" class="space-y-4"></div>
                    </div>
                </div>

                <div id="tab-dashboard" class="hidden space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 border-l-4 border-l-emerald-500">
                            <p class="text-xs font-bold text-gray-400 uppercase">Ganhos do Dia</p>
                            <h3 class="text-3xl font-black text-emerald-600" id="kpi-ganhos">R$ 0,00</h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 border-l-4 border-l-blue-500">
                            <p class="text-xs font-bold text-gray-400 uppercase">Quantidade de Pet Concluído</p>
                            <h3 class="text-3xl font-black text-blue-600" id="kpi-concluidos">0</h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 border-l-4 border-l-rose-500">
                            <p class="text-xs font-bold text-gray-400 uppercase">Quantidade de Pet Cancelado</p>
                            <h3 class="text-3xl font-black text-rose-600" id="kpi-cancelados">0</h3>
                        </div>
                    </div>

                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                        <h3 class="text-xl font-bold mb-6 text-gray-800">Desempenho Financeiro por Serviço</h3>
                        <div class="h-[400px]">
                            <canvas id="financeChart"></canvas>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
        const MASTER_LICENSE_KEY = "1234";
        let appointments = JSON.parse(localStorage.getItem('pet_appointments')) || [];
        let clients = JSON.parse(localStorage.getItem('pet_clients')) || [];
        let financeChart = null;

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('pt-BR', {
                weekday: 'long', day: 'numeric', month: 'long'
            });
            
            if (localStorage.getItem('pet_app_activated') === 'true') {
                liberarApp();
            }
        });

        function validateLicenseKey() {
            if (document.getElementById('license-key-input').value === MASTER_LICENSE_KEY) {
                localStorage.setItem('pet_app_activated', 'true');
                liberarApp();
            } else {
                document.getElementById('activation-error').classList.remove('hidden');
            }
        }

        function liberarApp() {
            document.getElementById('activation-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            switchTab('clientes');
            renderAppointments();
            renderClients();
        }

        function switchTab(tab) {
            ['agenda', 'clientes', 'dashboard'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).classList.remove('bg-pet-active');
            });

            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).classList.add('bg-pet-active');
            
            const titles = { 'agenda': 'Agenda de Serviço', 'clientes': 'Cadastro de Cliente', 'dashboard': 'Dashboard & Finanças' };
            document.getElementById('page-title').innerText = titles[tab];
            
            if(tab === 'dashboard') renderDashboard();
        }

        // CLIENTES
        function saveClient(e) {
            e.preventDefault();
            const client = {
                id: Date.now(),
                name: document.getElementById('regClientName').value,
                phone: document.getElementById('regClientPhone').value,
                pet: document.getElementById('regPetName').value,
                colorIndex: clients.length % 5
            };
            clients.push(client);
            localStorage.setItem('pet_clients', JSON.stringify(clients));
            renderClients();
            e.target.reset();
        }

        function renderClients() {
            const container = document.getElementById('clients-list-container');
            container.innerHTML = clients.map(c => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 client-card-${c.colorIndex}">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-gray-800">${c.name}</h4>
                            <p class="text-sm text-gray-500">Pet: ${c.pet}</p>
                            <p class="text-xs text-indigo-600 font-medium">${c.phone}</p>
                        </div>
                        <button onclick="deleteClient(${c.id})" class="text-gray-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function deleteClient(id) {
            clients = clients.filter(c => c.id !== id);
            localStorage.setItem('pet_clients', JSON.stringify(clients));
            renderClients();
        }

        // AUTOCOMPLETE
        function autocompleteClient(val) {
            const list = document.getElementById('autocomplete-list');
            if (!val) { list.classList.add('hidden'); return; }
            const matches = clients.filter(c => c.name.toLowerCase().includes(val.toLowerCase()));
            if (matches.length > 0) {
                list.innerHTML = matches.map(c => `
                    <div onclick="selectClient('${c.name}', '${c.pet}')" class="px-4 py-3 hover:bg-indigo-50 cursor-pointer border-b last:border-0 border-gray-100">
                        <p class="font-bold text-sm">${c.name}</p>
                        <p class="text-xs text-gray-500">Pet: ${c.pet}</p>
                    </div>
                `).join('');
                list.classList.remove('hidden');
            } else { list.classList.add('hidden'); }
        }

        function selectClient(name, pet) {
            document.getElementById('clientName').value = name;
            document.getElementById('petName').value = pet;
            document.getElementById('autocomplete-list').classList.add('hidden');
        }

        // AGENDAMENTOS
        function saveAppointment(e) {
            e.preventDefault();
            const date = document.getElementById('serviceDate').value;
            const time = document.getElementById('serviceTime').value;
            const conflict = appointments.find(a => a.serviceDate === date && a.serviceTime === time && a.status !== 'cancelado');
            if (conflict) { alert("⚠️ Horário já ocupado!"); return; }

            const newApp = {
                id: Date.now(),
                clientName: document.getElementById('clientName').value,
                petName: document.getElementById('petName').value,
                serviceType: document.getElementById('serviceType').value,
                serviceValue: parseFloat(document.getElementById('serviceValue').value),
                serviceDate: date,
                serviceTime: time,
                status: 'pendente'
            };
            appointments.push(newApp);
            localStorage.setItem('pet_appointments', JSON.stringify(appointments));
            renderAppointments();
            e.target.reset();
        }

        function renderAppointments() {
            const container = document.getElementById('appointments-container');
            container.innerHTML = '';
            const sorted = [...appointments].sort((a, b) => (a.serviceDate + a.serviceTime).localeCompare(b.serviceDate + b.serviceTime));
            sorted.forEach(app => {
                const isConcluido = app.status === 'concluido';
                const isCancelado = app.status === 'cancelado';
                container.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center transition-all ${isConcluido || isCancelado ? 'opacity-60' : 'hover:shadow-md border-l-4 border-l-indigo-500'}">
                        <div class="flex items-center gap-4">
                            <div class="bg-indigo-50 p-3 rounded-xl text-indigo-700 font-bold text-center min-w-[70px]">
                                <span class="text-xs block uppercase">${app.serviceTime}</span>
                                <span class="text-lg">${app.serviceDate.split('-')[2]}/${app.serviceDate.split('-')[1]}</span>
                            </div>
                            <div>
                                <h4 class="text-lg font-bold text-gray-900">${app.petName} <span class="text-sm font-normal text-gray-500">/ ${app.clientName}</span></h4>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="bg-gray-100 text-gray-600 text-[10px] font-black uppercase px-2 py-0.5 rounded">${app.serviceType}</span>
                                    <span class="text-sm font-bold text-indigo-600">R$ ${app.serviceValue.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="updateStatus(${app.id}, 'concluido')" class="w-10 h-10 rounded-full flex items-center justify-center ${isConcluido ? 'bg-emerald-600 text-white' : 'bg-emerald-100 text-emerald-600'}"><i data-lucide="check" class="w-5 h-5"></i></button>
                            <button onclick="updateStatus(${app.id}, 'cancelado')" class="w-10 h-10 rounded-full flex items-center justify-center ${isCancelado ? 'bg-rose-600 text-white' : 'bg-rose-100 text-rose-600'}"><i data-lucide="x" class="w-5 h-5"></i></button>
                            <button onclick="deleteApp(${app.id})" class="p-2 text-gray-300 hover:text-gray-600"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
            document.getElementById('appointment-count').innerText = `${appointments.filter(a => a.status === 'pendente').length} ativos`;
        }

        function updateStatus(id, status) {
            appointments = appointments.map(a => a.id === id ? {...a, status: a.status === status ? 'pendente' : status} : a);
            localStorage.setItem('pet_appointments', JSON.stringify(appointments));
            renderAppointments();
        }

        function deleteApp(id) {
            if(confirm("Excluir?")) {
                appointments = appointments.filter(a => a.id !== id);
                localStorage.setItem('pet_appointments', JSON.stringify(appointments));
                renderAppointments();
            }
        }

        // DASHBOARD & FINANCEIRO
        function renderDashboard() {
            const hoje = new Date().toISOString().split('T')[0];
            let ganhosDia = 0, concluidoQtde = 0, canceladoQtde = 0;

            const meses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
            const dadosGrafico = {
                "Banho": new Array(12).fill(0),
                "Tosa": new Array(12).fill(0),
                "Banho e Tosa": new Array(12).fill(0),
                "Consulta": new Array(12).fill(0)
            };

            appointments.forEach(app => {
                const mesApp = new Date(app.serviceDate).getMonth();
                if(app.status === 'concluido') {
                    if(app.serviceDate === hoje) {
                        ganhosDia += app.serviceValue;
                        concluidoQtde++;
                    }
                    if(dadosGrafico[app.serviceType]) {
                        dadosGrafico[app.serviceType][mesApp] += app.serviceValue;
                    }
                } else if (app.status === 'cancelado' && app.serviceDate === hoje) {
                    canceladoQtde++;
                }
            });

            document.getElementById('kpi-ganhos').innerText = `R$ ${ganhosDia.toFixed(2)}`;
            document.getElementById('kpi-concluidos').innerText = concluidoQtde;
            document.getElementById('kpi-cancelados').innerText = canceladoQtde;

            const ctx = document.getElementById('financeChart').getContext('2d');
            if(financeChart) financeChart.destroy();

            financeChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: meses,
                    datasets: [
                        { label: 'Banho', data: dadosGrafico["Banho"], backgroundColor: '#3b82f6' },
                        { label: 'Tosa', data: dadosGrafico["Tosa"], backgroundColor: '#8b5cf6' },
                        { label: 'Banho e Tosa', data: dadosGrafico["Banho e Tosa"], backgroundColor: '#10b981' },
                        { label: 'Consulta', data: dadosGrafico["Consulta"], backgroundColor: '#f59e0b' }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: { y: { beginAtZero: true, ticks: { callback: v => 'R$ ' + v } } }
                }
            });
        }
    </script>
</body>
</html>

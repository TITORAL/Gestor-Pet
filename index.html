<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Pet - Gestão</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background-color:#cbd5e1;border-radius:20px}.hidden{display:none!important}.bg-pet-sidebar{background-color:#312e81}.bg-pet-active{background-color:#4338ca}.fita-azul{width:3px;height:20px;background-color:#3b82f6;border-radius:4px;margin-right:12px}.header-date-badge{background-color:#e0f2fe;color:#0369a1;padding:8px 16px;border-radius:12px;font-weight:600}.error-field{border:2px solid #ef4444!important;animation:shake .2s ease-in-out 0s 2;background-color:#fef2f2!important}@keyframes shake{0%,100%{margin-left:0}25%{margin-left:.5rem}75%{margin-left:-.5rem}}.client-card{background:#fff;transition:all .3s cubic-bezier(.4,0,.2,1);border:1px solid #f1f5f9}.client-card:hover{transform:translateY(-2px);box-shadow:0 10px 15px -3px rgba(0,0,0,.05);border-color:#e2e8f0}.calendar-grid-container{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background-color:#e2e8f0;border:1px solid #e2e8f0;transition:max-height .3s ease-out;overflow:hidden}.calendar-collapsed{max-height:0;border:none}.calendar-cell{background:#fff;min-height:80px;padding:8px;transition:all .2s;cursor:pointer}.calendar-cell:hover{background-color:#f1f5f9}.calendar-cell.selected{background-color:#eef2ff;border:1px solid #4338ca}.cell-day-number{font-size:13px;font-weight:800;color:#1e293b;margin-bottom:4px}.event-dot{width:6px;height:6px;background:#4338ca;border-radius:50%;display:inline-block;margin-right:2px}.status-indicator{width:10px;height:10px;border-radius:50%;display:inline-block;margin-left:6px}.status-done{background-color:#10b981;box-shadow:0 0 8px #10b98166}.status-canceled{background-color:#ef4444;box-shadow:0 0 8px #ef444466}.btn-status{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s}.btn-check{background-color:#ecfdf5;color:#10b981;border:1px solid #10b981}.btn-check.active{background-color:#10b981;color:#fff}.btn-x{background-color:#fef2f2;color:#ef4444;border:1px solid #ef4444}.btn-x.active{background-color:#ef4444;color:#fff}.expandable-clients{transition:all .4s cubic-bezier(.4,0,.2,1);max-height:0;overflow:hidden;opacity:0}.expandable-clients.open{max-height:2000px;opacity:1;margin-top:1.5rem}@media (max-width:768px){.sidebar-desktop{display:none}}
</style>
</head>
<body class="bg-slate-50 text-slate-800">
<div id="main-app" class="flex flex-col md:flex-row h-screen overflow-hidden">
<aside class="sidebar-desktop w-64 bg-pet-sidebar text-white flex flex-col p-6">
<div class="flex items-center gap-3 mb-10"><i data-lucide="dog" class="w-8 h-8 text-indigo-300"></i><h1 class="text-lg font-black tracking-tight uppercase">Agenda Pet</h1></div>
<nav class="space-y-1">
<button onclick="switchTab('agenda')" id="btn-agenda-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold"><i data-lucide="calendar" class="w-4 h-4"></i> Agendamentos</button>
<button onclick="switchTab('clientes')" id="btn-clientes-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70"><i data-lucide="users" class="w-4 h-4"></i> Clientes</button>
<button onclick="switchTab('dashboard')" id="btn-dashboard-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70"><i data-lucide="pie-chart" class="w-4 h-4"></i> Dashboard & Finança</button>
<button onclick="switchTab('gastos')" id="btn-gastos-dt" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl transition text-sm font-semibold opacity-70"><i data-lucide="wallet" class="w-4 h-4"></i> Gastos</button>
</nav>
</aside>
<div class="flex-1 flex flex-col overflow-y-auto">
<header class="bg-white border-b px-8 py-5 flex justify-between items-center sticky top-0 z-40">
<div class="flex items-center"><div class="fita-azul"></div><h2 id="page-title" class="text-lg font-light text-slate-500 uppercase tracking-[0.2em]">Agendamento</h2></div>
<div class="text-right"><span id="current-date" class="header-date-badge text-sm"></span></div>
</header>
<main class="p-4 md:p-8 max-w-[1600px] w-full mx-auto space-y-6">
<div id="tab-agenda" class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
<div class="lg:col-span-3">
<div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
<h3 id="form-title" class="font-bold text-slate-800 text-xs uppercase mb-4 tracking-widest">Agendar</h3>
<form id="appointment-form" onsubmit="handleFormSubmit(event)" class="space-y-3" novalidate>
<input type="hidden" id="edit-id"><input type="text" id="clientNameSearch" placeholder="Tutor" oninput="autoFillPet(this.value);clearError(this)" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl outline-none text-sm"><input type="text" id="petName" placeholder="Pet" oninput="clearError(this)" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl outline-none text-sm">
<div class="grid grid-cols-2 gap-2"><input type="date" id="serviceDate" oninput="clearError(this)" class="w-full px-3 py-3 bg-slate-50 border-none rounded-2xl text-xs outline-none"><input type="time" id="serviceTime" oninput="clearError(this)" class="w-full px-3 py-3 bg-slate-50 border-none rounded-2xl text-xs outline-none"></div>
<select id="serviceType" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-sm outline-none"><option value="Banho">Banho</option><option value="Tosa">Tosa</option><option value="Completo">Banho e Tosa</option></select>
<input type="number" id="serviceValue" placeholder="Valor R$" step="0.01" oninput="clearError(this)" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-sm outline-none"><button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all text-xs uppercase tracking-widest">Confirmar</button>
</form>
</div>
</div>
<div class="lg:col-span-9 space-y-6">
<div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
<div class="p-6 border-b border-slate-50 flex justify-between items-center"><div class="flex items-center gap-4"><span id="cal-month" class="text-sm font-black uppercase tracking-widest text-slate-800"></span><button onclick="toggleCalendar()" class="text-[10px] bg-slate-100 text-slate-500 px-3 py-1 rounded-full font-bold uppercase hover:bg-indigo-50 hover:text-indigo-600 transition-all flex items-center gap-1"><i data-lucide="calendar-days" class="w-3 h-3"></i> <span id="toggle-text">Ver Calendário</span></button></div><div class="flex gap-4"><button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-xl transition"><i data-lucide="chevron-left" class="w-5 h-5 text-slate-400"></i></button><button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-xl transition"><i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i></button></div></div>
<div id="calendar-grid" class="calendar-grid-container calendar-collapsed"></div>
</div>
<div id="day-details-card" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100"><div class="flex justify-between items-center mb-6"><h3 id="selected-day-title" class="font-bold text-indigo-600 text-xs uppercase tracking-widest">Agenda do Dia</h3><div id="selected-date-display" class="text-[10px] font-bold text-slate-400 uppercase">Selecione uma data</div></div><div id="day-appointments-list" class="space-y-3"><p class="text-slate-400 text-sm italic text-center py-8">Escolha um dia no calendário para ver os serviços.</p></div></div>
</div>
</div>
<div id="tab-clientes" class="hidden space-y-6 max-w-4xl mx-auto"><div class="bg-white p-6 md:p-8 rounded-[2rem] shadow-sm border border-slate-100"><div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4"><div class="flex items-center gap-4"><div class="w-14 h-14 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 shadow-sm"><i data-lucide="users" class="w-7 h-7"></i></div><div><h3 class="text-xl font-black text-slate-800 tracking-tight">Clientes</h3><p class="text-slate-400 text-xs font-medium">Base de clientes registrados.</p></div></div><button onclick="toggleClientsView()" id="btn-toggle-clients" class="w-full sm:w-auto bg-slate-100 text-slate-700 hover:bg-indigo-50 px-6 py-3 rounded-xl text-xs font-bold uppercase tracking-widest transition-all flex items-center justify-center gap-2"><i data-lucide="eye" class="w-4 h-4"></i> <span id="text-toggle-clients">Ver Clientes</span></button></div><div id="expanded-clients-container" class="expandable-clients"><div class="flex justify-between items-center mb-6 pt-4 border-t border-slate-100"><span class="text-[10px] font-black uppercase text-slate-400">Listagem Ativa</span><button onclick="toggleClientForm()" class="bg-indigo-600 text-white px-4 py-2.5 rounded-xl text-[11px] font-bold uppercase tracking-widest shadow-md shadow-indigo-100 hover:bg-indigo-700 transition-all flex items-center gap-1.5"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Novo Cadastro</button></div><div id="client-form-container" class="hidden mb-6 bg-slate-50 p-6 rounded-2xl border border-dashed border-slate-200"><form id="reg-client-form" onsubmit="saveClient(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4"><input type="hidden" id="edit-client-index"><div class="space-y-1"><label class="text-[10px] font-black uppercase text-slate-400 ml-1">Tutor</label><input type="text" id="regClientName" required class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl outline-none text-sm"></div><div class="space-y-1"><label class="text-[10px] font-black uppercase text-slate-400 ml-1">Pet</label><input type="text" id="regPet" required class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl outline-none text-sm"></div><div class="space-y-1"><label class="text-[10px] font-black uppercase text-slate-400 ml-1">WhatsApp</label><input type="tel" id="regPhone" required class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl outline-none text-sm"></div><div class="space-y-1"><label class="text-[10px] font-black uppercase text-slate-400 ml-1">Endereço</label><input type="text" id="regAddress" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl outline-none text-sm"></div><div class="md:col-span-2 flex justify-end gap-2 pt-2"><button type="button" onclick="toggleClientForm()" class="px-4 py-2 text-xs font-bold text-slate-400 uppercase">Cancelar</button><button class="bg-indigo-900 text-white px-6 py-2 rounded-xl text-xs font-bold uppercase tracking-widest">Salvar</button></div></form></div><div id="client-list-bi" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div></div></div></div>
<div id="tab-dashboard" class="hidden space-y-6 max-w-[1600px] mx-auto"><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="p-8 bg-emerald-50 rounded-[2rem] border border-emerald-100 flex flex-col justify-between h-48 relative"><div><p class="text-[10px] font-black text-emerald-600 uppercase mb-2 tracking-widest">Receita Total do Mês</p><h3 class="text-4xl font-black text-emerald-700" id="kpi-ganhos">R$ 0,00</h3></div><div class="absolute top-6 right-6"><div class="relative"><select onchange="changeDashboardMonth(this.value)" id="dash-month-select" class="appearance-none bg-white text-emerald-700 pl-8 pr-7 py-1.5 rounded-xl text-[11px] font-bold uppercase tracking-wider border border-emerald-200/60 cursor-pointer outline-none shadow-sm"><option value="0">Jan</option><option value="1">Fev</option><option value="2">Mar</option><option value="3">Abr</option><option value="4">Mai</option><option value="5">Jun</option><option value="6">Jul</option><option value="7">Ago</option><option value="8">Set</option><option value="9">Out</option><option value="10">Nov</option><option value="11">Dez</option></select><i data-lucide="calendar" class="w-3.5 h-3.5 text-emerald-600 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i><i data-lucide="chevron-down" class="w-3.5 h-3.5 text-emerald-600 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none"></i></div></div></div><div class="p-8 bg-indigo-50 rounded-[2rem] border border-indigo-100 flex flex-col justify-between h-48 relative"><div><p class="text-[10px] font-black text-indigo-600 uppercase mb-2 tracking-widest">Receita do Dia</p><h3 class="text-4xl font-black text-indigo-700" id="kpi-receita-dia">R$ 0,00</h3></div><div class="absolute top-6 right-6"><div class="relative"><input type="date" onchange="changeDashboardDay(this.value)" id="dash-day-select" class="bg-white text-indigo-700 pl-8 pr-3 py-1.5 rounded-xl text-[11px] font-bold uppercase border border-indigo-200/60 outline-none shadow-sm"><i data-lucide="calendar-days" class="w-3.5 h-3.5 text-indigo-600 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i></div></div></div></div></div>
<div id="tab-gastos" class="hidden p-4 space-y-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
<div class="flex justify-between items-center mb-4">
<h3 class="font-black text-slate-800 uppercase text-sm tracking-widest">Despesas Fixas</h3>
<span id="data-fixa" class="text-[10px] font-bold text-slate-400"></span>
</div>
<div class="flex gap-2 mb-4">
<input type="text" id="fixa-nome" placeholder="Produto/Serviço" class="flex-1 text-sm p-2 rounded-xl border-slate-200 border">
<input type="number" id="fixa-valor" placeholder="R$ 0,00" class="w-24 text-sm p-2 rounded-xl border-slate-200 border">
<button onclick="addDespesa('fixa')" class="bg-indigo-600 text-white p-2 rounded-xl hover:bg-indigo-700 transition-all">
<i data-lucide="plus" class="w-5 h-5"></i>
</button>
</div>
<div class="h-40 w-full mb-4">
<canvas id="chartFixa"></canvas>
</div>
<div id="lista-fixa" class="space-y-2 max-h-40 overflow-y-auto"></div>
</div>
<div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
<div class="flex justify-between items-center mb-4">
<h3 class="font-black text-slate-800 uppercase text-sm tracking-widest">Despesas Variáveis</h3>
<span id="data-variavel" class="text-[10px] font-bold text-slate-400"></span>
</div>
<div class="flex gap-2 mb-4">
<input type="text" id="var-nome" placeholder="Produto/Serviço" class="flex-1 text-sm p-2 rounded-xl border-slate-200 border">
<input type="number" id="var-valor" placeholder="R$ 0,00" class="w-24 text-sm p-2 rounded-xl border-slate-200 border">
<button onclick="addDespesa('var')" class="bg-emerald-500 text-white p-2 rounded-xl hover:bg-emerald-600 transition-all">
<i data-lucide="plus" class="w-5 h-5"></i>
</button>
</div>
<div class="h-40 w-full mb-4">
<canvas id="chartVariavel"></canvas>
</div>
<div id="lista-var" class="space-y-2 max-h-40 overflow-y-auto"></div>
</div>
</div>
</div>
<script>
let appointments = JSON.parse(localStorage.getItem('pet_appointments')) || [];
let clients = JSON.parse(localStorage.getItem('pet_clients')) || [];
let despesas = JSON.parse(localStorage.getItem('pet_despesas')) || { fixa: [], var: [] };
let charts = {};
function updateDates() {
const agora = new Date();
const dataFormatada = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' });
if(document.getElementById('data-fixa')) document.getElementById('data-fixa').innerText = dataFormatada;
if(document.getElementById('data-variavel')) document.getElementById('data-variavel').innerText = dataFormatada;
}
function initChart(id, label, color) {
const canvas = document.getElementById(id);
if(!canvas) return null;
const ctx = canvas.getContext('2d');
return new Chart(ctx, {
type: 'bar',
data: { 
labels: [], 
datasets: [{ 
label: label, 
data: [], 
backgroundColor: color,
borderRadius: 8,
barThickness: 15
}] 
},
options: { 
responsive: true, 
maintainAspectRatio: false, 
plugins: { legend: { display: false } },
scales: { 
y: { beginAtZero: true, grid: { display: false }, ticks: { display: false } },
x: { grid: { display: false }, ticks: { font: { size: 10 } } }
} 
}
});
}
function renderGastos() {
['fixa', 'var'].forEach(tipo => {
const lista = document.getElementById(`lista-${tipo}`);
if(!lista) return;
lista.innerHTML = '';
const labels = [];
const valores = [];
const cores = [];
despesas[tipo].forEach((item, index) => {
labels.push(item.nome);
valores.push(item.valor);
cores.push(tipo === 'fixa' ? '#6366f1' : '#10b981');
lista.innerHTML += `
<div class="flex justify-between items-center bg-slate-50 p-2 rounded-xl border border-slate-100">
<div class="flex flex-col">
<span class="text-xs font-bold text-slate-700">${item.nome}</span>
<span class="text-[10px] text-slate-500 font-black">R$ ${item.valor.toFixed(2)}</span>
</div>
<div class="flex gap-1">
<button onclick="editDespesa('${tipo}', ${index})" class="p-1.5 text-blue-500 hover:bg-blue-50 rounded-lg"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
<button onclick="deleteDespesa('${tipo}', ${index})" class="p-1.5 text-rose-500 hover:bg-rose-50 rounded-lg"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
</div>
</div>`;
});
const chartObj = tipo === 'fixa' ? charts.chartFixa : charts.chartVariavel;
if(chartObj) {
chartObj.data.labels = labels;
chartObj.data.datasets[0].data = valores;
chartObj.data.datasets[0].backgroundColor = cores;
chartObj.update();
}
});
if(typeof lucide !== 'undefined') lucide.createIcons();
localStorage.setItem('pet_despesas', JSON.stringify(despesas));
}
function addDespesa(tipo) {
const nomeInput = document.getElementById(`${tipo}-nome`);
const valorInput = document.getElementById(`${tipo}-valor`);
const nome = nomeInput.value;
const valor = parseFloat(valorInput.value);
if (nome && valor) {
despesas[tipo].push({ nome, valor });
nomeInput.value = '';
valorInput.value = '';
renderGastos();
} else {
alert("Preencha nome e valor corretamente.");
}
}
function deleteDespesa(tipo, index) {
if(confirm("Excluir este gasto?")) {
despesas[tipo].splice(index, 1);
renderGastos();
}
}
function editDespesa(tipo, index) {
const item = despesas[tipo][index];
const novoNome = prompt("Novo nome:", item.nome);
const novoValor = prompt("Novo valor:", item.valor);
if(novoNome && novoValor) {
despesas[tipo][index] = { nome: novoNome, valor: parseFloat(novoValor) };
renderGastos();
}
}
window.onload = () => {
charts.chartFixa = initChart('chartFixa', 'Fixas', '#6366f1');
charts.chartVariavel = initChart('chartVariavel', 'Variáveis', '#10b981');
updateDates();
renderGastos();
switchTab(localStorage.getItem('pet_last_tab') || 'agenda');
};
</script>
</body>
</html>

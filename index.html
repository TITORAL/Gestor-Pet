<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pet - Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .hidden { display: none !important; }
        
        .bg-pet-sidebar { background-color: #312e81; } 
        .bg-pet-active { background-color: #4338ca; }
        
        .fita-azul { width: 3px; height: 20px; background-color: #3b82f6; border-radius: 4px; margin-right: 12px; }
        
        .header-date-badge {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
        }

        .calendar-grid-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #e2e8f0;
            border: 1px solid #e2e8f0;
        }
        .calendar-cell {
            background: white;
            min-height: 80px;
            padding: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .calendar-cell:hover { background-color: #f1f5f9; }
        .calendar-cell.selected { background-color: #eef2ff; border: 1px solid #4338ca; }
        
        .cell-day-number { font-size: 13px; font-weight: 800; color: #1e293b; margin-bottom: 4px; }
        
        .event-dot {
            width: 6px;
            height: 6px;
            background: #4338ca;
            border-radius: 50%;
            display: inline-block;
            margin-right: 2px;
        }

        .btn-status { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .btn-check { background-color: #ecfdf5; color: #10b981; border: 1px solid #10b981; }
        .btn-check.active { background-color: #10b981; color: white; }
        .btn-x { background-color: #fef2f2; color: #ef4444; border: 1px solid #ef4444; }
        .btn-x.active { background-color: #ef4444; color: white; }

        @media (max-width: 768px) {
            .sidebar-desktop { display: none; }
            .mobile-nav { display: flex; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="main-app" class="flex flex-col md:flex-row h-screen overflow-hidden">
        
        <aside class="sidebar-desktop w-64 bg-pet-sidebar text-white flex flex-col p-6">
            <div class="flex items-center gap-3 mb-10">
                <i data-lucide="dog" class="w-8 h-8 text-indigo-300"></i>
                <h1 class="text-lg font-black tracking-tight uppercase">Agenda Pet</h1>
            </div>
            <nav class="space-y-1">
                <button onclick="switchTab('agenda')" id="btn-agenda-dt" class="nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl bg-pet-active transition text-sm font-semibold">
                    <i data-lucide="calendar" class="w-4 h-4"></i> Agendamentos
                </button>
                <button onclick="switchTab('clientes')" id="btn-clientes-dt" class="nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl hover:bg-indigo-800 transition text-sm font-semibold opacity-70">
                    <i data-lucide="users" class="w-4 h-4"></i> Clientes
                </button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard-dt" class="nav-btn flex items-center gap-3 w-full px-4 py-3 rounded-xl hover:bg-indigo-800 transition text-sm font-semibold opacity-70">
                    <i data-lucide="pie-chart" class="w-4 h-4"></i> Financeiro
                </button>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col overflow-y-auto main-content">
            <header class="bg-white border-b px-8 py-5 flex justify-between items-center sticky top-0 z-40">
                <div class="flex items-center">
                    <div class="fita-azul"></div>
                    <h2 id="page-title" class="text-lg font-light text-slate-500 uppercase tracking-[0.2em]">Agendamento</h2>
                </div>
                <div class="text-right">
                    <span id="current-date" class="header-date-badge text-sm"></span>
                </div>
            </header>

            <main class="p-4 md:p-8 max-w-[1600px] w-full mx-auto space-y-6">

                <div id="tab-agenda" class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <div class="lg:col-span-3">
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <h3 id="form-title" class="font-bold text-slate-800 text-xs uppercase mb-4 tracking-widest">Agendar</h3>
                            <form id="appointment-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
                                <input type="hidden" id="edit-id">
                                <input type="text" id="clientNameSearch" placeholder="Tutor" oninput="autoFillPet(this.value)" required class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <input type="text" id="petName" placeholder="Pet" required class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="date" id="serviceDate" required class="w-full px-3 py-3 bg-slate-50 border-none rounded-2xl text-xs outline-none">
                                    <input type="time" id="serviceTime" required class="w-full px-3 py-3 bg-slate-50 border-none rounded-2xl text-xs outline-none">
                                </div>
                                <select id="serviceType" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-sm outline-none">
                                    <option value="Banho">Banho</option>
                                    <option value="Tosa">Tosa</option>
                                    <option value="Completo">Banho e Tosa</option>
                                </select>
                                <input type="number" id="serviceValue" placeholder="Valor R$" step="0.01" required class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-sm outline-none">
                                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all text-xs uppercase tracking-widest">Confirmar</button>
                            </form>
                        </div>
                    </div>

                    <div class="lg:col-span-9 space-y-6">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                            <div class="p-6 border-b border-slate-50 flex justify-between items-center">
                                <span id="cal-month" class="text-sm font-black uppercase tracking-widest text-slate-800"></span>
                                <div class="flex gap-4">
                                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-xl transition"><i data-lucide="chevron-left" class="w-5 h-5 text-slate-400"></i></button>
                                    <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-xl transition"><i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i></button>
                                </div>
                            </div>
                            <div class="grid grid-cols-7 text-center py-3 bg-slate-50 border-b border-slate-100 text-[11px] font-extrabold text-slate-500 uppercase">
                                <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
                            </div>
                            <div id="calendar-grid" class="calendar-grid-container"></div>
                        </div>

                        <div id="day-details-card" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 hidden">
                            <div class="flex justify-between items-center mb-6">
                                <h3 id="selected-day-title" class="font-bold text-indigo-600 text-xs uppercase tracking-widest">Serviços do Dia</h3>
                                <button onclick="closeDayDetails()" class="text-slate-300 hover:text-slate-500"><i data-lucide="x" class="w-5 h-5"></i></button>
                            </div>
                            <div id="day-appointments-list" class="space-y-3"></div>
                        </div>
                    </div>
                </div>

                <div id="tab-clientes" class="hidden bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 min-h-[600px] flex flex-col items-center">
                    <div class="w-full max-w-md space-y-8">
                        <div class="text-center">
                            <h3 class="font-bold text-slate-800 uppercase text-xs tracking-[0.2em] mb-6">Novo Cadastro</h3>
                            <form onsubmit="saveClient(event)" class="space-y-3">
                                <input type="text" id="regClientName" placeholder="Nome do Tutor" required class="w-full px-4 py-4 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <input type="tel" id="regPhone" placeholder="WhatsApp" required class="w-full px-4 py-4 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <input type="text" id="regPet" placeholder="Nome do Pet" required class="w-full px-4 py-4 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                                <button class="w-full bg-indigo-900 text-white font-bold py-4 rounded-2xl text-xs uppercase tracking-widest">Salvar Cliente</button>
                            </form>
                        </div>
                        <div class="space-y-4">
                            <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b pb-2">Clientes Registrados</h4>
                            <div id="client-list-bi" class="divide-y divide-slate-50"></div>
                        </div>
                    </div>
                </div>

                <div id="tab-dashboard" class="hidden bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 min-h-[600px]">
                    <h3 class="font-bold text-slate-800 uppercase text-xs tracking-[0.2em] mb-8">Resumo Financeiro</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="p-8 bg-emerald-50 rounded-3xl border border-emerald-100">
                            <p class="text-[10px] font-black text-emerald-600 uppercase mb-2">Receita Total</p>
                            <h3 class="text-3xl font-black text-emerald-700" id="kpi-ganhos">R$ 0,00</h3>
                        </div>
                        <div class="p-8 bg-rose-50 rounded-3xl border border-rose-100">
                            <p class="text-[10px] font-black text-rose-600 uppercase mb-2">Perda (Cancelados)</p>
                            <h3 class="text-3xl font-black text-rose-700" id="kpi-perdas">R$ 0,00</h3>
                        </div>
                        <div class="p-8 bg-indigo-50 rounded-3xl border border-indigo-100">
                            <p class="text-[10px] font-black text-indigo-600 uppercase mb-2">Saldo Previsto</p>
                            <h3 class="text-3xl font-black text-indigo-700" id="kpi-saldo">R$ 0,00</h3>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script>
        let appointments = JSON.parse(localStorage.getItem('pet_appointments')) || [];
        let clients = JSON.parse(localStorage.getItem('pet_clients')) || [];
        let currentCalDate = new Date();
        let selectedDateStr = "";

        function switchTab(tab) {
            // Esconde todas e remove ativos
            ['agenda', 'clientes', 'dashboard'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}-dt`).classList.remove('bg-pet-active');
                document.getElementById(`btn-${t}-dt`).style.opacity = "0.7";
            });

            // Mostra a selecionada
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            const btn = document.getElementById(`btn-${tab}-dt`);
            btn.classList.add('bg-pet-active');
            btn.style.opacity = "1";

            // Atualiza Título e Dados
            document.getElementById('page-title').innerText = { 'agenda': 'Agendamentos', 'clientes': 'Clientes', 'dashboard': 'Financeiro' }[tab];
            
            if(tab === 'clientes') renderClientList();
            if(tab === 'dashboard') updateDashboard();
            if(tab === 'agenda') renderCalendar();
            
            lucide.createIcons();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthLabel = document.getElementById('cal-month');
            grid.innerHTML = '';
            
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();
            monthLabel.innerText = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(currentCalDate).toUpperCase();

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div class="calendar-cell bg-slate-50/50"></div>';

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dailyApps = appointments.filter(a => a.serviceDate === dateStr);
                const isSelected = selectedDateStr === dateStr;
                let dots = dailyApps.map(() => '<span class="event-dot"></span>').join('');

                grid.innerHTML += `
                    <div onclick="showDayDetails('${dateStr}')" class="calendar-cell ${isSelected ? 'selected' : ''}">
                        <div class="cell-day-number">${day}</div>
                        <div class="flex flex-wrap gap-0.5">${dots}</div>
                    </div>`;
            }
        }

        function showDayDetails(dateStr) {
            selectedDateStr = dateStr;
            const detailsCard = document.getElementById('day-details-card');
            const list = document.getElementById('day-appointments-list');
            const [y, m, d] = dateStr.split('-');
            
            document.getElementById('selected-day-title').innerText = `Serviços de ${d}/${m}/${y}`;
            detailsCard.classList.remove('hidden');
            renderCalendar();

            const dailyApps = appointments.filter(a => a.serviceDate === dateStr);
            list.innerHTML = dailyApps.length ? '' : '<p class="text-slate-400 text-sm italic">Nenhum serviço para este dia.</p>';

            dailyApps.sort((a,b) => a.serviceTime.localeCompare(b.serviceTime)).forEach(app => {
                const isConcluido = app.status === 'concluido';
                const isCancelado = app.status === 'cancelado';
                list.innerHTML += `
                    <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100">
                        <div class="flex items-center gap-4">
                            <span class="text-xs font-black text-indigo-600 bg-white px-2 py-1 rounded-lg border">${app.serviceTime}</span>
                            <div>
                                <p class="text-sm font-black text-slate-800">${app.petName} <span class="text-[10px] text-slate-400 font-normal">(${app.clientName})</span></p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="updateStatus(${app.id}, 'concluido')" class="btn-status btn-check ${isConcluido ? 'active' : ''}"><i data-lucide="check" class="w-4 h-4"></i></button>
                            <button onclick="updateStatus(${app.id}, 'cancelado')" class="btn-status btn-x ${isCancelado ? 'active' : ''}"><i data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                    </div>`;
            });
            lucide.createIcons();
        }

        function closeDayDetails() { selectedDateStr = ""; document.getElementById('day-details-card').classList.add('hidden'); renderCalendar(); }
        function changeMonth(dir) { currentCalDate.setMonth(currentCalDate.getMonth() + dir); closeDayDetails(); }

        function renderClientList() {
            const list = document.getElementById('client-list-bi');
            list.innerHTML = '';
            if(clients.length === 0) {
                list.innerHTML = '<p class="p-8 text-center text-slate-300 italic text-sm">Nenhum cliente salvo.</p>';
                return;
            }
            clients.sort((a,b) => a.name.localeCompare(b.name)).forEach(c => {
                list.innerHTML += `<div class="px-6 py-4 flex justify-between items-center hover:bg-slate-50 transition rounded-xl">
                    <div class="text-sm font-black uppercase">${c.name}<p class="text-[10px] text-indigo-500 font-bold tracking-tighter">${c.pet}</p></div>
                    <span class="text-xs text-slate-400 font-bold">${c.phone}</span>
                </div>`;
            });
        }

        function updateDashboard() {
            let ganhos = 0, perdas = 0;
            appointments.forEach(a => {
                if(a.status === 'concluido') ganhos += a.serviceValue;
                else if(a.status === 'cancelado') perdas += a.serviceValue;
            });
            document.getElementById('kpi-ganhos').innerText = `R$ ${ganhos.toFixed(2)}`;
            document.getElementById('kpi-perdas').innerText = `R$ ${perdas.toFixed(2)}`;
            document.getElementById('kpi-saldo').innerText = `R$ ${(ganhos - perdas).toFixed(2)}`;
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const data = {
                id: Date.now(),
                clientName: document.getElementById('clientNameSearch').value,
                petName: document.getElementById('petName').value,
                serviceType: document.getElementById('serviceType').value,
                serviceValue: parseFloat(document.getElementById('serviceValue').value),
                serviceDate: document.getElementById('serviceDate').value,
                serviceTime: document.getElementById('serviceTime').value,
                status: 'pendente'
            };
            appointments.push(data);
            localStorage.setItem('pet_appointments', JSON.stringify(appointments));
            e.target.reset();
            renderCalendar();
        }

        function saveClient(e) {
            e.preventDefault();
            clients.push({
                name: document.getElementById('regClientName').value,
                phone: document.getElementById('regPhone').value,
                pet: document.getElementById('regPet').value
            });
            localStorage.setItem('pet_clients', JSON.stringify(clients));
            e.target.reset();
            renderClientList();
        }

        function updateStatus(id, status) {
            appointments = appointments.map(a => a.id === id ? {...a, status: a.status === status ? 'pendente' : status} : a);
            localStorage.setItem('pet_appointments', JSON.stringify(appointments));
            showDayDetails(selectedDateStr);
        }

        function autoFillPet(name) {
            const found = clients.find(c => c.name.toLowerCase().includes(name.toLowerCase()));
            if (found && name.length > 2) document.getElementById('petName').value = found.pet;
        }

        window.onload = () => {
            const d = new Date();
            const formatada = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('current-date').innerText = formatada.split(' ').map(w => w.length > 2 ? w.charAt(0).toUpperCase() + w.slice(1) : w).join(' ');
            renderCalendar();
            lucide.createIcons();
        };
    </script>
</body>
</html>
